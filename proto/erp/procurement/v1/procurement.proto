syntax = "proto3";

package erp.procurement.v1;

import "erp/common/v1/pagination.proto";

option go_package = "github.com/sgao19/erp-go/gen/go/erp/procurement/v1;procurementv1";

// SourcingService owns pre-sale inquiry review. It lives in the procurement
// bounded context but is deliberately separate from committed requirements
// and purchase orders.
service SourcingService {
  rpc CreateCase(CreateCaseRequest) returns (CreateCaseResponse);
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  rpc GetCase(GetCaseRequest) returns (GetCaseResponse);
  rpc AddLine(AddLineRequest) returns (AddLineResponse);
  rpc ConfirmLines(ConfirmLinesRequest) returns (ConfirmLinesResponse);
  rpc ReviewLine(ReviewLineRequest) returns (ReviewLineResponse);
  rpc CreateFactoryRfq(CreateFactoryRfqRequest) returns (CreateFactoryRfqResponse);
  rpc ListFactoryRfqs(ListFactoryRfqsRequest) returns (ListFactoryRfqsResponse);
  rpc CreateSupplierQuote(CreateSupplierQuoteRequest) returns (CreateSupplierQuoteResponse);
  rpc GetFactoryRfqWorkbook(GetFactoryRfqWorkbookRequest) returns (GetFactoryRfqWorkbookResponse);
  rpc ImportSupplierQuoteWorkbook(ImportSupplierQuoteWorkbookRequest) returns (ImportSupplierQuoteWorkbookResponse);
  rpc MarkFactoryRfqSent(MarkFactoryRfqSentRequest) returns (MarkFactoryRfqSentResponse);
  rpc ListSupplierQuoteComparison(ListSupplierQuoteComparisonRequest) returns (ListSupplierQuoteComparisonResponse);
  rpc CreateCostScenario(CreateCostScenarioRequest) returns (CreateCostScenarioResponse);
  rpc ListCostScenarios(ListCostScenariosRequest) returns (ListCostScenariosResponse);
  rpc GetCostScenario(GetCostScenarioRequest) returns (GetCostScenarioResponse);
  rpc ConfirmCostScenario(ConfirmCostScenarioRequest) returns (ConfirmCostScenarioResponse);
  rpc PrepareCustomerQuotation(PrepareCustomerQuotationRequest) returns (PrepareCustomerQuotationResponse);
  rpc LinkCustomerQuotation(LinkCustomerQuotationRequest) returns (LinkCustomerQuotationResponse);
  rpc ListCaseChanges(ListCaseChangesRequest) returns (ListCaseChangesResponse);
  rpc UpdateFactoryRfq(UpdateFactoryRfqRequest) returns (UpdateFactoryRfqResponse);
  // The workbench's chase list (B4): RFQs past their reply deadline,
  // most overdue first, fenced like the case list it derives from.
  rpc ListOverdueFactoryRfqs(ListOverdueFactoryRfqsRequest) returns (ListOverdueFactoryRfqsResponse);
}

message ListOverdueFactoryRfqsRequest { int32 limit = 1; }
message OverdueFactoryRfq {
  int64 id = 1;
  string rfq_no = 2;
  int64 case_id = 3;
  string case_no = 4;
  string supplier_name = 5;
  string response_due_at = 6; // YYYY-MM-DD
  int32 overdue_days = 7;
}
message ListOverdueFactoryRfqsResponse { repeated OverdueFactoryRfq items = 1; }

message SourcingLineInput {
  string raw_text = 1;
  string product = 2;
  string material_standard = 3;
  string grade = 4;
  string thickness = 5;
  string width = 6;
  string length_or_form = 7;
  string surface_requirement = 8;
  string coating = 9;
  string tolerance = 10;
  string coil_weight = 11;
  string coil_id = 12;
  string packaging = 13;
  string delivery = 14;
  string payment_terms = 15;
  string incoterm = 16;
  string port = 17;
  string quantity_unit = 18;
  string remarks = 19;
  string quantity = 20;
  // custom.* template columns land here, keyed by field key (no custom. prefix
  // stripping: the key is the identity the template owns).
  map<string, string> custom_fields = 21;
}

message SourcingLine {
  int64 id = 1;
  int32 line_no = 2;
  SourcingLineInput extracted = 3;
  int64 product_id = 4;
  int64 sku_id = 5;
  int64 uom_id = 6;
  string decision = 7;
  string decided_by_name = 8;
  string decided_at = 9;
  int32 revision_no = 10;
}

message SourcingCase {
  int64 id = 1;
  string case_no = 2;
  string title = 3;
  int64 customer_id = 4;
  string customer_name = 5;
  string contact_name = 6;
  string contact_email = 7;
  int64 source_mail_id = 8;
  int64 source_attachment_id = 9;
  string status = 10;
  int64 owner_id = 11;
  string owner_name = 12;
  string created_at = 13;
  string updated_at = 14;
  repeated SourcingLine lines = 15;
  string source_file_name = 16;
  // The inquiry template layout this case was read with.
  int64 inquiry_template_id = 17;
  string inquiry_template_code = 18;
  int32 inquiry_template_version = 19;
  // Fresh presigned download of the original inquiry file; empty when the
  // case predates object storage. Populated on Get only.
  string source_file_url = 20;
}

message CreateCaseRequest {
  string title = 1;
  int64 customer_id = 2;
  string customer_name = 3;
  string contact_name = 4;
  string contact_email = 5;
  int64 source_mail_id = 6;
  int64 source_attachment_id = 7;
  repeated SourcingLineInput lines = 8;
  string source_file_name = 9;
  string source_content_type = 10;
  bytes source_file_data = 11;
  // The immutable inquiry-template version used to produce/parse this case.
  int64 inquiry_template_id = 12;
  string inquiry_template_code = 13;
  int32 inquiry_template_version = 14;
}

message CreateCaseResponse { SourcingCase sourcing_case = 1; }

message ListCasesRequest {
  erp.common.v1.PageRequest page = 1;
  string status = 2;
  string keyword = 3;
}

message ListCasesResponse {
  repeated SourcingCase sourcing_cases = 1;
  erp.common.v1.PageMeta meta = 2;
}

message GetCaseRequest { int64 id = 1; }
message GetCaseResponse { SourcingCase sourcing_case = 1; }
message AddLineRequest { int64 case_id = 1; SourcingLineInput extracted = 2; }
message AddLineResponse { SourcingCase sourcing_case = 1; }
message ConfirmLinesRequest { int64 case_id = 1; repeated int64 sourcing_line_ids = 2; }
message ConfirmLinesResponse { SourcingCase sourcing_case = 1; }
message ReviewLineRequest {
  int64 case_id = 1; int64 line_id = 2; SourcingLineInput extracted = 3;
  int64 product_id = 4; int64 sku_id = 5; int64 uom_id = 6;
  string decision = 7;
  string reason = 8;
}
message ReviewLineResponse { SourcingCase sourcing_case = 1; }

message FactoryRfq {
  int64 id = 1; int64 case_id = 2; string rfq_no = 3; int64 supplier_id = 4;
  string supplier_code = 5; string supplier_name = 6; string contact_email = 7;
  string currency = 8; string response_due_at = 9; string status = 10;
  int32 line_count = 11; string created_at = 12; repeated int64 sourcing_line_ids = 13;
  int64 factory_id = 14; string factory_code = 15; string factory_name = 16;
  string inquiry_channel = 17; string contact_name = 18; string contact_value = 19;
  string contacted_at = 20; string inquiry_note = 21; int32 round_no = 22;
}
message CreateFactoryRfqRequest {
  int64 case_id = 1; int64 supplier_id = 2; string contact_email = 3;
  string currency = 4; string response_due_at = 5; repeated int64 sourcing_line_ids = 6;
  int64 factory_id = 7; string factory_code = 8; string factory_name = 9;
  string inquiry_channel = 10; string contact_name = 11; string contact_value = 12;
  string contacted_at = 13; string inquiry_note = 14; int32 round_no = 15;
}
message CreateFactoryRfqResponse { FactoryRfq factory_rfq = 1; }
message ListFactoryRfqsRequest { int64 case_id = 1; }
message ListFactoryRfqsResponse { repeated FactoryRfq factory_rfqs = 1; }

message SourcingCaseChange {
  int64 id = 1; string section = 2; string action = 3; int64 entity_id = 4;
  string summary = 5; string before_json = 6; string after_json = 7;
  string reason = 8; int64 operator_id = 9; string operator_name = 10; string created_at = 11;
}
message ListCaseChangesRequest { int64 case_id = 1; }
message ListCaseChangesResponse { repeated SourcingCaseChange changes = 1; }
message UpdateFactoryRfqRequest {
  int64 id = 1; string contact_email = 2; string response_due_at = 3; string reason = 4;
  string inquiry_channel = 5;
  string contact_name = 6;
  string contact_value = 7;
  string contacted_at = 8;
  string inquiry_note = 9;
}
message UpdateFactoryRfqResponse { FactoryRfq factory_rfq = 1; }

message GetFactoryRfqWorkbookRequest { int64 id = 1; }
message GetFactoryRfqWorkbookResponse {
  string file_name = 1;
  bytes file_data = 2;
  string rfq_no = 3;
  string supplier_name = 4;
  string contact_email = 5;
  string currency = 6;
  string response_due_at = 7;
}

message SupplierQuoteLineInput {
  int64 sourcing_line_id = 1; string qty = 2; string unit_price = 3;
  string moq = 4; string lead_time = 5; string remark = 6;
}
message CreateSupplierQuoteRequest {
  int64 factory_rfq_id = 1; string quoted_at = 2; string valid_until = 3;
  string currency = 4; string payment_terms = 5; string delivery = 6;
  string remark = 7; string source = 8; repeated SupplierQuoteLineInput lines = 9;
  string confirmation_status = 10; string evidence_note = 11;
}
message CreateSupplierQuoteResponse { int64 id = 1; string supplier_quote_no = 2; int32 version_no = 3; }
message ImportSupplierQuoteWorkbookRequest {
  int64 factory_rfq_id = 1;
  bytes file_data = 2;
  string quoted_at = 3;
  string valid_until = 4;
  string currency = 5;
  string payment_terms = 6;
  string delivery = 7;
  string remark = 8;
}
message ImportSupplierQuoteWorkbookResponse { int64 id = 1; string supplier_quote_no = 2; }
message MarkFactoryRfqSentRequest { int64 id = 1; }
message MarkFactoryRfqSentResponse { string status = 1; }
message ListSupplierQuoteComparisonRequest { int64 case_id = 1; }
message SupplierQuoteComparisonLine {
  int64 quote_id = 1; string supplier_quote_no = 2; int64 factory_rfq_id = 3;
  int64 supplier_id = 4; string supplier_name = 5; string currency = 6;
  string quoted_at = 7; string valid_until = 8; string payment_terms = 9;
  string delivery = 10; string quote_remark = 11; string source = 12;
  int64 sourcing_line_id = 13; string qty = 14; string unit_price = 15;
  string amount = 16; string moq = 17; string lead_time = 18; string line_remark = 19;
  int64 quote_line_id = 20;
  int32 version_no = 21; string confirmation_status = 22; string evidence_note = 23;
  // Unit price expressed in the comparison currency, so a CNY quote and a
  // USD quote for the same product rank on one axis. Display-only, computed
  // at read time from the latest rate; empty when fx is unreachable — the
  // original currency and price above are the record, this is the lens.
  string compare_price = 24;
  string compare_currency = 25;
}
message ListSupplierQuoteComparisonResponse { repeated SupplierQuoteComparisonLine lines = 1; }

message CostSelectionInput { int64 sourcing_line_id = 1; int64 supplier_quote_line_id = 2; }
message CostChargeInput {
  string charge_type = 1; string basis = 2; string description = 3;
  string origin_port = 4; string destination_port = 5; string container_type = 6;
  string amount = 7; string currency = 8; string effective_at = 9;
  string valid_until = 10; string source = 11; string remark = 12;
}
message CostCharge {
  int64 id = 1; string charge_type = 2; string basis = 3; string description = 4;
  string origin_port = 5; string destination_port = 6; string container_type = 7;
  string amount = 8; string currency = 9; string converted_amount = 10;
  string source_fx_rate = 11; string target_fx_rate = 12; string fx_rate_at = 13;
  string fx_source = 14; string effective_at = 15; string valid_until = 16;
  string source = 17; string remark = 18;
}
message CostScenarioLine {
  int64 id = 1; int64 sourcing_line_id = 2; int64 supplier_quote_line_id = 3;
  string supplier_name = 4; int64 product_id = 5; int64 sku_id = 6;
  string product_name = 7; string spec_snapshot = 8; string qty = 9; string uom_code = 10;
  string source_currency = 11; string source_unit_price = 12; string source_fx_rate = 13;
  string target_fx_rate = 14; string product_cost = 15; string allocated_charge = 16;
  string landed_cost = 17; string margin_amount = 18; string customer_unit_price = 19;
  string customer_amount = 20;
}
message CostScenario {
  int64 id = 1; int64 case_id = 2; string scenario_no = 3; string currency = 4;
  string allocation_basis = 5; string margin_type = 6; string margin_value = 7;
  string fx_rate = 8; string fx_rate_at = 9; string fx_source = 10; string fx_base_currency = 11;
  string product_total = 12; string charge_total = 13; string landed_total = 14;
  string margin_total = 15; string customer_total = 16; string status = 17;
  int64 customer_quotation_id = 18; string customer_quote_no = 19;
  string created_by_name = 20; string confirmed_by_name = 21; string confirmed_at = 22; string created_at = 23;
  repeated CostCharge charges = 24; repeated CostScenarioLine lines = 25;
  string confirm_reason = 26;
}
message CreateCostScenarioRequest {
  int64 case_id = 1; string currency = 2; string allocation_basis = 3;
  string margin_type = 4; string margin_value = 5;
  repeated CostSelectionInput selections = 6; repeated CostChargeInput charges = 7;
}
message CreateCostScenarioResponse { CostScenario cost_scenario = 1; }
message ListCostScenariosRequest { int64 case_id = 1; }
message ListCostScenariosResponse { repeated CostScenario cost_scenarios = 1; }
message GetCostScenarioRequest { int64 id = 1; }
message GetCostScenarioResponse { CostScenario cost_scenario = 1; }
message ConfirmCostScenarioRequest {
  int64 id = 1;
  // Why this combination won — the award decision's paper trail.
  string reason = 2;
}
message ConfirmCostScenarioResponse { CostScenario cost_scenario = 1; }
message CustomerQuotationLine {
  int64 cost_scenario_line_id = 1; int64 product_id = 2; int64 sku_id = 3;
  string spec = 4; string qty = 5; string unit_price = 6; string remark = 7;
  // 已审核询盘可以尚未绑定产品主数据；此时用名称和单位快照生成客户报价。
  string product_name = 8; string uom_code = 9;
}
message PrepareCustomerQuotationRequest { int64 id = 1; }
message PrepareCustomerQuotationResponse {
  int64 cost_scenario_id = 1; string cost_scenario_no = 2; int64 sourcing_case_id = 3;
  int64 customer_id = 4; string contact_email = 5; string currency = 6;
  string incoterm = 7; string port_of_loading = 8; string port_of_discharge = 9;
  string payment_method = 10; repeated CustomerQuotationLine lines = 11;
  int64 existing_quotation_id = 12; string existing_quote_no = 13;
}
message LinkCustomerQuotationRequest { int64 id = 1; int64 quotation_id = 2; string quote_no = 3; }
message LinkCustomerQuotationResponse { int64 quotation_id = 1; string quote_no = 2; }

// RequirementService exposes what has to be bought.
//
// Contract requirements are not created through this API: an effective
// contract creates its full purchasing quantity over Kafka. No own-stock
// balance is netted first.
service RequirementService {
  rpc ListRequirements(ListRequirementsRequest) returns (ListRequirementsResponse);
  // Export a versioned, identity-bearing workbook for selected open requirements.
  rpc ExportPurchaseTemplate(ExportPurchaseTemplateRequest) returns (ExportPurchaseTemplateResponse);
  // Raise an exceptional requirement by hand, independent of a contract.
  rpc CreateRequirement(CreateRequirementRequest) returns (CreateRequirementResponse);
  rpc GetRequirement(GetRequirementRequest) returns (GetRequirementResponse);
  // Close a requirement the business will not buy against.
  rpc CancelRequirement(CancelRequirementRequest) returns (CancelRequirementResponse);
  // Put a wrongly closed one back on the list.
  rpc ReopenRequirement(ReopenRequirementRequest) returns (ReopenRequirementResponse);
  // Which purchase orders are covering it. An outstanding line that is
  // already on order needs waiting on, not buying again.
  rpc ListRequirementOrders(ListRequirementOrdersRequest) returns (ListRequirementOrdersResponse);
}

message ReopenRequirementRequest {
  int64 id = 1;
}

message ReopenRequirementResponse {
  string status = 1;
}

// CoveringOrder is one purchase order line raised against a requirement.
message CoveringOrder {
  int64 po_id = 1;
  string po_no = 2;
  string supplier_name = 3;
  string status = 4;
  string currency = 5;
  string expected_date = 6;
  string qty = 7;
  string unit_price = 8;
  string received_qty = 9;
  string created_at = 10;
}

message ListRequirementOrdersRequest {
  int64 id = 1;
}

message ListRequirementOrdersResponse {
  repeated CoveringOrder orders = 1;
}

// Requirement is one contract line that needs sourcing.
message Requirement {
  int64 id = 1;
  // Ids into export's contracts. No foreign key exists; procurement keeps a
  // snapshot and never reads export's tables.
  int64 contract_id = 2;
  string contract_no = 3;
  int64 contract_version_id = 4;
  int32 version_no = 5;
  int64 contract_item_id = 6;
  string customer_name = 7;

  int64 product_id = 8;
  int64 sku_id = 9;
  string product_code = 10;
  string product_name = 11;
  string spec = 12;
  int64 uom_id = 13;
  string uom_code = 14;

  string required_qty = 15;
  string ordered_qty = 16;
  string required_date = 17;

  // CONTRACT / STOCK_ALERT / MANUAL
  string source = 18;
  // PENDING / PARTIALLY_ORDERED / ORDERED / RECEIVED / SUPERSEDED / CANCELLED
  string status = 19;
  // Why it was retired; empty while it is still live.
  string closed_reason = 20;
  string created_at = 21;
  // How much has physically turned up. The only thing that can close a
  // manually raised requirement: it has no contract behind it, so no amount
  // of stock arriving for somebody else ever satisfies it.
  string received_qty = 22;
}

message ListRequirementsRequest {
  erp.common.v1.PageRequest page = 1;
  string status = 2;
  int64 contract_id = 3;
  string keyword = 4;
}

message ListRequirementsResponse {
  repeated Requirement requirements = 1;
  erp.common.v1.PageMeta meta = 2;
}

message ExportPurchaseTemplateRequest { repeated int64 requirement_ids = 1; }
message ExportPurchaseTemplateResponse {
  string file_name = 1;
  bytes file_data = 2;
  string template_version = 3;
}

message CreateRequirementRequest {
  int64 product_id = 1;
  int64 sku_id = 2;
  string product_code = 3;
  string product_name = 4;
  string spec = 5;
  int64 uom_id = 6;
  string uom_code = 7;
  string required_qty = 8;
  string required_date = 9;
  string remark = 10;
}

message CreateRequirementResponse {
  Requirement requirement = 1;
}

message GetRequirementRequest {
  int64 id = 1;
}

message GetRequirementResponse {
  Requirement requirement = 1;
}

message CancelRequirementRequest {
  int64 id = 1;
  string reason = 2;
}

message CancelRequirementResponse {
  string status = 1;
}

// PurchaseOrderService turns requirements into orders placed with suppliers.
//
// Consolidation is the point: three contracts each short 500 become one order
// for 1500, which is the only way a buyer gets a better price. So an order
// references requirements, and a requirement may span several orders.
service PurchaseOrderService {
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  // Preview persists the rows the employee reviewed but does not allocate a
  // purchase-order number or change a requirement.
  rpc PreviewOrderImport(PreviewOrderImportRequest) returns (PreviewOrderImportResponse);
  // Parse the system purchase template, validate its protected identities and
  // create one ordinary import session per supplier.
  rpc PreviewPurchaseTemplateImport(PreviewPurchaseTemplateImportRequest) returns (PreviewPurchaseTemplateImportResponse);
  // Confirmation is idempotent by import_token. The import record and draft
  // order are committed together.
  rpc ConfirmOrderImport(ConfirmOrderImportRequest) returns (ConfirmOrderImportResponse);
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  // Only a draft or a rejected order can be changed. Saving a rejected order
  // turns it back into a draft so its corrected snapshot is explicit before
  // it enters a new approval instance.
  rpc UpdateOrder(UpdateOrderRequest) returns (UpdateOrderResponse);
  // Spending money needs a signature. The approval engine routes on the
  // order total, so a large order can require more of them.
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  // Finished goods arriving into a port-terminal custody location.
  rpc ReceiveOrder(ReceiveOrderRequest) returns (ReceiveOrderResponse);
  rpc GetOrderDocuments(GetOrderDocumentsRequest) returns (GetOrderDocumentsResponse);
  rpc BeginOrderSend(BeginOrderSendRequest) returns (BeginOrderSendResponse);
  rpc CompleteOrderSend(CompleteOrderSendRequest) returns (CompleteOrderSendResponse);
  rpc GetOrderExecution(GetOrderExecutionRequest) returns (GetOrderExecutionResponse);
  rpc RecordSupplierConfirmation(RecordSupplierConfirmationRequest) returns (RecordSupplierConfirmationResponse);
  rpc SaveProductionMilestone(SaveProductionMilestoneRequest) returns (SaveProductionMilestoneResponse);
  rpc ReportReceiptException(ReportReceiptExceptionRequest) returns (ReportReceiptExceptionResponse);
  rpc ResolveReceiptException(ResolveReceiptExceptionRequest) returns (ResolveReceiptExceptionResponse);
  // 质检记录（A3）：结果、不合格数量、附件、处置。挂在收货单上。
  rpc RecordInspection(RecordInspectionRequest) returns (RecordInspectionResponse);
  rpc ResolveInspection(ResolveInspectionRequest) returns (ResolveInspectionResponse);
  // 结案：全部收满、无未解决异常、无未解决质检才放行。
  rpc CloseOrder(CloseOrderRequest) returns (CloseOrderResponse);

  // Supplier invoices: the third leg of the three-way match. Lives on the
  // order service because an invoice is meaningless except against orders.
  rpc CreateSupplierInvoice(CreateSupplierInvoiceRequest) returns (CreateSupplierInvoiceResponse);
  rpc ListSupplierInvoices(ListSupplierInvoicesRequest) returns (ListSupplierInvoicesResponse);
  rpc GetSupplierInvoice(GetSupplierInvoiceRequest) returns (GetSupplierInvoiceResponse);
  rpc VoidSupplierInvoice(VoidSupplierInvoiceRequest) returns (VoidSupplierInvoiceResponse);
  // Re-runs the three-way verdict — after a receipt lands or an exception
  // is resolved, the stored MATCHED/EXCEPTION may be stale.
  rpc MatchSupplierInvoice(MatchSupplierInvoiceRequest) returns (MatchSupplierInvoiceResponse);
  // The scan of the paper. Presign hands the browser a short-lived URL it
  // PUTs the file to; Attach records the uploaded key on the invoice. The
  // download URL is minted fresh on every Get — the URL expires, the key
  // does not.
  rpc PresignSupplierInvoiceFile(PresignSupplierInvoiceFileRequest) returns (PresignSupplierInvoiceFileResponse);
  rpc AttachSupplierInvoiceFile(AttachSupplierInvoiceFileRequest) returns (AttachSupplierInvoiceFileResponse);

  // Payments: our assertion that money left. Allocation is the separate,
  // revisable judgement about what it settled — an invoice, or a purchase
  // order when it is a deposit wired before any invoice exists.
  rpc CreateSupplierPayment(CreateSupplierPaymentRequest) returns (CreateSupplierPaymentResponse);
  rpc ListSupplierPayments(ListSupplierPaymentsRequest) returns (ListSupplierPaymentsResponse);
  rpc GetSupplierPayment(GetSupplierPaymentRequest) returns (GetSupplierPaymentResponse);
  rpc AllocateSupplierPayment(AllocateSupplierPaymentRequest) returns (AllocateSupplierPaymentResponse);
  rpc ReverseSupplierPaymentAllocation(ReverseSupplierPaymentAllocationRequest) returns (ReverseSupplierPaymentAllocationResponse);

  // The reconciliation view (A4 P5): one row per supplier and currency,
  // summing all five kinds of paper. Read-only — every number here is
  // derived from the tables above and never stored.
  rpc ListSupplierStatements(ListSupplierStatementsRequest) returns (ListSupplierStatementsResponse);
  rpc GetSupplierStatement(GetSupplierStatementRequest) returns (GetSupplierStatementResponse);

  // Bank statement rows: the fifth voice. Imported verbatim from the CSV
  // the bank portal exports, deduplicated by the bank's own reference, and
  // matched to payments — the match lives on the payment and is reversible;
  // the bank's row never changes.
  rpc ImportBankStatement(ImportBankStatementRequest) returns (ImportBankStatementResponse);
  rpc ListBankTransactions(ListBankTransactionsRequest) returns (ListBankTransactionsResponse);
  rpc MatchBankTransaction(MatchBankTransactionRequest) returns (MatchBankTransactionResponse);
  rpc UnmatchBankTransaction(UnmatchBankTransactionRequest) returns (UnmatchBankTransactionResponse);
}

