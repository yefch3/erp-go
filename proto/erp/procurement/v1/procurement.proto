message PurchaseOrder {
  int64 id = 1;
  string po_no = 2;
  int64 supplier_id = 3;
  string supplier_code = 4;
  string supplier_name = 5;
  string currency = 6;
  string total_amount = 7;
  string expected_date = 8;
  // 应付到期日。列表和详情都要带上——让员工填一个填完再也看不见的字段，
  // 是最容易填错而且发现不了的形态。
  string payable_due_date = 43;
  // DRAFT / PENDING_APPROVAL / REJECTED / ORDERED /
  // PARTIALLY_RECEIVED / RECEIVED / CANCELLED
  string status = 9;
  string buyer_name = 10;
  string remark = 11;
  string reject_reason = 12;
  string cancel_reason = 13;
  int64 item_count = 14;
  string total_qty = 15;
  string received_qty = 16;
  string created_at = 17;
  int64 approval_instance_id = 18;
  string send_status = 19;
  string sent_to = 20;
  string sent_at = 21;
  string sent_by = 22;
  string send_error = 23;
  // 结案是 RECEIVED 之外的一个事实，不是新状态：空串即未结案。
  string closed_at = 24;
  string closed_by = 25;
  // 货没到齐就结案时填的：为什么、剩下的怎么办。
  string close_note = 41;
  string shortfall_action = 42;
  // 最新一条工厂回签的状态：MATCHED / PENDING_APPROVAL / APPROVED /
  // REJECTED；空串 = 从未回签。
  string confirm_status = 26;
  string fulfillment_mode = 27;
  string delivery_location_type = 28;
  int64 delivery_port_id = 29;
  string delivery_port_code = 30;
  string delivery_port_name = 31;
  int64 warehouse_id = 32;
  string warehouse_name = 33;
  string delivery_address = 34;
  int64 source_quotation_id = 35;
  string source_quotation_no = 36;
  int64 source_cost_scenario_id = 37;
  int64 factory_id = 38;
  string factory_code = 39;
  string factory_name = 40;
}

