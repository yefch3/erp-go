// -------------------------------------------------------------- statement

// SupplierStatement is one supplier in one currency, all five kinds of paper
// summed. Currencies are never mixed in one row: before P6 wires fx there is
// no honest way to add USD to CNY.
message SupplierStatement {
  int64 supplier_id = 1;
  string supplier_name = 2;
  string currency = 3;
  string ordered_amount = 4;     // placed orders (ORDERED and beyond)
  string received_amount = 5;    // received_qty × our unit price
  string exception_amount = 6;   // open SHORT/DAMAGE/QUALITY/RETURN × unit price
  string invoiced_amount = 7;    // non-void invoice totals
  string paid_amount = 8;        // allocations to invoices, reversals included
  string advance_amount = 9;     // allocations still parked on orders
  string unallocated_amount = 10; // money sent but not yet attributed anywhere
  string balance = 11;           // invoiced − paid
  int32 overdue_count = 12;      // open invoices past due_date
  string overdue_amount = 13;    // their unpaid remainder
  // Book-currency view (P6). Built only from rows carrying fx snapshots;
  // gain/loss is realized: allocation × (invoice rate − payment rate).
  string base_currency = 14;
  string invoiced_base = 15;
  string paid_base = 16;
  string fx_gain_loss = 17;
}

message ListSupplierStatementsRequest {
  string keyword = 1; // supplier name filter; empty = all
}
message ListSupplierStatementsResponse {
  repeated SupplierStatement items = 1;
}

// StatementLine is one event in a supplier's money history, in time order.
// INVOICE raises the balance; PAYMENT and PAYMENT_REVERSAL move it back
// (reversal rows carry negative amounts, so one rule covers both). ADVANCE
// rows are money parked on orders — shown, but the invoice balance does not
// move until they are re-pointed.
message StatementLine {
  string at = 1;
  string type = 2;   // INVOICE | PAYMENT | PAYMENT_REVERSAL | ADVANCE | ADVANCE_REVERSAL
  string ref = 3;    // invoice_no, or payment_no for allocation rows
  string against = 4; // what an allocation row points at: invoice_no or po_no
  string amount = 5;
  string balance = 6; // running invoiced − paid after this line
  string note = 7;
}

message GetSupplierStatementRequest {
  int64 supplier_id = 1;
  string currency = 2;
}
message GetSupplierStatementResponse {
  SupplierStatement summary = 1;
  repeated StatementLine lines = 2;
}

// ------------------------------------------------------------ bank ledger

message BankTransaction {
  int64 id = 1;
  string txn_date = 2; // YYYY-MM-DD
  string direction = 3; // DEBIT | CREDIT
  string amount = 4;
  string currency = 5;
  string counterparty = 6;
  string bank_ref = 7;
  string remark = 8;
  string imported_by = 9;
  string created_at = 10;
  int64 matched_payment_id = 11;   // 0 = nobody claims this row yet
  string matched_payment_no = 12;
  int64 suggested_payment_id = 13; // closest unclaimed same-amount payment
  string suggested_payment_no = 14;
  string suggested_payment_supplier = 15;
  // 这笔钱是谁那条线上的。空串 = 待处理，还没人认领过。
  // "" | CUSTOMER | SUPPLIER | TAX_REFUND | OTHER
  //
  // **归属不是 direction 的同义词**：供应商退款是进账却归 SUPPLIER，
  // 退款给客户是出账却归 CUSTOMER。按方向推归属，这两类钱就永远对不上。
  string ownership = 16;
  // 只有 ownership=OTHER 时才有值：INTEREST | INTERNAL | DEPOSIT_RETURN | OTHER
  string ownership_detail = 17;

  // ---- F2 第二步补进来的：出口那本账原来独有的信息 ----

  // 钱进了/出了我们哪个账户。**0 = 没填**，不是「第 0 号账户」。
  int64 account_id = 18;
  string account_name = 19; // 便于直接显示，避免每行再查一次
  string counterparty_account = 20;
  // 付款人自己写进这笔汇款里的话。**扫合同号靠它**，和 remark（银行导出
  // 文件里那一列备注）不是一回事。
  string remittance_info = 21;
  string source = 22;      // MANUAL | CSV | API | PSP
  string trusted_ref = 23; // 我们自己发出去的号，可信；附言不可信
  string note = 24;        // 人写的备注，和银行给的 remark 分开

  // 这一行已经被认领了多少钱。**「处理完了没有」对两条线是同一个定义**：
  // claimed_amount < amount 就是还没完。供应商那条线由匹配写（匹配即全额），
  // 客户那条线由出口服务核销之后写回来。
  string claimed_amount = 25;

  // 银行给的那份对账单（PDF）。key 是存下来的；url 每次读的时候现签、
  // 一会儿就过期，所以**不落库**；name 是从 key 还原的原始文件名。
  string attachment_key = 26;
  string attachment_url = 27;
  string attachment_name = 28;
}

message PresignBankTransactionFileRequest {
  int64 txn_id = 1;
  string file_name = 2;
}
message PresignBankTransactionFileResponse {
  string key = 1;
  string upload_url = 2;
  int32 expires_seconds = 3;
}

message AttachBankTransactionFileRequest {
  int64 txn_id = 1;
  string key = 2; // 必须是这一行流水自己 Presign 发出去的那个
}
message AttachBankTransactionFileResponse { BankTransaction transaction = 1; }

// BankTransactionInput 是手工登记一行流水要填的东西。
//
// 只有「银行说了什么」，没有「我们打算拿它干什么」——归属和核销都是后面的
// 判断，不在登记这一步做。同「付款是事实、核销是判断」。
message BankTransactionInput {
  // 0 表示不指定账户。填了就必须是一个存在且启用的账户。
  int64 account_id = 1;
  string bank_ref = 2;  // 银行自己的流水号，去重靠它
  string direction = 3; // DEBIT | CREDIT
  string amount = 4;
  string currency = 5;
  string txn_date = 6; // YYYY-MM-DD，银行的日子，不是谁录入的日子
  string counterparty = 7;
  string counterparty_account = 8;
  string remittance_info = 9;
  string trusted_ref = 10;
  string note = 11;
  // 登记时就知道这笔钱是谁那条线上的，可以直接写上；不知道就留空，
  // 落到「待处理」。
  string ownership = 12;
  string ownership_detail = 13;
}

message RecordBankTransactionRequest {
  BankTransactionInput transaction = 1;
}
message RecordBankTransactionResponse {
  BankTransaction transaction = 1;
}

message GetBankTransactionRequest { int64 txn_id = 1; }
message GetBankTransactionResponse {
  BankTransaction transaction = 1;
}

// BankAccount 是我们自己的一个账户。留着它是为了认出「两个自己账户之间
// 转钱」——那在流水上是一笔大额进账，长得和客户打款一模一样。
message BankAccount {
  int64 id = 1;
  string account_no = 2;
  string account_name = 3;
  string bank_name = 4;
  string currency = 5;
  string status = 6; // ACTIVE | INACTIVE
}

message ListBankAccountsRequest {
  // 为真时连停用的一起给。默认只给启用的——登记流水的下拉框不该出现
  // 已经销户的账户。
  bool include_inactive = 1;
}
message ListBankAccountsResponse {
  repeated BankAccount accounts = 1;
}

message CreateBankAccountRequest {
  string account_no = 1;
  string account_name = 2;
  string bank_name = 3;
  string currency = 4;
}
message CreateBankAccountResponse { int64 id = 1; }

message SetBankTransactionClaimRequest {
  int64 txn_id = 1;
  // 认领总额，不是增量——调用方每次把重算之后的总数报上来。
  // 用增量的话，一次重试就会把数加两遍。
  string claimed_amount = 2;
}
message SetBankTransactionClaimResponse {}

message ImportBankStatementRequest {
  string file_name = 1;
  bytes data = 2; // the CSV as uploaded; UTF-8 or GBK
  // Used for rows whose file carries no currency column.
  string default_currency = 3;
}
message BankImportRowError {
  int32 row_no = 1; // 1-based, as Excel shows it
  string reason = 2;
}
message ImportBankStatementResponse {
  int32 imported = 1;
  int32 duplicates = 2; // same bank_ref seen before — re-uploads are safe
  repeated BankImportRowError errors = 3;
}

message ListBankTransactionsRequest {
  erp.common.v1.PageRequest page = 1;
  string status = 2;    // MATCHED | UNMATCHED | ""
  string direction = 3; // DEBIT | CREDIT | ""
  string keyword = 4;   // counterparty, bank_ref or remark
  // 按归属筛。空串表示不筛。
  string ownership = 5;
  // 只出「还没人认领的」（ownership 为空）。和 ownership 互斥；同时给时以
  // 这一位为准。单独一位而不是让 ownership="" 兼职，是因为空串已经是
  // 「不筛」的意思了——一个值不能同时表示「全都要」和「只要没归的」。
  bool ownership_pending = 6;
  // 认领状态。"" 不筛 / "OPEN" 还没认领完 / "CLAIMED" 认领完了。
  // 这就是财务每天要清的那个队列——收款对账的「待处理 / 已核销」走这里。
  string claim_status = 7;
  // 一次筛好几档归属。非空时**压过** ownership 和 ownership_pending。
  //
  // 收款对账要的「与应收无关」是「归属既不是客户、也不是待定」——那是三档
  // 的并集，单值的 ownership 表达不了。空串在这里是一个正常的元素，表示
  // 「还没人认过的那一档」。
  repeated string ownership_in = 8;
}
message SetBankTransactionOwnershipRequest {
  int64 txn_id = 1;
  // "" 表示改回待处理。
  string ownership = 2;
  // 只在 ownership=OTHER 时允许非空。
  string ownership_detail = 3;
}
message SetBankTransactionOwnershipResponse {}

message ListBankTransactionsResponse {
  repeated BankTransaction items = 1;
  int64 total = 2;
}

message MatchBankTransactionRequest {
  int64 txn_id = 1;
  int64 payment_id = 2;
}
message MatchBankTransactionResponse {}

message UnmatchBankTransactionRequest { int64 txn_id = 1; }
message UnmatchBankTransactionResponse {}

