syntax = "proto3";

package erp.export.v1;

import "erp/common/v1/pagination.proto";

// ReceiptService owns collection: what the bank says arrived, and which
// contracts we decided it paid for.
//
// Those are two different kinds of statement and they live in two tables. A
// bank line is fact and is never edited; an allocation is judgement and is
// revised by writing its opposite, never by deleting it.
// F2（2026-08-26）之后，银行流水只有一本，在采购服务手上。这个服务下面几个
// 和流水有关的方法**实现已经改成转发给采购**了，接口保留是因为页面还在用，
// 而删 RPC 会被 buf breaking 拦下（proto/buf.yaml 用的是 FILE 那一档）。
//
// 新的调用方应该直接用 erp.procurement.v1.PurchaseOrderService 上的
// RecordBankTransaction / ListBankAccounts / SetBankTransactionOwnership。
service ReceiptService {
  rpc ListBankAccounts(ListBankAccountsRequest) returns (ListBankAccountsResponse);
  rpc CreateBankAccount(CreateBankAccountRequest) returns (CreateBankAccountResponse);
  // The reconciliation queue.
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse);
  rpc RecordTransaction(RecordTransactionRequest) returns (RecordTransactionResponse);
  // Decide which contracts a bank line paid for. One line can be split
  // across several contracts; one contract can be paid by several lines.
  rpc AllocateReceipt(AllocateReceiptRequest) returns (AllocateReceiptResponse);
  // Undo an allocation by writing its opposite. Requires a reason.
  rpc ReverseAllocation(ReverseAllocationRequest) returns (ReverseAllocationResponse);
  // File a line that has nothing to do with receivables - a tax refund, bank
  // interest, a transfer between our own accounts.
  rpc MarkIrrelevant(MarkIrrelevantRequest) returns (MarkIrrelevantResponse);
  rpc ReopenTransaction(ReopenTransactionRequest) returns (ReopenTransactionResponse);
  // 认差结清：核到没得核了还剩一截，员工说清这截是什么（损耗/尾差/多收/
  // 其他），这一行就算处理完。「完成」由人确认，不由算式确认。
  rpc SettleTransaction(SettleTransactionRequest) returns (SettleTransactionResponse);
  rpc RevokeSettlement(RevokeSettlementRequest) returns (RevokeSettlementResponse);
  // Candidates for the allocation picker: contracts still owed money.
  rpc ListOpenReceivables(ListOpenReceivablesRequest) returns (ListOpenReceivablesResponse);
  // The other half: one contract collected in instalments.
  rpc GetContractReceipts(GetContractReceiptsRequest) returns (GetContractReceiptsResponse);
  // 应收到期清单（E1）：生效合同的收款情况，按该收的日子排。
  // closed_only 翻面就是「已完成」页。
  rpc ListReceivableDue(ListReceivableDueRequest) returns (ListReceivableDueResponse);
  // 记一笔收款到合同上：员工手填金额和到账日期，**不连银行流水**。
  rpc RecordContractReceipt(RecordContractReceiptRequest) returns (RecordContractReceiptResponse);
  // 冲销一笔记错的收款：写一条相反的记录，不删原记录。
  rpc ReverseContractReceipt(ReverseContractReceiptRequest) returns (ReverseContractReceiptResponse);
  // 确认核销完成：这张合同的收款「说清了」，由人说出来。
  //
  // 完成与数字**完全解耦**：差额是正是负都能确认，数字对上了也不会自动
  // 确认；确认之后照样能继续记收款，钱真的又来了就撤销完成。
  // 有一条活着的记录 = 已完成页，没有 = 待核销页。
  rpc CloseReceivable(CloseReceivableRequest) returns (CloseReceivableResponse);
  rpc ReopenReceivable(ReopenReceivableRequest) returns (ReopenReceivableResponse);
  // 应收提醒收件箱（E1 第二期）。
  rpc ListReceivableReminders(ListReceivableRemindersRequest) returns (ListReceivableRemindersResponse);
  rpc MarkReceivableRemindersRead(MarkReceivableRemindersReadRequest) returns (MarkReceivableRemindersReadResponse);
}

// BankAccount is one of our own accounts. Kept so a transfer between two of
// them is not mistaken for a customer payment.
message BankAccount {
  int64 id = 1;
  string account_no = 2;
  string account_name = 3;
  string bank_name = 4;
  string currency = 5;
  string status = 6;
}

// BankTransaction is one line off a statement.
// BankTransaction 是账本上的一行，收款对账看到的样子。
//
// **disposition 和 irrelevant_type 现在是算出来的**，不再有对应的列：
// 「与应收无关」变成了归属不是客户，「已核销 / 待处理」是核销记录的和与到账
// 金额比出来的。字段保留是为了页面不必同时改；值仍然是准的。
message BankTransaction {
  int64 id = 1;
  int64 account_id = 2;
  string account_name = 3;
  string bank_ref = 4;
  string direction = 5;
  string amount = 6;
  string currency = 7;
  string value_date = 8;
  string counterparty = 9;
  string counterparty_account = 10;
  string remittance_info = 11;
  string source = 12;
  // A reference we issued ourselves, as opposed to something the customer
  // typed. Only this one could ever settle a line automatically.
  string trusted_ref = 13;
  string disposition = 14;
  string irrelevant_type = 15;
  string note = 16;
  string recorded_by_name = 17;
  string created_at = 18;
  string allocated_amount = 19;
  string unallocated_amount = 20;
  string fee_amount = 21;
  // 认差结清。空串 = 没结清过。差额是认下那一刻的未核余额，员工看过并
  // 说了它是什么之后，这一行才离开待处理——完成由人确认，不由算式。
  string variance_amount = 22;
  string variance_category = 23; // LOSS | ROUNDING | OVERPAY | OTHER
  string variance_note = 24;
}

// ReceiptAllocation is one contract's share of a bank line. A reversal row
// carries a negative amount and points at the row it undoes.
message ReceiptAllocation {
  int64 id = 1;
  int64 contract_id = 2;
  string contract_no = 3;
  string customer_name = 4;
  string amount = 5;
  // The gap we absorb - intermediary bank charges. Does not come out of the
  // bank line; it only closes the contract.
  string fee_amount = 6;
  string currency = 7;
  int64 reversal_of = 8;
  string reverse_reason = 9;
  string allocated_by_name = 10;
  string allocated_at = 11;
  string fee_category = 12;
}

// ContractSuggestion is a contract whose number appeared in the remittance
// line. A hint for the operator, never an action.
message ContractSuggestion {
  int64 contract_id = 1;
  string contract_no = 2;
  string customer_name = 3;
  string currency = 4;
  string open_amount = 5;
}

// OpenReceivable is a contract still owed money.
message OpenReceivable {
  int64 contract_id = 1;
  string contract_no = 2;
  int64 customer_id = 3;
  string customer_name = 4;
  string currency = 5;
  string total_amount = 6;
  string received_amount = 7;
  string open_amount = 8;
}

// ReceiptProgress is one contract's collection position.
message ReceiptProgress {
  int64 contract_id = 1;
  string contract_no = 2;
  string customer_name = 3;
  string currency = 4;
  string total_amount = 5;
  string received_amount = 6;
  string open_amount = 7;
}

// ContractReceipt is one payment seen from the contract's side.
message ContractReceipt {
  int64 allocation_id = 1;
  int64 transaction_id = 2;
  string bank_ref = 3;
  string value_date = 4;
  string counterparty = 5;
  string source = 6;
  string amount = 7;
  string fee_amount = 8;
  string currency = 9;
  int64 reversal_of = 10;
  string allocated_by_name = 11;
  // 手工记账补进来的：员工填的到账日期和备注。老行（挂着银行流水的那些）
  // received_at 为空——那个日子在流水行上。
  string received_at = 12;
  string note = 13;
  string reverse_reason = 14;
  string allocated_at = 15;
}

message TransactionInput {
  int64 account_id = 1;
  string bank_ref = 2;
  string direction = 3;
  string amount = 4;
  string currency = 5;
  string value_date = 6;
  string counterparty = 7;
  string counterparty_account = 8;
  string remittance_info = 9;
  string source = 10;
  string trusted_ref = 11;
  string note = 12;
}

message AllocationInput {
  int64 contract_id = 1;
  string amount = 2;
  string fee_amount = 3;
  // 那截补给合同的钱是什么：BANK_FEE（默认）| LOSS | ROUNDING | OTHER。
  // 原来只有手续费一种说法，损耗只能谎报成手续费——类别错了，将来进
  // 总账就进错科目。
  string fee_category = 4;
}

message ListBankAccountsRequest {}

message ListBankAccountsResponse {
  repeated BankAccount accounts = 1;
}

message CreateBankAccountRequest {
  string account_no = 1;
  string account_name = 2;
  string bank_name = 3;
  string currency = 4;
}

message CreateBankAccountResponse {
  int64 id = 1;
}

message ListTransactionsRequest {
  erp.common.v1.PageRequest page = 1;
  string disposition = 2;
  string direction = 3;
  // Matches bank reference, counterparty or remittance line.
  string keyword = 4;
}

message ListTransactionsResponse {
  repeated BankTransaction transactions = 1;
  int64 total = 2;
}

message GetTransactionRequest {
  int64 id = 1;
}

message GetTransactionResponse {
  BankTransaction transaction = 1;
  repeated ReceiptAllocation allocations = 2;
  repeated ContractSuggestion suggestions = 3;
}

message RecordTransactionRequest {
  TransactionInput transaction = 1;
}

message RecordTransactionResponse {
  BankTransaction transaction = 1;
}

message AllocateReceiptRequest {
  int64 transaction_id = 1;
  repeated AllocationInput allocations = 2;
}

message AllocateReceiptResponse {
  BankTransaction transaction = 1;
  repeated ReceiptAllocation allocations = 2;
}

message ReverseAllocationRequest {
  int64 allocation_id = 1;
  // Mandatory: a reversal with no stated reason is not auditable.
  string reason = 2;
}

message ReverseAllocationResponse {
  BankTransaction transaction = 1;
  repeated ReceiptAllocation allocations = 2;
}

message MarkIrrelevantRequest {
  int64 transaction_id = 1;
  string irrelevant_type = 2;
  string note = 3;
}

message MarkIrrelevantResponse {
  BankTransaction transaction = 1;
}

message SettleTransactionRequest {
  int64 transaction_id = 1;
  string category = 2; // LOSS | ROUNDING | OVERPAY | OTHER
  string note = 3;
}

message SettleTransactionResponse {
  BankTransaction transaction = 1;
}

message RevokeSettlementRequest {
  int64 transaction_id = 1;
  // 必填：没有理由的撤销事后没人说得清。
  string reason = 2;
}

message RevokeSettlementResponse {
  BankTransaction transaction = 1;
}

message ReopenTransactionRequest {
  int64 transaction_id = 1;
}

message ReopenTransactionResponse {
  BankTransaction transaction = 1;
}

message ListOpenReceivablesRequest {
  // Only the same currency can be settled, so the picker filters by it.
  string currency = 1;
  int64 customer_id = 2;
  string keyword = 3;
  // 退款的候选是「收过钱的」合同（退的上限就是已收），核销的候选是
  // 「还欠钱的」。
  bool for_refund = 4;
}

message ListOpenReceivablesResponse {
  repeated OpenReceivable receivables = 1;
}

message GetContractReceiptsRequest {
  int64 contract_id = 1;
}

message GetContractReceiptsResponse {
  ReceiptProgress progress = 1;
  repeated ContractReceipt receipts = 2;
}

// ReceivableDue 是催收清单上的一行。
message ReceivableDue {
  int64 contract_id = 1;
  string contract_no = 2;
  int64 customer_id = 3;
  string customer_name = 4;
  int64 sales_employee_id = 5;
  string sales_employee = 6;
  // 空串 = 客户主数据里没配账期，不是「今天到期」。
  string due_date = 7;
  string effective_date = 8;
  string currency = 9;
  string total_amount = 10;
  string received_amount = 11;
  string open_amount = 12;
  // 正数已逾期，负数是还剩几天；due_unset 为真时无意义。
  int32 overdue_days = 13;
  bool due_unset = 14;
  // 收款结清（只在 closed_only 视图里非空）：为什么不催了、谁定的。
  string closed_category = 15; // LOSS | ROUNDING | CANCELLED | OTHER
  string closed_note = 16;
  string closed_by_name = 17;
  string closed_at = 18;
}

message ListReceivableDueRequest {
  erp.common.v1.PageRequest page = 1;
  bool overdue_only = 2;
  // 只看还没配账期的合同——催配置，不是催钱。
  bool unset_only = 3;
  string keyword = 4;
  // 只看结清了的。默认视图是「该催的」，结清的不在里面。
  bool closed_only = 5;
}
message ListReceivableDueResponse {
  repeated ReceivableDue items = 1;
  erp.common.v1.PageMeta meta = 2;
}

// ReceivableReminder 是应收提醒收件箱里的一条。
message ReceivableReminder {
  int64 id = 1;
  int64 contract_id = 2;
  string contract_no = 3;
  string customer_name = 4;
  // SOON（30 天内）/ DUE（7 天内含当天）/ OVERDUE（逾期，按 period_no 每周一轮）
  string reminder_type = 5;
  int32 period_no = 6;
  string due_date = 7;
  string open_amount = 8;
  string currency = 9;
  string title = 10;
  string content = 11;
  string detail_url = 12;
  string created_at = 13;
  bool unread = 14;
}

message RecordContractReceiptRequest {
  int64 contract_id = 1;
  // **永远填正数**；退款由 is_refund 表达，翻号只发生在写库那一刻。
  string amount = 2;
  bool is_refund = 3;
  string received_at = 4; // YYYY-MM-DD，空表示不记
  string note = 5;
}
message RecordContractReceiptResponse { ReceiptProgress progress = 1; }

message ReverseContractReceiptRequest {
  int64 entry_id = 1;
  // 必填：没有理由的冲销事后没人说得清。
  string reason = 2;
}
message ReverseContractReceiptResponse { ReceiptProgress progress = 1; }

message CloseReceivableRequest {
  int64 contract_id = 1;
  // SETTLED 正常收完 | LOSS 认亏 | ROUNDING 尾差 | CANCELLED 合同取消 | OTHER
  string category = 2;
  string note = 3;
}
message CloseReceivableResponse {}

message ReopenReceivableRequest {
  int64 contract_id = 1;
  // 必填：没有理由的撤销事后没人说得清。
  string reason = 2;
}
message ReopenReceivableResponse {}

message ListReceivableRemindersRequest {
  bool unread_only = 1;
  int32 limit = 2;
}
message ListReceivableRemindersResponse {
  repeated ReceivableReminder items = 1;
  int64 unread_total = 2;
}

message MarkReceivableRemindersReadRequest {
  // 空 = 全部标记已读。
  repeated int64 ids = 1;
}
message MarkReceivableRemindersReadResponse { int64 marked = 1; }
