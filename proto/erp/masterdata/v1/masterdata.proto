syntax = "proto3";

package erp.masterdata.v1;

import "erp/common/v1/pagination.proto";

// CustomerService owns customer master data. Quotation/contract/receivable
// reference customers by id and never copy-maintain them.
service CustomerService {
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerResponse);
  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerResponse);
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse);
  rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerResponse);
  rpc UpdateCustomerProfile(UpdateCustomerProfileRequest) returns (UpdateCustomerProfileResponse);
  rpc DeactivateCustomer(DeactivateCustomerRequest) returns (DeactivateCustomerResponse);
  // Reactivate a previously deactivated customer: master data lifecycle is
  // reversible (delete is what stays forbidden).
  rpc ActivateCustomer(ActivateCustomerRequest) returns (ActivateCustomerResponse);
  rpc ListCustomerAddresses(ListCustomerAddressesRequest) returns (ListCustomerAddressesResponse);
  rpc CreateCustomerAddress(CreateCustomerAddressRequest) returns (CreateCustomerAddressResponse);
  rpc UpdateCustomerAddress(UpdateCustomerAddressRequest) returns (UpdateCustomerAddressResponse);
  rpc DeactivateCustomerAddress(DeactivateCustomerAddressRequest) returns (DeactivateCustomerAddressResponse);
  rpc ListCustomerContacts(ListCustomerContactsRequest) returns (ListCustomerContactsResponse);
  rpc CreateCustomerContact(CreateCustomerContactRequest) returns (CreateCustomerContactResponse);
  rpc UpdateCustomerContact(UpdateCustomerContactRequest) returns (UpdateCustomerContactResponse);
  rpc DeactivateCustomerContact(DeactivateCustomerContactRequest) returns (DeactivateCustomerContactResponse);
  rpc ListCustomerOwners(ListCustomerOwnersRequest) returns (ListCustomerOwnersResponse);
  // 供跨模块数据范围校验使用，只返回客户 ID，不向调用方暴露客户资料字段。
  rpc ListCustomerIdsByOwnerEmployees(ListCustomerIdsByOwnerEmployeesRequest) returns (ListCustomerIdsByOwnerEmployeesResponse);
  rpc CreateCustomerOwner(CreateCustomerOwnerRequest) returns (CreateCustomerOwnerResponse);
  rpc UpdateCustomerOwner(UpdateCustomerOwnerRequest) returns (UpdateCustomerOwnerResponse);
  rpc DeactivateCustomerOwner(DeactivateCustomerOwnerRequest) returns (DeactivateCustomerOwnerResponse);
  rpc ListCustomerChanges(ListCustomerChangesRequest) returns (ListCustomerChangesResponse);
  rpc ImportCustomers(ImportCustomersRequest) returns (ImportCustomersResponse);
  rpc CheckCustomerDuplicates(CheckCustomerDuplicatesRequest) returns (CheckCustomerDuplicatesResponse);
  rpc GetCustomerDeactivationImpact(GetCustomerDeactivationImpactRequest) returns (GetCustomerDeactivationImpactResponse);
  // The address book, flattened: every contact that has an email, with the
  // customer it belongs to. One call rather than a customer list followed by
  // a lookup per customer, because the mail composer needs all of them at
  // once and an N+1 there is a page that visibly stalls.
  rpc ListMailingContacts(ListMailingContactsRequest) returns (ListMailingContactsResponse);
  // ListCustomerCountries answers "which countries do we sell to, and how
  // many people are in each" — the grouping the recipient picker offers.
  rpc ListCustomerCountries(ListCustomerCountriesRequest) returns (ListCustomerCountriesResponse);
  // ContactsInCountry returns everybody writable in one of them.
  rpc ContactsInCountry(ContactsInCountryRequest) returns (ContactsInCountryResponse);
}

// SupplierService owns supplier master data, referenced by procurement.
service SupplierService {
  rpc CreateSupplier(CreateSupplierRequest) returns (CreateSupplierResponse);
  rpc GetSupplier(GetSupplierRequest) returns (GetSupplierResponse);
  rpc ListSuppliers(ListSuppliersRequest) returns (ListSuppliersResponse);
  rpc UpdateSupplier(UpdateSupplierRequest) returns (UpdateSupplierResponse);
  rpc DeactivateSupplier(DeactivateSupplierRequest) returns (DeactivateSupplierResponse);
  rpc ActivateSupplier(ActivateSupplierRequest) returns (ActivateSupplierResponse);
  rpc ListSupplierCountries(ListSupplierCountriesRequest) returns (ListSupplierCountriesResponse);
  rpc ListSupplierContacts(ListSupplierContactsRequest) returns (ListSupplierContactsResponse);
  rpc CreateSupplierContact(CreateSupplierContactRequest) returns (CreateSupplierContactResponse);
  rpc UpdateSupplierContact(UpdateSupplierContactRequest) returns (UpdateSupplierContactResponse);
  rpc DeactivateSupplierContact(DeactivateSupplierContactRequest) returns (DeactivateSupplierContactResponse);
  rpc ListSupplierOwners(ListSupplierOwnersRequest) returns (ListSupplierOwnersResponse);
  rpc CreateSupplierOwner(CreateSupplierOwnerRequest) returns (CreateSupplierOwnerResponse);
  rpc UpdateSupplierOwner(UpdateSupplierOwnerRequest) returns (UpdateSupplierOwnerResponse);
  rpc DeactivateSupplierOwner(DeactivateSupplierOwnerRequest) returns (DeactivateSupplierOwnerResponse);
  rpc ListSupplierChanges(ListSupplierChangesRequest) returns (ListSupplierChangesResponse);
  rpc ImportSuppliers(ImportSuppliersRequest) returns (ImportSuppliersResponse);
  rpc CheckSupplierDuplicates(CheckSupplierDuplicatesRequest) returns (CheckSupplierDuplicatesResponse);
  rpc GetSupplierDeactivationImpact(GetSupplierDeactivationImpactRequest) returns (GetSupplierDeactivationImpactResponse);
  rpc ListFactories(ListFactoriesRequest) returns (ListFactoriesResponse);
  rpc GetFactory(GetFactoryRequest) returns (GetFactoryResponse);
  rpc CreateFactory(CreateFactoryRequest) returns (CreateFactoryResponse);
  rpc UpdateFactory(UpdateFactoryRequest) returns (UpdateFactoryResponse);
  rpc ListFactoryCountries(ListFactoryCountriesRequest) returns (ListFactoryCountriesResponse);
  rpc ListFactoryContacts(ListFactoryContactsRequest) returns (ListFactoryContactsResponse);
  rpc CreateFactoryContact(CreateFactoryContactRequest) returns (CreateFactoryContactResponse);
  rpc UpdateFactoryContact(UpdateFactoryContactRequest) returns (UpdateFactoryContactResponse);
  rpc DeactivateFactoryContact(DeactivateFactoryContactRequest) returns (DeactivateFactoryContactResponse);
  rpc ListFactoryOwners(ListFactoryOwnersRequest) returns (ListFactoryOwnersResponse);
  rpc CreateFactoryOwner(CreateFactoryOwnerRequest) returns (CreateFactoryOwnerResponse);
  rpc UpdateFactoryOwner(UpdateFactoryOwnerRequest) returns (UpdateFactoryOwnerResponse);
  rpc DeactivateFactoryOwner(DeactivateFactoryOwnerRequest) returns (DeactivateFactoryOwnerResponse);
  rpc ListFactoryCapabilities(ListFactoryCapabilitiesRequest) returns (ListFactoryCapabilitiesResponse);
  rpc CreateFactoryCapability(CreateFactoryCapabilityRequest) returns (CreateFactoryCapabilityResponse);
  rpc DeleteFactoryCapability(DeleteFactoryCapabilityRequest) returns (DeleteFactoryCapabilityResponse);
  rpc ListFactoryCertificates(ListFactoryCertificatesRequest) returns (ListFactoryCertificatesResponse);
  rpc CreateFactoryCertificate(CreateFactoryCertificateRequest) returns (CreateFactoryCertificateResponse);
  rpc DeleteFactoryCertificate(DeleteFactoryCertificateRequest) returns (DeleteFactoryCertificateResponse);
  // The certificate scan: presign hands the browser a short-lived upload
  // URL, the returned key goes into the certificate's file_key on create.
  rpc PresignFactoryCertificateFile(PresignFactoryCertificateFileRequest) returns (PresignFactoryCertificateFileResponse);
  rpc ListFactoryChanges(ListFactoryChangesRequest) returns (ListFactoryChangesResponse);
  rpc ImportFactories(ImportFactoriesRequest) returns (ImportFactoriesResponse);
  rpc CheckFactoryDuplicates(CheckFactoryDuplicatesRequest) returns (CheckFactoryDuplicatesResponse);
  rpc GetFactoryDeactivationImpact(GetFactoryDeactivationImpactRequest) returns (GetFactoryDeactivationImpactResponse);
}

// OptionService serves dropdown dictionaries (payment methods, trade terms,
// exception reasons ...) so business modules never hardcode them.
service OptionService {
  rpc ListOptions(ListOptionsRequest) returns (ListOptionsResponse);
  rpc CreateOption(CreateOptionRequest) returns (CreateOptionResponse);
}

// NumberingService issues document numbers (QT-20260727-0001). Concurrent
// callers always receive distinct numbers; gaps are acceptable, duplicates
// are not.
service NumberingService {
  rpc NextNumber(NextNumberRequest) returns (NextNumberResponse);
  rpc ListNumberRules(ListNumberRulesRequest) returns (ListNumberRulesResponse);
}

message Contact {
  string name = 1;
  string title = 2;
  string email = 3;
  string phone = 4;
  bool is_primary = 5;
  int64 id = 6;
  string department = 7;
  string mobile = 8;
  string instant_messaging = 9;
  string language = 10;
  string remark = 11;
  string status = 12;
  int32 sort_order = 13;
  // ALLOWED / OPTED_OUT / INVALID. ALLOWED contacts may be selected for mail.
  string email_permission = 14;
  // Empty means every mail category; otherwise only the selected categories.
  repeated string email_categories = 15;
}

// PortService owns port master data. Shipping stores the id together with a
// code/name/timezone snapshot, so later edits never rewrite history.
service PortService {
  rpc CreatePort(CreatePortRequest) returns (CreatePortResponse);
  rpc GetPort(GetPortRequest) returns (GetPortResponse);
  rpc ListPorts(ListPortsRequest) returns (ListPortsResponse);
  rpc ListPortCountries(ListPortCountriesRequest) returns (ListPortCountriesResponse);
  rpc ImportPorts(ImportPortsRequest) returns (ImportPortsResponse);
  rpc UpdatePort(UpdatePortRequest) returns (UpdatePortResponse);
  rpc SetPortStatus(SetPortStatusRequest) returns (SetPortStatusResponse);
  rpc GetPortDeactivationImpact(GetPortDeactivationImpactRequest) returns (GetPortDeactivationImpactResponse);
  rpc ListPortChanges(ListPortChangesRequest) returns (ListPortChangesResponse);
}

message Port {
  int64 id = 1;
  string unlocode = 2;
  string name_zh = 3;
  string name_en = 4;
  string country_code = 5;
  string city = 6;
  string timezone = 7;
  repeated string aliases = 8;
  string status = 9;
  string remark = 10;
  int32 version = 11;
  string port_type = 12;
  string admin_area = 13;
  double latitude = 14;
  double longitude = 15;
  bool has_coordinates = 16;
  bool is_favorite = 17;
}

message CreatePortRequest { Port port = 1; }
message GetPortRequest { int64 id = 1; }
message UpdatePortRequest { Port port = 1; }
message SetPortStatusRequest { int64 id = 1; string status = 2; int32 version = 3; string reason = 4; }
message CreatePortResponse { Port port = 1; }
message GetPortResponse { Port port = 1; }
message UpdatePortResponse { Port port = 1; }
message SetPortStatusResponse { Port port = 1; }

message ListPortsRequest {
  erp.common.v1.PageRequest page = 1;
  string keyword = 2;
  string country_code = 3;
  string status = 4;
}
message ListPortsResponse {
  repeated Port ports = 1;
  erp.common.v1.PageMeta meta = 2;
}
message PortCountryCount { string country_code = 1; int64 port_count = 2; }
message ListPortCountriesRequest { string status = 1; }
message ListPortCountriesResponse { repeated PortCountryCount countries = 1; }
message PortImportRow {
  int32 row_number = 1;
  string unlocode = 2;
  string name_zh = 3;
  string name_en = 4;
  string country_code = 5;
  string city = 6;
  string timezone = 7;
  repeated string aliases = 8;
  string remark = 9;
  string port_type = 10;
  string admin_area = 11;
  double latitude = 12;
  double longitude = 13;
  bool has_coordinates = 14;
  bool is_favorite = 15;
  bool profile_fields_present = 16;
}
message PortImportIssue { int32 row_number = 1; string code = 2; string message = 3; }
message ImportPortsRequest { repeated PortImportRow rows = 1; bool confirm = 2; }
message ImportPortsResponse {
  int32 create_count = 1;
  int32 update_count = 2;
  int32 skip_count = 3;
  repeated PortImportIssue issues = 4;
}

message Customer {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string country = 4;
  string address = 5;
  // Default settlement currency for this customer, ISO 4217.
  string currency = 6;
  // Default payment term option code, e.g. "TT" / "LC".
  string payment_term = 7;
  string remark = 8;
  string status = 9;
  repeated Contact contacts = 10;
  // ISO 3166-1 alpha-2, upper case, or empty when nobody has said.
  //
  // This is what the system groups by. The free-text `country` above is what
  // came before it and is on its way out: writes send the code, and the name
  // shown on screen is derived from it by the browser, in whatever language
  // the reader is using.
  string country_code = 11;
  string short_name = 12;
  string english_name = 13;
  string customer_type = 14;
  string industry = 15;
  string source = 16;
  repeated string tags = 17;
  string website = 18;
  string primary_language = 19;
  string timezone = 20;
  string registered_name = 21;
  string registration_no = 22;
  string tax_id = 23;
  string invoice_title = 24;
  string invoice_tax_no = 25;
  string invoice_remark = 26;
  int32 payment_days = 27;
  // Credit limit is stored in the currency's minor unit to avoid floating-point rounding.
  int64 credit_limit_minor = 28;
  string credit_currency = 29;
  string credit_status = 30;
  string business_status = 31;
  repeated CustomerAddress addresses = 32;
  string primary_contact_name = 33;
  repeated CustomerOwner owners = 34;
}

message CreateCustomerRequest {
  string code = 1;
  string name = 2;
  string country = 3;
  string address = 4;
  string currency = 5;
  string payment_term = 6;
  string remark = 7;
  repeated Contact contacts = 8;
  // ISO 3166-1 alpha-2, upper case, or empty when nobody has said.
  //
  // This is what the system groups by. The free-text `country` above is what
  // came before it and is on its way out: writes send the code, and the name
  // shown on screen is derived from it by the browser, in whatever language
  // the reader is using.
  string country_code = 9;
  string short_name = 10;
  string english_name = 11;
  string customer_type = 12;
  string industry = 13;
  string source = 14;
  repeated string tags = 15;
  string website = 16;
  string primary_language = 17;
  string timezone = 18;
  string registered_name = 19;
  string registration_no = 20;
  string tax_id = 21;
  string invoice_title = 22;
  string invoice_tax_no = 23;
  string invoice_remark = 24;
  int32 payment_days = 25;
  int64 credit_limit_minor = 26;
  string credit_currency = 27;
  string credit_status = 28;
  string business_status = 29;
}

message CreateCustomerResponse {
  Customer customer = 1;
}

message GetCustomerRequest {
  int64 id = 1;
}

message GetCustomerResponse {
  Customer customer = 1;
}

message ListCustomersRequest {
  erp.common.v1.PageRequest page = 1;
  string keyword = 2;
  // Empty means ACTIVE only; "ALL" includes deactivated.
  string status = 3;
  // Empty lists every country; __UNCLASSIFIED__ selects customers without a country code.
  string country_code = 4;
  string customer_type = 5;
  string business_status = 6;
  string tag = 7;
  int64 owner_employee_id = 8;
}

message ListCustomersResponse {
  repeated Customer customers = 1;
  erp.common.v1.PageMeta meta = 2;
}

// MailingContact is one addressable person, denormalised with their company.
message MailingContact {
  int64 contact_id = 1;
  string name = 2;
  string title = 3;
  string email = 4;
  bool is_primary = 5;
  int64 customer_id = 6;
  string customer_name = 7;
  string country = 8;
  string country_code = 9;
  string language = 10;
  repeated string email_categories = 11;
}

// CountryGroup is one country and how big a send to it would be.
//
// Two counts, not one, because a picker that shows only customers invites the
// wrong expectation: "Brazil (12)" reads as twelve emails, and if those twelve
// companies have nineteen contacts between them the send is half as big again
// as the person thought.
message CountryGroup {
  // Empty for customers nobody has assigned a country to. They are shown
  // rather than dropped: they are the ones somebody has to go and fix, and a
  // list that hides them is a list that never gets fixed.
  string code = 1;
  int64 customer_count = 2;
  int64 contact_count = 3;
  // How many messages "one per customer" would send. Not a count of primary
  // flags: primary is often unset and the query falls back to the first
  // contact, so counting flags would under-report the size of the send.
  int64 one_each_count = 4;
}

message ListCustomerCountriesRequest {
  // Empty means ACTIVE only; "ALL" includes deactivated.
  string status = 1;
}

message ListCustomerCountriesResponse {
  repeated CountryGroup countries = 1;
}

message ContactsInCountryRequest {
  string country_code = 1;
  // One person per customer instead of everybody at it. The caller has to
  // say: a price update goes to the buyer, a trade-fair invitation goes to
  // whoever might come, and guessing would silently multiply or divide the
  // size of somebody's send.
  bool primary_only = 2;
}

message ContactsInCountryResponse {
  repeated MailingContact contacts = 1;
}

message ListMailingContactsRequest {
  // Matches contact name, email, or customer name.
  string keyword = 1;
  // Contacts of these customers only. Empty means every active customer.
  repeated int64 customer_ids = 2;
}

message ListMailingContactsResponse {
  repeated MailingContact contacts = 1;
}

message UpdateCustomerRequest {
