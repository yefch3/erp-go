message OptionItem {
  int64 id = 1;
  // Dictionary the item belongs to: PAYMENT_METHOD / TRADE_TERM / ...
  string category = 2;
  string code = 3;
  string label = 4;
  int32 sort_order = 5;
  string status = 6;
}

message ListOptionsRequest {
  // Empty returns every category.
  string category = 1;
}

message ListOptionsResponse {
  repeated OptionItem options = 1;
}

message CreateOptionRequest {
  string category = 1;
  string code = 2;
  string label = 3;
  int32 sort_order = 4;
}

message CreateOptionResponse {
  OptionItem option = 1;
}

message NextNumberRequest {
  // Business document type: QUOTATION / CONTRACT / PURCHASE_ORDER / ...
  string biz_type = 1;
}

message NextNumberResponse {
  // Formatted document number, e.g. "QT-20260727-0001".
  string number = 1;
}

message NumberRule {
  int64 id = 1;
  string biz_type = 2;
  string prefix = 3;
  // NONE / DAILY / MONTHLY / YEARLY sequence reset period.
  string period = 4;
  int32 seq_len = 5;
}

message ListNumberRulesRequest {}

message ListNumberRulesResponse {
  repeated NumberRule rules = 1;
}

