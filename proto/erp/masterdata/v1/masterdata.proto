  string country = 3;
  string address = 4;
  string currency = 5;
  string payment_term = 6;
  string remark = 7;
  // Kept for old clients; contacts are maintained through the dedicated contact API.
  repeated Contact contacts = 8;
  // ISO 3166-1 alpha-2, upper case, or empty. See Customer.country_code.
  string country_code = 9;
}

message UpdateCustomerResponse {
