syntax = "proto3";

package erp.fx.v1;

// FxService provides global market reference rates and tenant-specific,
// manually confirmed effective rates. Documents freeze their own snapshots.
//
// Rate semantics: units_per_usd is "how many units of the quote currency one
// USD buys" (1 USD = 7.24 CNY); usd_per_unit is the inverse used when
// converting foreign amounts into the USD base.
service FxService {
  rpc GetLatestRate(GetLatestRateRequest) returns (GetLatestRateResponse);
  rpc ListRates(ListRatesRequest) returns (ListRatesResponse);
  rpc ListAnomalies(ListAnomaliesRequest) returns (ListAnomaliesResponse);
  rpc ListEffectiveRates(ListEffectiveRatesRequest) returns (ListEffectiveRatesResponse);
  rpc ConfirmEffectiveRate(ConfirmEffectiveRateRequest) returns (ConfirmEffectiveRateResponse);
}

message Rate {
  string base_currency = 1; // always USD
  string quote_currency = 2;
  string units_per_usd = 3; // decimal string, e.g. "7.24350000"
  string usd_per_unit = 4;  // decimal string, e.g. "0.13805000"
  string rate_date = 5;     // YYYY-MM-DD
  string source = 6;        // FRANKFURTER / MANUAL
  string fetched_at = 7;    // RFC 3339
}

message GetLatestRateRequest {
  string quote_currency = 1;
}

message GetLatestRateResponse {
  Rate rate = 1;
}

message ListRatesRequest {
  string quote_currency = 1;
  // How many days of history; 0 means 30.
  int32 days = 2;
}

message ListRatesResponse {
  repeated Rate rates = 1;
}

message Anomaly {
  int64 id = 1;
  string quote_currency = 2;
  string new_rate = 3;
  string prev_rate = 4;
  string deviation_pct = 5;
  string source = 6;
  string detected_at = 7;
  string note = 8;
}

message ListAnomaliesRequest {}

message ListAnomaliesResponse {
  repeated Anomaly anomalies = 1;
}

message EffectiveRate {
  string base_currency = 1;
  string quote_currency = 2;
  string rate = 3;
  string confirmed_by = 4;
  string confirmed_at = 5;
  string remark = 6;
  string system_rate = 7;
  string system_updated_at = 8;
}
message ListEffectiveRatesRequest {}
message ListEffectiveRatesResponse { repeated EffectiveRate rates = 1; }
message ConfirmEffectiveRateRequest {
  string base_currency = 1;
  string quote_currency = 2;
  string rate = 3;
  string remark = 4;
}
message ConfirmEffectiveRateResponse { EffectiveRate rate = 1; }
