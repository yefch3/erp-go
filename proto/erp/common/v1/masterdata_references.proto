syntax = "proto3";
package erp.common.v1;
service MasterDataReferenceService {
  rpc CheckMasterDataReferences(CheckMasterDataReferencesRequest) returns (CheckMasterDataReferencesResponse);
}
message MasterDataReferenceCandidate { int64 id = 1; repeated string labels = 2; }
message CheckMasterDataReferencesRequest { string entity = 1; repeated MasterDataReferenceCandidate candidates = 2; }
message CheckMasterDataReferencesResponse { repeated int64 referenced_ids = 1; }
