syntax = "proto3";

package erp.common.v1;

import "google/protobuf/timestamp.proto";

// Money carries an exact decimal amount as a string ("1234.56") to avoid
// floating point loss across languages. Currency is an ISO 4217 code.
message Money {
  string currency = 1;
  string amount = 2;
}

// FxSnapshot is the exchange rate frozen into a document at business time.
// It is embedded by value: documents never reference the live rate tables,
// so later rate changes cannot alter historical documents.
message FxSnapshot {
  // Currency the rate converts into (system base currency, USD).
  string base_currency = 1;
  // Exact decimal rate as a string, e.g. "7.24350000".
  string rate = 2;
  google.protobuf.Timestamp quoted_at = 3;
  // Where the rate came from: FRANKFURTER / MANUAL / ...
  string source = 4;
}
