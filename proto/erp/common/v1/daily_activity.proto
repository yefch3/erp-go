syntax = "proto3";

package erp.common.v1;

// A per-employee aggregate. Employee ID zero is the distinct-document total.
message DailyActivityRow {
  int64 employee_id = 1;
  int64 inquiries_created = 2;
  int64 quotations_sent = 3;
  int64 purchase_orders_handled = 4;
  int64 schedules_updated = 5;
  string bucket = 6; // Beijing start date of a trend bucket, empty for overall counts.
}
