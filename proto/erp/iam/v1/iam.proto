syntax = "proto3";

package erp.iam.v1;

import "erp/common/v1/pagination.proto";

// AuthService issues JWTs. The gateway is its only caller.
//
// Every RPC here is reachable without a session, because each one is a step
// on the way to having one. That is what makes them the two routes worth
// rate limiting and the two worth being most careful about what they reveal.
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  // PeekInvitation reads an activation link without redeeming it, so the page
  // can say the link expired before asking for a password rather than after.
  rpc PeekInvitation(PeekInvitationRequest) returns (PeekInvitationResponse);
  // ActivateAccount redeems the link: it sets the password the person chose
  // and records that their company mailbox was proved to be theirs.
  rpc ActivateAccount(ActivateAccountRequest) returns (ActivateAccountResponse);
  // RequestPasswordReset mints a one-time reset link for the account behind
  // an address, if one exists — and says so only to the gateway. Whether an
  // address has an account must never reach the unauthenticated caller: a
  // login page that answers differently is a staff directory.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  // PeekPasswordReset reads a reset link without redeeming it, same contract
  // as PeekInvitation: say the link is dead before asking for a password.
  rpc PeekPasswordReset(PeekPasswordResetRequest) returns (PeekPasswordResetResponse);
  // RedeemPasswordReset spends the link and sets the password the person
  // chose. The caller is expected to end the account's live sessions next —
  // "I lost the password" and "somebody else may have it" are the same event
  // until proven otherwise.
  rpc RedeemPasswordReset(RedeemPasswordResetRequest) returns (RedeemPasswordResetResponse);
}

// DirectoryService owns departments and employees.
service DirectoryService {
  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (UpdateDepartmentResponse);
  rpc CreateEmployee(CreateEmployeeRequest) returns (CreateEmployeeResponse);
  rpc GetEmployee(GetEmployeeRequest) returns (GetEmployeeResponse);
  rpc ListEmployees(ListEmployeesRequest) returns (ListEmployeesResponse);
  rpc UpdateEmployee(UpdateEmployeeRequest) returns (UpdateEmployeeResponse);
  rpc DeactivateEmployee(DeactivateEmployeeRequest) returns (DeactivateEmployeeResponse);
  // ActivateEmployee reinstates someone marked as left - people come
  // back, and a mistaken departure must be undoable from the UI.
  rpc ActivateEmployee(ActivateEmployeeRequest) returns (ActivateEmployeeResponse);
  // OpenAccount gives an existing employee a login; employees created
  // without one are the normal case (not everyone uses the system).
  rpc OpenAccount(OpenAccountRequest) returns (OpenAccountResponse);
  // ResetPassword is the administrator path: no old password, but it needs
  // iam:employee:write, which the gateway enforces.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // ChangePassword is the self-service path: the caller's own account,
  // proven with the current password.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // ListManagers returns an employee's direct manager, for approval flows
  // whose node says "whoever the submitter reports to" rather than naming a
  // role. A list because the caller wants assignees either way, and someone
  // at the top of the tree simply has none.
  rpc ListManagers(ListManagersRequest) returns (ListManagersResponse);
  // SetManager changes who someone reports to.
  rpc SetManager(SetManagerRequest) returns (SetManagerResponse);
  // InviteEmployee mints a one-time activation link. It does not send it:
  // every mail this system emits leaves through some employee's own bound
  // mailbox, and iam has no mail client — the mail service already depends on
  // iam, so the reverse edge would close a cycle. The gateway, which holds
  // both, does the sending.
  rpc InviteEmployee(InviteEmployeeRequest) returns (InviteEmployeeResponse);
  // CreatePasswordReset is the administrator's version of the login page's
  // 忘记密码: same link, but minted on somebody's behalf and recorded as such.
  rpc CreatePasswordReset(CreatePasswordResetRequest) returns (CreatePasswordResetResponse);
  // RecordAccountEvent writes an account action into the change history when
  // the action itself happens outside iam — today, the gateway ending
  // somebody's sessions in Redis. Audit lives here because 变更记录 lives here.
  rpc RecordAccountEvent(RecordAccountEventRequest) returns (RecordAccountEventResponse);
  // ImportEmployees takes a whole pasted block. dry_run makes it a preview:
  // same validation, nothing written. The two share one code path on purpose
  // — a preview computed by a second, simpler validator eventually lies, and
  // it lies at the moment somebody has already decided to trust it.
  rpc ImportEmployees(ImportEmployeesRequest) returns (ImportEmployeesResponse);
  rpc ListDirectoryChanges(ListDirectoryChangesRequest) returns (ListDirectoryChangesResponse);
}

// AccessService owns roles, permissions and the permission check other
// services and the gateway rely on.
// PlatformService 是平台层：开客户公司、启停、给第一位管理员发邀请。
//
// 每个 RPC 的守卫都是 platform_operators 名单，不是权限系统——每家公司的超管
// 自动持全部权限，做成权限的「开公司」会流进客户管理员手里。名单校验在 iam
// 内部完成，网关只负责转发身份。
service PlatformService {
  rpc CheckOperator(CheckOperatorRequest) returns (CheckOperatorResponse);
  rpc ListPlatformTenants(ListPlatformTenantsRequest) returns (ListPlatformTenantsResponse);
  // 开公司并给管理员铸一张邀请。发信是网关的事（走操作员自己绑定的邮箱），
  // 分工与员工邀请完全相同。
  rpc CreatePlatformTenant(CreatePlatformTenantRequest) returns (CreatePlatformTenantResponse);
  // 再铸一张（旧链接作废）。已激活的管理员会被拒绝。
  rpc ReinvitePlatformAdmin(ReinvitePlatformAdminRequest) returns (ReinvitePlatformAdminResponse);
  rpc SetPlatformTenantStatus(SetPlatformTenantStatusRequest) returns (SetPlatformTenantStatusResponse);
}

service AccessService {
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GrantRolePermissions(GrantRolePermissionsRequest) returns (GrantRolePermissionsResponse);
  rpc AssignEmployeeRoles(AssignEmployeeRolesRequest) returns (AssignEmployeeRolesResponse);
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);
  // CheckPermission answers "may employee X do Y", used by the gateway on
  // every mutating request.
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  // ListEmployeePermissions returns every permission code an employee holds,
  // used by the gateway to render menus and by the frontend to hide actions.
  rpc ListEmployeePermissions(ListEmployeePermissionsRequest) returns (ListEmployeePermissionsResponse);
  // ListRoleMembers returns the active employees holding a role. The approval
  // engine calls it when a flow node names a role rather than a person, to
  // turn that node into concrete tasks.
  rpc ListRoleMembers(ListRoleMembersRequest) returns (ListRoleMembersResponse);
  // VisibleEmployees answers "whose documents may this person see" for one
  // module, from the data scope attached to their roles. Business services
  // ask it instead of inventing their own idea of who owns what.
  rpc VisibleEmployees(VisibleEmployeesRequest) returns (VisibleEmployeesResponse);
  // ListDataScopes returns every role's data scope, for the admin screen.
  rpc ListDataScopes(ListDataScopesRequest) returns (ListDataScopesResponse);
  // SetDataScope changes one role's scope for one module.
  rpc SetDataScope(SetDataScopeRequest) returns (SetDataScopeResponse);
}

// DataScope says how much of a module's documents a role may see.
message DataScope {
  int64 role_id = 1;
  string module = 2;
  // SELF / DEPT / DEPT_AND_SUB / ALL / CUSTOM
  string scope_type = 3;
  // Only meaningful for CUSTOM.
  repeated int64 department_ids = 4;
}

message ListDataScopesRequest {}

message ListDataScopesResponse {
  repeated DataScope scopes = 1;
}

message SetDataScopeRequest {
  DataScope scope = 1;
}

message SetDataScopeResponse {
  bool saved = 1;
}

message LoginRequest {
  // The company address. Its domain selects the tenant, so no separate
  // company field is needed and none should be added.
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  int64 expires_in_seconds = 2;
  Employee employee = 3;
  repeated string permission_codes = 4;
  // The password that just worked was typed by an administrator, not chosen
  // by this person. The session is real but owes an immediate change — the
  // frontend blocks everything else until it happens.
  bool must_change_password = 5;
}

message InviteEmployeeRequest {
  int64 employee_id = 1;
}

message InviteEmployeeResponse {
  // The token in the clear, on this response and nowhere else. Storage holds
  // only its sha256, so this is the one moment it exists in a readable form —
  // the caller must put it straight into the link and drop it.
  string token = 1;
  // Where the mail has to go, and who to. Returned rather than looked up
  // again by the caller, so the address the link was minted for and the
  // address it is mailed to cannot disagree.
  string email = 2;
  string name = 3;
  int64 expires_at = 4;
}

// ImportEmployeeRow is one pasted line, untouched. Every field arrives as
// text because that is what a clipboard holds; making sense of it is the
// service's job, and doing it there means the preview and the commit cannot
// disagree about what a row means.
message ImportEmployeeRow {
  string code = 1;
  string name = 2;
  // Matched against a department's name or its code — a spreadsheet column
  // headed 部门 holds whichever the person who made it had to hand.
  string department = 3;
  string position = 4;
  string email = 5;
  string phone = 6;
  // The manager's 工号, which may appear further down the same block: org
  // charts are usually written top-down but pasted in whatever order.
  string manager_code = 7;
}

message ImportEmployeesRequest {
  repeated ImportEmployeeRow rows = 1;
  bool dry_run = 2;
}

// ImportRowVerdict is what happened, or would happen, to one line. The line
// number is the pasted one, so a reason can be read beside the row that
// caused it rather than hunted for.
message ImportRowVerdict {
  int32 line = 1;
  string code = 2;
  string name = 3;
  bool ok = 4;
  string reason = 5;
}

message ImportEmployeesResponse {
  repeated ImportRowVerdict verdicts = 1;
  int32 ready = 2;
  int32 blocked = 3;
  // How many rows were actually written. Zero on a preview, and zero on a
  // real import that found anything wrong — the batch is all-or-nothing,
  // because a half-applied import leaves nobody able to tell which half.
  int32 imported = 4;
}

message PeekInvitationRequest {
  string token = 1;
}

message PeekInvitationResponse {
  // Who the link is for, so somebody can see they opened the right one. Not a
  // secret: whoever holds the token was sent it, at this address.
  string name = 1;
  string email = 2;
}

message ActivateAccountRequest {
  string token = 1;
  string password = 2;
}

message ActivateAccountResponse {
  // The address that now logs in. Returned so the page can go straight to a
  // filled-in login form instead of asking somebody to retype what we know.
  string email = 1;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message RequestPasswordResetResponse {
  // False means "no usable account behind that address" — a fact for the
  // gateway alone, which answers the caller identically either way.
  bool found = 1;
  // The token in the clear, on this response and nowhere else — storage
  // holds only its sha256. The gateway puts it into the link and drops it.
  string token = 2;
  string email = 3;
  string name = 4;
  int64 tenant_id = 5;
  int64 employee_id = 6;
  // Whose bound mailbox should carry the mail: the person's inviter, or the
  // person themselves when no invitation ever existed (the bootstrap admin).
  int64 sender_employee_id = 7;
  int64 expires_at = 8;
}

message PeekPasswordResetRequest {
  string token = 1;
}

message PeekPasswordResetResponse {
  string name = 1;
  string email = 2;
}

message RedeemPasswordResetRequest {
  string token = 1;
  string password = 2;
}

message RedeemPasswordResetResponse {
  string email = 1;
  int64 tenant_id = 2;
  int64 employee_id = 3;
}

message CreatePasswordResetRequest {
  int64 employee_id = 1;
}

message CreatePasswordResetResponse {
  string token = 1;
  string email = 2;
  string name = 3;
  int64 expires_at = 4;
}

message RecordAccountEventRequest {
  int64 employee_id = 1;
  // A short verb from the fixed vocabulary the gateway and iam share,
  // e.g. SESSIONS_REVOKED. Free text stays out of an audit column.
  string action = 2;
}

message RecordAccountEventResponse {
  bool recorded = 1;
}

message Department {
  int64 id = 1;
  string code = 2;
  string name = 3;
  int64 parent_id = 4;
  string status = 5;
  string path = 6;
  int32 level = 7;
  int32 sort_order = 8;
  int64 leader_employee_id = 9;
  string leader_employee_name = 10;
  int32 version = 11;
}

message CreateDepartmentRequest {
  string code = 1;
  string name = 2;
  int64 parent_id = 3;
  int32 sort_order = 4;
  int64 leader_employee_id = 5;
}

message CreateDepartmentResponse {
  Department department = 1;
}

message ListDepartmentsRequest {}

message ListDepartmentsResponse {
  repeated Department departments = 1;
}

message UpdateDepartmentRequest {
  int64 id = 1;
  string code = 2;
  string name = 3;
  int64 parent_id = 4;
  int32 sort_order = 5;
  int64 leader_employee_id = 6;
  string status = 7;
  int32 expected_version = 8;
}

message UpdateDepartmentResponse {
  Department department = 1;
}

message Employee {
  int64 id = 1;
  string code = 2;
  string name = 3;
  int64 department_id = 4;
  string department_name = 5;
  string position = 6;
  string email = 7;
  string phone = 8;
  string status = 9;
  repeated int64 role_ids = 10;
  // Empty when the employee has no login account, which is normal.
  string username = 11;
  // Who this person reports to. Zero at the top of the tree.
  int64 manager_id = 12;
  string manager_name = 13;
  // Whether the mailbox on this row was ever proved to be theirs, by opening
  // a link sent to it. The employee list needs it to tell 未激活 from 已激活,
  // which during a migration is the only question anybody is asking.
  bool email_verified = 14;
  // When this person's unopened invitation stops working; 0 means they have
  // none. Together with email_verified this is the whole status: nothing
  // pending and unverified means nobody has invited them yet, which is a
  // different problem from an invitation sitting unread.
  int64 invite_expires_at = 15;
  string english_name = 16;
  string hire_date = 17;
  string leave_date = 18;
  string remark = 19;
  int32 version = 20;
}

message CreateEmployeeRequest {
  string code = 1;
  string name = 2;
  int64 department_id = 3;
  string position = 4;
  string email = 5;
  string phone = 6;
  // Optional login account created alongside the employee.
  string username = 7;
  string initial_password = 8;
  int64 manager_id = 9;
  string english_name = 10;
  string hire_date = 11;
  string remark = 12;
}

message CreateEmployeeResponse {
  Employee employee = 1;
}

message GetEmployeeResponse {
  Employee employee = 1;
}

message GetEmployeeRequest {
  int64 id = 1;
}

message ListEmployeesRequest {
  erp.common.v1.PageRequest page = 1;
  int64 department_id = 2;
  string keyword = 3;
  int64 manager_id = 4;
  int64 role_id = 5;
  string account_status = 6;
  string employment_status = 7;
}

message ListEmployeesResponse {
  repeated Employee employees = 1;
  erp.common.v1.PageMeta meta = 2;
}

message UpdateEmployeeRequest {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string english_name = 4;
  int64 department_id = 5;
  string position = 6;
  string email = 7;
  string phone = 8;
  int64 manager_id = 9;
  string hire_date = 10;
  string leave_date = 11;
  string remark = 12;
  int32 expected_version = 13;
}

message UpdateEmployeeResponse {
  Employee employee = 1;
}

message DirectoryChange {
  int64 id = 1;
  string entity_type = 2;
  int64 entity_id = 3;
  string action = 4;
  string before_json = 5;
  string after_json = 6;
  int64 operator_id = 7;
  string created_at = 8;
}

message ListDirectoryChangesRequest {
  string entity_type = 1;
  int64 entity_id = 2;
}

message ListDirectoryChangesResponse {
  repeated DirectoryChange changes = 1;
}

message DeactivateEmployeeRequest {
  int64 id = 1;
}

message DeactivateEmployeeResponse {}

message ActivateEmployeeRequest {
  int64 id = 1;
}

message ActivateEmployeeResponse {
  bool activated = 1;
}

message Role {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  repeated string permission_codes = 5;
}

message CreateRoleRequest {
  string code = 1;
  string name = 2;
  string description = 3;
}

message CreateRoleResponse {
  Role role = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message GrantRolePermissionsResponse {}

message GrantRolePermissionsRequest {
  int64 role_id = 1;
  // Full replacement: the role ends up with exactly these codes.
  repeated string permission_codes = 2;
}

message AssignEmployeeRolesResponse {}

message AssignEmployeeRolesRequest {
  int64 employee_id = 1;
  // Full replacement of the employee's role set.
  repeated int64 role_ids = 2;
}

message Permission {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string module = 4;
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message CheckPermissionRequest {
  int64 employee_id = 1;
  string permission_code = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message ListEmployeePermissionsRequest {
  int64 employee_id = 1;
}

message ListEmployeePermissionsResponse {
  repeated string permission_codes = 1;
}

message OpenAccountRequest {
  int64 employee_id = 1;
  string username = 2;
  string initial_password = 3;
}

message OpenAccountResponse {
  string username = 1;
}

message ResetPasswordRequest {
  int64 employee_id = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool reset = 1;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {
  bool changed = 1;
}

message ListRoleMembersRequest {
  int64 role_id = 1;
}

message ListManagersRequest {
  int64 employee_id = 1;
  // How far up the reporting line: 1 is the direct manager, 2 theirs, and so
  // on. Zero means 1. Empty response once the chain runs out.
  int32 levels = 2;
}

message ListManagersResponse {
  repeated int64 employee_ids = 1;
}

message SetManagerRequest {
  int64 employee_id = 1;
  // Zero clears it.
  int64 manager_id = 2;
}

message SetManagerResponse {
  bool changed = 1;
}

message VisibleEmployeesRequest {
  int64 employee_id = 1;
  // "export", "procurement", ... matching role_data_scopes.module.
  string module = 2;
}

message VisibleEmployeesResponse {
  // When true the caller sees everything and employee_ids is meaningless.
  bool all = 1;
  repeated int64 employee_ids = 2;
  // SELF / DEPT / DEPT_AND_SUB / ALL / CUSTOM, for display and for logs.
  string scope_type = 3;
}

message RoleMember {
  int64 employee_id = 1;
  string name = 2;
}

message ListRoleMembersResponse {
  repeated RoleMember members = 1;
}

message CheckOperatorRequest {}
message CheckOperatorResponse { bool operator = 1; }

message ListPlatformTenantsRequest {}
message PlatformTenant {
  int64 id = 1;
  string name = 2;
  string status = 3;
  string created_at = 4;
  string admin_email = 5;
  bool admin_activated = 6;
}
message ListPlatformTenantsResponse { repeated PlatformTenant tenants = 1; }

message CreatePlatformTenantRequest {
  string name = 1;
  string admin_email = 2;
}
message CreatePlatformTenantResponse {
  PlatformTenant tenant = 1;
  // 与员工邀请同一形状：token 只在这条响应上以明文存在一次。
  InviteEmployeeResponse invitation = 2;
}

message ReinvitePlatformAdminRequest { int64 tenant_id = 1; }
message ReinvitePlatformAdminResponse { InviteEmployeeResponse invitation = 1; }

message SetPlatformTenantStatusRequest {
  int64 tenant_id = 1;
  string status = 2;
}
message SetPlatformTenantStatusResponse { bool ok = 1; }
