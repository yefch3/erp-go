  repeated string column_keys = 6;
}

// The finished workbook. Named for an RPC that no longer exists: this is now
// purely the `result` of a completed job, and renaming it would churn every
// caller for nothing.
message ConvertInboundToExcelResponse {
  string file_name = 1;
  bytes file_data = 2;
  repeated ExcelSheetPreview sheets = 3;
  string model = 4;
}

// One column of the tenant's current default inquiry template, snapshotted
// into the job at request time: a template edit afterwards cannot change
// what an already-queued conversion produces.
message InquiryColumnSpec {
  string field_key = 1;
  string display_name = 2;
  string data_type = 3; // TEXT | NUMBER | DATE
  bool is_required = 4;
  string default_value = 5;
}

message StartInboundExcelConversionRequest {
  int64 id = 1;
  optional int64 attachment_id = 2;
  optional string selected_text = 3;
  string locale = 4;
  // The default inquiry template's columns, resolved by the gateway. Empty
  // falls back to the system layout so older callers keep working.
  repeated InquiryColumnSpec template_columns = 5;
  // Immutable identity for the column snapshot above. Mail only carries it;
  // procurement remains the owner of template definitions.
  int64 inquiry_template_id = 6;
  string inquiry_template_code = 7;
  int32 inquiry_template_version = 8;
}

message ExcelConversionJob {
  int64 id = 1;
  string status = 2;
  ConvertInboundToExcelResponse result = 3;
  string error_code = 4;
  string error_message = 5;
  string created_at = 6;
  string completed_at = 7;
  int64 inquiry_template_id = 8;
  string inquiry_template_code = 9;
  int32 inquiry_template_version = 10;
}

message StartInboundExcelConversionResponse { ExcelConversionJob job = 1; }
message GetInboundExcelConversionJobRequest { int64 id = 1; }
message GetInboundExcelConversionJobResponse { ExcelConversionJob job = 1; }

message ExcelUsageRequest {
  // YYYY-MM；留空表示全部月份。
  string month = 1;
}

message ExcelUsageRow {
  string month = 1;
  int64 owner_id = 2;
  string owner_name = 3;
  int64 runs = 4;
  int64 succeeded = 5;
  int64 failed = 6;
  int64 input_tokens = 7;
  int64 output_tokens = 8;
  // 按当下单价折出来的估算金额。空串表示没配单价——空和 0 是两回事。
  string estimated_cost = 9;
  string currency = 10;
}

// ExcelQuota 是一家公司当下的额度状况：上限多少、本月用了多少。
message ExcelQuota {
  // 有没有上限。false 时 monthly_runs 没有意义——「没设额度」和「上限 0」
  // 是相反的两件事，所以分成两个字段，不让 0 兼职表示「不限」。
  bool limited = 1;
  // 每月可以转换的次数上限。
  int64 monthly_runs = 2;
  // 本月已经发起的次数，含失败的——失败也真的花了钱。
  int64 used_this_month = 3;
  // 数据库认定的当前月份 YYYY-MM。前端拿它和用户选的月份比对：只有看着
  // 当月时，「还剩多少」才是一个活的事实。
  string current_month = 4;
}

message ExcelUsageResponse {
  repeated ExcelUsageRow rows = 1;
  ExcelQuota quota = 2;
}

// 以下两条**跨租户**，只给平台运营。守门在网关那一层，和死信台账同一道门。

