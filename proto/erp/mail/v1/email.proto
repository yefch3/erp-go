  string owner_type = 2;
  int64 owner_id = 3;
  string name = 4;
  string content = 5;
  bool is_default = 6;
}

// Suppression is an address that must never be written to again.
message Suppression {
  int64 id = 1;
  string email = 2;
  // HARD_BOUNCE / COMPLAINT / UNSUBSCRIBE / MANUAL
  string reason = 3;
  string detail = 4;
  string created_at = 5;
}

