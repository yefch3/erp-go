syntax = "proto3";

package erp.mail.v1;

import "erp/common/v1/pagination.proto";

// EmailService owns correspondence with customers: what was composed, who it
// went to, and what happened to each copy.
//
// The unit is one message per recipient, never one message with a list of
// addresses. That single decision is what makes four requirements possible at
// once - recipients cannot see each other, each mail is personalised, each is
// retried on its own, and each carries its own delivery status.
service EmailService {
  rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse);
  rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse);
  // Render as one chosen recipient will receive it. Required before sending:
  // a variable that cannot resolve is only obvious when somebody sees the
  // gap where the name should be.
  rpc PreviewCampaign(PreviewCampaignRequest) returns (PreviewCampaignResponse);
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse);

  // The per-recipient list. Also the failed-delivery queue, filtered.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
  // Put a failed message back, optionally at a corrected address.
  rpc RequeueMessage(RequeueMessageRequest) returns (RequeueMessageResponse);
  // Close a failed message without sending it. Requires a reason.
  rpc AbandonMessage(AbandonMessageRequest) returns (AbandonMessageResponse);

  // Drafts. Personal by construction - every one of these is scoped to the
  // caller and no data scope widens it. A draft is unfinished thinking, not
  // correspondence: nobody has said it yet.
  rpc SaveDraft(SaveDraftRequest) returns (SaveDraftResponse);
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);
  rpc GetDraft(GetDraftRequest) returns (GetDraftResponse);
  rpc DeleteDraft(DeleteDraftRequest) returns (DeleteDraftResponse);
  // Promote a draft into a real send. Runs the ordinary create path, so the
  // draft only disappears once the mail is queued.
  rpc SendDraft(SendDraftRequest) returns (SendDraftResponse);

  // Timed delivery. A scheduled send is already queued - the hold is a column
  // the worker respects - so these three are about the window before it goes:
  // what is waiting, let one go early, and stop one that has not gone.
  rpc ListScheduled(ListScheduledRequest) returns (ListScheduledResponse);
  rpc SendScheduledNow(SendScheduledNowRequest) returns (SendScheduledNowResponse);
  // Cancelling returns the mail to the drafts folder rather than binning it:
  // somebody who calls a send back usually means to change it, not lose it.
  rpc CancelScheduled(CancelScheduledRequest) returns (CancelScheduledResponse);

  rpc ListSignatures(ListSignaturesRequest) returns (ListSignaturesResponse);
  rpc CreateSignature(CreateSignatureRequest) returns (CreateSignatureResponse);
  rpc UpdateSignature(UpdateSignatureRequest) returns (UpdateSignatureResponse);
  rpc DeleteSignature(DeleteSignatureRequest) returns (DeleteSignatureResponse);

  // Files travelling with a send, and pictures embedded inside one.
  //
  // Bytes go browser-to-bucket through the presigned URL and never occupy
  // the gateway; only metadata passes through here. The size the client
  // reports afterwards is never trusted - Register reads the real one back
  // out of storage, because a cap checked against a claim is not a cap.
  rpc PresignAttachment(PresignAttachmentRequest) returns (PresignAttachmentResponse);
  rpc RegisterAttachment(RegisterAttachmentRequest) returns (RegisterAttachmentResponse);
  rpc ListAttachments(ListAttachmentsRequest) returns (ListAttachmentsResponse);
  rpc PresignImage(PresignImageRequest) returns (PresignImageResponse);
  rpc RegisterImage(RegisterImageRequest) returns (RegisterImageResponse);
  rpc ImportImage(ImportImageRequest) returns (ImportImageResponse);
  // Serves the public, token-addressed image route. Bounded by the 2 MB cap,
  // so one unary response is fine and streaming would be ceremony.
  rpc FetchImage(FetchImageRequest) returns (FetchImageResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc WithdrawImage(WithdrawImageRequest) returns (WithdrawImageResponse);

  // Addresses that must never be written to again.
  // Whose correspondence the caller may open, for the supervisor view. A
  // separate surface from the personal mailbox on purpose: reading somebody
  // else's mail should be a deliberate act, not a wider default.
  rpc ListSenders(ListSendersRequest) returns (ListSendersResponse);

  rpc ListSuppressions(ListSuppressionsRequest) returns (ListSuppressionsResponse);
  rpc AddSuppression(AddSuppressionRequest) returns (AddSuppressionResponse);
  rpc RemoveSuppression(RemoveSuppressionRequest) returns (RemoveSuppressionResponse);

  // How this company reaches its mail host — the values off the provider's
  // admin console. Administrative: one setting for everybody.
  rpc GetMailHost(GetMailHostRequest) returns (GetMailHostResponse);
  rpc SaveMailHost(SaveMailHostRequest) returns (SaveMailHostResponse);

  // The caller's own mailbox. There is deliberately no employee_id on any of
  // these: nobody sets somebody else's authorisation code, administrators
  // included, because the only way to hold one is to have been given it by
  // the person it belongs to.
  rpc GetMyMailAccount(GetMyMailAccountRequest) returns (GetMyMailAccountResponse);

  // Records that a tracking pixel was fetched. Called by the gateway on
  // behalf of a recipient's mail client, which has no session.
  rpc RecordOpen(RecordOpenRequest) returns (RecordOpenResponse);

  // Proves the caller controls their mailbox by logging in to the mail host
  // with the code they typed, live. An ERP session alone must not open the
  // mailbox: this is what stands between a walked-away-from workstation and
  // somebody's correspondence.
  rpc VerifyMailAccess(VerifyMailAccessRequest) returns (VerifyMailAccessResponse);

  // Turns a Google authorisation code into a bound mailbox. The person
  // signed in on Google's own page; their password never existed here.
  rpc CompleteGoogleOAuth(CompleteGoogleOAuthRequest) returns (CompleteGoogleOAuthResponse);

  // Mail that arrived. A separate surface from the sent side because the two
  // have almost nothing in common: one is a delivery attempt with retries and
  // a provider verdict, the other is a document somebody sent us.
  rpc ListInbound(ListInboundRequest) returns (ListInboundResponse);
  // Search across every folder, rather than inside the one being viewed.
  rpc SearchMail(SearchMailRequest) returns (SearchMailResponse);
  rpc GetInbound(GetInboundRequest) returns (GetInboundResponse);
  // One conversation, both directions, oldest first. Owner-scoped: the
  // caller sees only their own half of the world.
  rpc GetMailThread(GetMailThreadRequest) returns (GetMailThreadResponse);
  // One conversation as a document somebody outside the ERP can read: a
  // transcript, self-contained, nothing fetched when it is opened. Records
  // the export before returning the bytes — an export that cannot be logged
  // does not happen, which is the point of having the permission at all.
  rpc ExportMailThread(ExportMailThreadRequest) returns (ExportMailThreadResponse);
  // The export log. Scoped like the team mail view: a manager sees their own
  // team, an administrator sees the company.
  rpc ListMailExports(ListMailExportsRequest) returns (ListMailExportsResponse);
  // Inbox housekeeping: read/unread, star, archive, trash. Applied here
  // first and carried to the mail host within seconds by the write-back
  // queue, so the two views agree.
  rpc MarkInbound(MarkInboundRequest) returns (MarkInboundResponse);
  // Permanent deletion, from the trash only: removes the ERP-side record,
  // the raw MIME and the attachment copies in object storage, and the mail
  // host's own copy with them. Irreversible on both sides, deliberately.
  rpc PurgeInbound(PurgeInboundRequest) returns (PurgeInboundResponse);
  // Marks everything one view shows as read. Scoped to that view and never
  // the whole mailbox; the host is told too, like every other flag change.
  rpc MarkViewRead(MarkViewReadRequest) returns (MarkViewReadResponse);
  // Permanent deletion of everything in the trash at once. Trash also clears
  // itself after thirty days; this is the same thing done deliberately.
  rpc EmptyTrash(EmptyTrashRequest) returns (EmptyTrashResponse);
  // Clears the junk view into the trash. Not permanent deletion: the mail
  // worth finding in a spam folder is the enquiry the filter got wrong, and
  // that is noticed a day later, not now.
  rpc EmptyJunk(EmptyJunkRequest) returns (EmptyJunkResponse);
  // Mail this mailbox sent — through any client, over whatever history the
  // backfill has reached. ERP sends live in ListMessages with per-recipient
  // status; these are plain copies from the host's own Sent folder.
  rpc ListMailboxSent(ListMailboxSentRequest) returns (ListMailboxSentResponse);
  // Pull now rather than waiting for the next poll. A mail host offers no
  // webhook, so this is the "refresh" a person reaches for.
  rpc SyncMailbox(SyncMailboxRequest) returns (SyncMailboxResponse);
}

// InboundMail is one received message as a list shows it.
message InboundMail {
  int64 id = 1;
  string from_email = 2;
  string from_name = 3;
  string subject = 4;
  string snippet = 5;
  string thread_key = 6;
  bool is_read = 7;
  bool has_attachments = 8;
  string received_at = 9;
  string sent_at = 10;
  // Only on the single read.
  string body_html = 11;
  string body_text = 12;
  string to_email = 13;
  repeated InboundAttachment attachments = 14;
  bool is_starred = 15;
  // How many messages this list row stands for. The list collapses a
  // conversation into one row; 1 means a lone message.
  int32 thread_count = 16;

  // ---- Sent folder only. -------------------------------------------------
  // A sent mail is recorded in two places that cannot be matched to each
  // other — Gmail rewrites the Message-ID on the way out — so the Sent list
  // merges both and each row says which one it is.
  //
  // "ERP" means the ERP sent it and is tracking delivery: id is an
  // EmailMessage and status/opened_at are filled in. "HOST" means it came
  // from the mail host's own Sent folder, sent by some other client: id is an
  // InboundMail, and the host records nothing about what happened next.
  string kind = 17;
  string to_name = 18;
  // Delivery status of an ERP send. Empty for a host copy.
  string status = 19;
  // When the tracking pixel was first fetched, if it ever was. Deliberately
  // not called "read": see MessageDetail.tracking_enabled.
  string opened_at = 20;
  // Whether the original MIME is still archived, and so whether this mail can
  // be forwarded as a .eml attachment. The screen greys the action out rather
  // than letting somebody compose a forward the send path will refuse.
  bool has_raw = 21;
  // The conversation this message quotes back inside itself, split out so the
  // reader can fold it behind a button. Empty means there was nothing worth
  // folding — the answer for most mail. Turn sixteen of a thread is turns one
  // to fifteen stacked up, and one such message measured 10747 pixels.
  string quoted_html = 22;
}

message InboundAttachment {
  int64 id = 1;
  string file_name = 2;
  string content_type = 3;
  int64 file_size = 4;
  // Signed, time-limited, and carrying the original file name. Empty when the
  // file was never stored or storage is unreachable - the attachment is still
  // listed, because "there was a file called this" is worth knowing.
  string download_url = 5;
  // Whether a copy was actually kept. Separates the two reasons a download
  // URL can be missing, which look identical to the reader and are not:
  // false means the bytes were never stored and never will be; true with an
  // empty URL means something is wrong right now and retrying may work.
  bool stored = 6;
  // Set only for types worth glancing at without leaving the page and safe to
  // render from the storage origin: images and PDF. Empty means "download it
  // to look at it", which is the honest answer for everything else.
  string preview_url = 7;
}

message ListInboundRequest {
  // Only page_size is read. Pages are reached by cursor, not by number.
  erp.common.v1.PageRequest page = 1;
  string keyword = 2;
  // Which slice of the mailbox: empty/INBOX (not archived, not trashed),
  // STARRED, ARCHIVE, or TRASH.
  string view = 3;
  // Where the previous page ended; empty for the first page. Opaque: it
  // encodes a sort position, so a list that grows at the top cannot shift
  // the boundary underneath somebody who is reading.
  string cursor = 4;
}

// One message found by a search. It carries the folder because the search
// crossed folders — a result that does not say where it was found leaves the
// person to open it to find out.
message SearchHit {
  InboundMail mail = 1;
  string folder = 2;
  // The text around the hit, not the opening of the mail. They differ exactly
  // when the search was worth doing: a match in the fourth paragraph does not
  // appear in a snippet of the first.
  string match_snippet = 3;
}

message SearchMailRequest {
  string keyword = 1;
  string cursor = 2;
  erp.common.v1.PageRequest page = 3;
}

message SearchMailResponse {
  repeated SearchHit hits = 1;
  erp.common.v1.PageMeta meta = 2;
  string next_cursor = 3;
}

message ListInboundResponse {
  repeated InboundMail mails = 1;
  // Carries the total only; page numbers are meaningless under keyset paging.
  erp.common.v1.PageMeta meta = 2;
  int32 unread_count = 3;
  // Feed back as cursor to get the next page. Empty means this was the last.
  string next_cursor = 4;
}

message GetInboundRequest {
  int64 id = 1;
}

message GetMailThreadRequest {
  string thread_key = 1;
}

// ThreadItem is one turn of a conversation, either direction.
message ThreadItem {
  // OUT = we sent it, IN = it arrived.
  string direction = 1;
  int64 id = 2;
  string subject = 3;
  string body = 4;
  string body_format = 5;
  string counterparty = 6;
  string who = 7;
  string at = 8;
  // The history quoted inside this turn. Folded away by default here above
  // all: the thread view is already showing those turns separately, so
  // repeating them inside each one is the same text sixteen times over.
  string quoted = 9;
}

message GetMailThreadResponse {
  repeated ThreadItem items = 1;
}

message ExportMailThreadRequest {
  string thread_key = 1;
  // The reader's IANA zone, e.g. "Asia/Shanghai". Every timestamp in the
  // document is printed in it, with the offset spelled out beside it. Empty
  // means UTC.
  string zone = 2;
  // The language the document's own labels are written in: zh, en or es.
  // Not the language of the mail, which is whatever the customer wrote.
  string lang = 3;
  // Where the request came from, as the gateway resolved it. Recorded in the
  // export log; never used to decide anything.
  string client_ip = 4;
}

message ExportMailThreadResponse {
  // The whole document. Bounded by the caps in threadexport.go rather than
  // streamed: a conversation is not a file upload, and the ceiling is a few
  // megabytes of text.
  bytes content = 1;
  string content_type = 2;
  // What to call it on disk. Already stripped of anything a file name or a
  // Content-Disposition header may not contain.
  string file_name = 3;
  int32 turn_count = 4;
}

// ExportRecord is one line of the log: a conversation that left the building.
message ExportRecord {
  int64 id = 1;
  int64 employee_id = 2;
  string employee_name = 3;
  string thread_key = 4;
  string subject = 5;
  string counterparty = 6;
  int32 turn_count = 7;
  int64 byte_size = 8;
  string format = 9;
  string client_ip = 10;
  string exported_at = 11;
}

message ListMailExportsRequest {
  int32 page = 1;
  int32 size = 2;
}

message ListMailExportsResponse {
  repeated ExportRecord items = 1;
  int64 total = 2;
}

message GetInboundResponse {
  InboundMail mail = 1;
}

// Absent fields leave that flag alone; only what the caller sets changes.
message MarkInboundRequest {
  int64 id = 1;
  optional bool read = 2;
  optional bool starred = 3;
  optional bool archived = 4;
  optional bool deleted = 5;
  // Rescue from the junk view: the mail shows in the inbox from now on.
  optional bool not_junk = 6;
  // Apply to every message of the conversation. The list shows one row per
  // conversation, so archiving from a page that displays the whole exchange
  // has to move the whole exchange.
  bool whole_thread = 7;
}

message MarkInboundResponse {
  bool ok = 1;
}

message MarkViewReadRequest {
  // Same vocabulary as ListInbound: empty/INBOX, STARRED, ARCHIVE, TRASH, JUNK.
  string view = 1;
}

message MarkViewReadResponse {
  int32 marked = 1;
}

message EmptyTrashRequest {}

message EmptyTrashResponse {
  int32 deleted = 1;
}

message EmptyJunkRequest {}

message EmptyJunkResponse {
  // How many went to the trash.
  int32 deleted = 1;
}

message PurgeInboundRequest {
  int64 id = 1;
  // Delete every trashed message of the conversation — what the trash list
  // shows as one row. A live message of the same thread is never touched.
  bool whole_thread = 2;
}

message PurgeInboundResponse {
  bool ok = 1;
}

message ListMailboxSentRequest {
  // Only page_size is read. Pages are reached by cursor, like every other
  // mailbox list — a page number means nothing on a list that grows at the top.
  erp.common.v1.PageRequest page = 1;
  string keyword = 2;
  string cursor = 3;
}

message ListMailboxSentResponse {
  repeated InboundMail mails = 1;
  erp.common.v1.PageMeta meta = 2;
  string next_cursor = 3;
}

message SyncMailboxRequest {}

message SyncMailboxResponse {
  int32 fetched = 1;
  string detail = 2;
}

message RecordOpenRequest {
  string message_key = 1;
  string user_agent = 2;
  string ip = 3;
}

message RecordOpenResponse {
  bool ok = 1;
}

message VerifyMailAccessRequest {
  // The authorisation code, typed now — never read from storage. Verifying
  // the stored one would prove the system knows it, not that the person does.
  string secret = 1;
  // The address typed on the sign-in form. When set, this is a password
  // sign-in that is also the binding: the pair is verified by a live login
  // FIRST, and only success is allowed to touch storage — a mistyped code
  // must never overwrite a working credential or destroy a Google binding.
  // Empty means "verify what is already bound" (the Google path).
  string email = 2;
}

message VerifyMailAccessResponse {
  bool ok = 1;
  string detail = 2;
  // Whether the mail host is the one that said no.
  //
  // Every failure arrives here as ok=false, but they are not the same kind of
  // thing: a wrong authorisation code cost us one bad login against Gmail or
  // 263, while "收件服务器未配置" or a decryption failure never left this
  // process. Only the first should spend the caller's attempt budget, whose
  // whole purpose is protecting our address's standing with the host.
  bool host_rejected = 3;
}

message CompleteGoogleOAuthRequest {
  string code = 1;
  // Must byte-match the redirect_uri the auth URL carried, or Google
  // refuses the exchange.
  string redirect_uri = 2;
  // The address this person signed in to the ERP with. The grant is refused
  // unless Google says it belongs to this same address.
  //
  // The password door already takes the address from the session rather than
  // from the caller. Without this the Google door was the way around that:
  // authorise any Google account at Google's own page and it would be bound,
  // whoever you signed in as.
  string expect_email = 3;
}

message CompleteGoogleOAuthResponse {
  // The address Google says this grant belongs to.
  string email = 1;
}

// MailHost carries no credentials, which is why it can be read back freely.
message MailHost {
  string domain = 1;
  string smtp_host = 2;
  int32 smtp_port = 3;
  // SSL, STARTTLS or NONE.
  string smtp_security = 4;
  string imap_host = 5;
  int32 imap_port = 6;
  string imap_security = 7;
  int32 hourly_quota = 8;
  int32 daily_quota = 9;
}

message GetMailHostRequest {}

message GetMailHostResponse {
  MailHost host = 1;
}

message SaveMailHostRequest {
  MailHost host = 1;
}

message SaveMailHostResponse {
  bool ok = 1;
}

// MailAccount never carries the secret in either direction on a read. The
// settings page shows whether one is stored, not what it is.
message MailAccount {
  string email = 1;
  string username = 2;
  bool has_secret = 3;
  string verified_at = 4;
  string last_error = 5;
  bool is_active = 6;
  // PASSWORD or OAUTH — decides which unlock the gate offers.
  string auth_kind = 7;
}

message GetMyMailAccountRequest {}

message GetMyMailAccountResponse {
  MailAccount account = 1;
}

// Campaign is one bulk send, summarised. The counts are derived from the
// messages rather than stored: a denormalised total is one crash away from
// disagreeing with the rows it claims to count.
message Campaign {
  int64 id = 1;
  string campaign_no = 2;
  string subject = 3;
  // MARKETING or TRANSACTIONAL.
  string kind = 4;
  int64 sender_id = 5;
  string sender_name = 6;
  string status = 7;
  string created_at = 8;
  string finished_at = 9;
  int32 total_count = 10;
  int32 sent_count = 11;
  int32 delivered_count = 12;
  int32 failed_count = 13;
  int32 pending_count = 14;
  // The first recipients by name, comma separated, so a sent list can read
  // "to Hans Weber, Mike Chen and 3 others" the way a mailbox does.
  string to_names = 15;
}

// CampaignDetail carries the templates as composed, before substitution.
message CampaignDetail {
  int64 id = 1;
  string campaign_no = 2;
  string subject_tpl = 3;
  string body_tpl = 4;
  // TEXT or HTML.
  string body_format = 13;
  string body_text_tpl = 14;
  repeated EmailAttachment attachments = 15;
  int64 signature_id = 5;
  string kind = 6;
  int64 sender_id = 7;
  string sender_name = 8;
  string sender_email = 9;
  string status = 10;
  string created_at = 11;
  string finished_at = 12;
}

// EmailMessage is one recipient's copy.
message EmailMessage {
  int64 id = 1;
  int64 campaign_id = 2;
  string kind = 3;
  int64 sender_id = 4;
  string sender_name = 5;
  string to_email = 6;
  string to_name = 7;
  string customer_name = 8;
  string subject = 9;
  // QUEUED / SENDING / ACCEPTED / DELIVERED / SEND_UNKNOWN / SOFT_BOUNCED /
  // HARD_BOUNCED / COMPLAINED / FAILED / NEEDS_ATTENTION
  string status = 10;
  int32 attempt_count = 11;
  string last_error = 12;
  // Why a person has to look at this one, in words they can act on.
  string attention_reason = 13;
  string queued_at = 14;
  string sent_at = 15;
  string delivered_at = 16;
  string opened_at = 17;
}

// MessageDetail is one copy with its delivery history.
message MessageDetail {
  int64 id = 1;
  int64 campaign_id = 2;
  // Travels with the send as a tag so it can be looked up at the provider
  // afterwards. Not an idempotency key: mail providers do not offer those.
  string message_key = 3;
  string kind = 4;
  int64 sender_id = 5;
  string sender_name = 6;
  string to_email = 7;
  string to_name = 8;
  string customer_name = 9;
  int64 contact_id = 10;
  string subject = 11;
  string body = 12;
  string body_format = 24;
  // The plain-text alternative that went out alongside the HTML. Worth
  // showing: it is what a recipient with images off actually read.
  string body_text = 25;
  repeated EmailAttachment attachments = 26;
  string status = 13;
  int32 attempt_count = 14;
  string provider_id = 15;
  string last_error = 16;
  string attention_reason = 17;
  string queued_at = 18;
  string sent_at = 19;
  string delivered_at = 20;
  string opened_at = 21;
  string clicked_at = 22;
  repeated DeliveryEvent events = 23;
  // Whether this particular mail actually carried a tracking pixel.
  //
  // Without it, an empty opened_at has two very different meanings that look
  // identical: "we watched and saw nothing" and "we never looked". The pixel
  // is only injected into HTML bodies and only when the service has a
  // publicly reachable address configured, so plenty of real sends carry
  // none, and reporting those as "not opened" would be a claim we cannot
  // make. Read from the stored body, so it is the truth about this message
  // rather than about today's configuration.
  bool tracking_enabled = 27;
  // The mailbox it left from. A reading page that names the recipient but not
  // the sender is a mail with half a header.
  string sender_email = 28;
}

// DeliveryEvent is one thing that happened to a message, appended and never
// updated. An open recorded by a privacy proxy is still recorded, flagged
// rather than discarded, because "we cannot tell" is itself information.
message DeliveryEvent {
  int64 id = 1;
  // SENT / DELIVERED / OPEN / CLICK / BOUNCE / COMPLAINT
  string kind = 2;
  string occurred_at = 3;
  string ip = 4;
  string user_agent = 5;
  bool is_proxy = 6;
  string target_url = 7;
  string detail = 8;
}

// EmailAttachment is one file sent with a message.
message EmailAttachment {
  int64 id = 1;
  string file_name = 2;
  int64 file_size = 3;
  string content_type = 4;
  string uploaded_at = 5;
  string download_url = 6;
  string preview_url = 7;
}

// EmailImage is a picture embedded in an HTML body or signature. Served by a
// public, token-addressed route because the recipient's mail client fetches
// it with no session, possibly weeks after the mail was sent.
message EmailImage {
  int64 id = 1;
  string token = 2;
  string file_name = 3;
  int64 file_size = 4;
  string content_type = 5;
  string uploaded_at = 6;
}

// PendingAttachment is a file uploaded through a presigned URL, named by the
// key that upload returned. The size is not here on purpose: it is read back
// out of storage, because a client-declared size is a claim.
message PendingAttachment {
  string file_name = 1;
  string file_key = 2;
}

// Recipient is one addressee with the values its variables resolve against.
message Recipient {
  int64 contact_id = 1;
  string name = 2;
  string email = 3;
  int64 customer_id = 4;
  string customer_name = 5;
  // Anything else the caller wants addressable, e.g. contract_no.
  map<string, string> extra = 6;
}

// SkippedRecipient is one address that did not enter the queue, and why. A
// caller who asked for 500 and got 487 needs telling rather than leaving to
// wonder.
message SkippedRecipient {
  string email = 1;
  string name = 2;
  string reason = 3;
}

// Signature is a reusable closing block. Its own variables resolve in the
// same pass as the body's.
message Signature {
  int64 id = 1;
  // TEXT or HTML. HTML is what allows a logo in the sign-off.
  string body_format = 7;
  // TENANT (shared) or EMPLOYEE (personal).
  string owner_type = 2;
  int64 owner_id = 3;
  string name = 4;
  string content = 5;
  bool is_default = 6;
}

// Suppression is an address that must never be written to again.
message Suppression {
  int64 id = 1;
  string email = 2;
  // HARD_BOUNCE / COMPLAINT / UNSUBSCRIBE / MANUAL
  string reason = 3;
  string detail = 4;
  string created_at = 5;
}

message ListCampaignsRequest {
  erp.common.v1.PageRequest page = 1;
  string keyword = 2;
  // Narrow to one colleague. Never widens: the data scope is applied first,
  // so an id outside it simply matches nothing.
  int64 sender_id = 3;
}

message ListCampaignsResponse {
  repeated Campaign campaigns = 1;
  erp.common.v1.PageMeta meta = 2;
}

message GetCampaignRequest {
  int64 id = 1;
}

message GetCampaignResponse {
  CampaignDetail campaign = 1;
}

message PreviewCampaignRequest {
  string subject = 1;
  string body = 2;
  int64 signature_id = 3;
  Recipient recipient = 4;
  string body_format = 5;
}

message PreviewCampaignResponse {
  string subject = 1;
  string body = 2;
  string body_format = 4;
  // Shown beside the HTML so somebody actually looks at the version a
  // recipient with images disabled will read.
  string body_text = 5;
  // Variables that could not be resolved for this recipient. A non-empty
  // list is a refusal to send, not a warning.
  repeated string missing_variables = 3;
}

message CreateCampaignRequest {
  string subject = 1;
  string body = 2;
  int64 signature_id = 3;
  string body_format = 6;
  // Files already pushed to storage but not yet recorded. They are registered
  // inside the same transaction that creates the send, so a message can never
  // go out before its attachment row exists - and no draft campaign has to be
  // invented just to have something to hang them on.
  repeated PendingAttachment attachments = 7;
  // MARKETING or TRANSACTIONAL - decides what happens to a send whose
  // outcome cannot be determined.
  string kind = 4;
  repeated Recipient recipients = 5;
  // SEPARATE (default): one personalised copy per recipient, invisible to
  // each other. MERGED: one shared mail - everybody on the To and CC lists
  // sees everybody else, and the whole cast goes out in one transaction.
  string send_mode = 8;
  // Carbon copies. Meaningful only for MERGED sends.
  repeated Recipient cc = 9;
  // Blind copies. Same mode restriction; these reach the envelope and never
  // a header, so nobody on To or Cc learns they were included.
  repeated Recipient bcc = 13;
  // Set when this send answers a mail in the caller's inbox: threading
  // headers and the thread key are taken from that message.
  int64 reply_to_inbound_id = 10;
  // Set when forwarding a mail from the caller's inbox: the original's
  // attachments travel along.
  int64 forward_inbound_id = 11;
  // Forward the original as a .eml attachment instead of quoting it inline.
  // The recipient gets the message itself — every header, every part, exactly
  // as it arrived — which is what makes a forward usable as evidence rather
  // than as a retelling. Requires forward_inbound_id.
  bool forward_as_attachment = 14;
  // RFC 3339, absolute. Empty means send now. An instant rather than a local
  // time and a zone: the composer resolves "9am in the customer's morning"
  // once, where the customer's zone is known, and what reaches the queue is
  // the moment itself - which no daylight-saving change can move.
  string scheduled_at = 12;
}

message CreateCampaignResponse {
  int64 campaign_id = 1;
  string campaign_no = 2;
  int32 queued = 3;
  repeated SkippedRecipient suppressed = 4;
  repeated SkippedRecipient needs_review = 5;
}

message ListMessagesRequest {
  erp.common.v1.PageRequest page = 1;
  int64 campaign_id = 2;
  string status = 3;
  // The single filter the failure queue needs.
  bool attention_only = 4;
  string keyword = 5;
  int64 sender_id = 6;  // Where the previous page ended. Keyset, like every other mailbox list.
  string cursor = 7;

}

message ListMessagesResponse {
  repeated EmailMessage messages = 1;
  erp.common.v1.PageMeta meta = 2;  string next_cursor = 3;

}

message GetMessageRequest {
  int64 id = 1;
}

message GetMessageResponse {
  MessageDetail message = 1;
}

message RequeueMessageRequest {
  int64 id = 1;
  // Optional correction. Supplying one also lifts the new address from the
  // suppression list, since leaving the fix blocked would look broken.
  string new_email = 2;
}

message RequeueMessageResponse {
  bool ok = 1;
}

message AbandonMessageRequest {
  int64 id = 1;
  string reason = 2;
}

message AbandonMessageResponse {
  bool ok = 1;
}

message ListSignaturesRequest {}

message ListSignaturesResponse {
  repeated Signature signatures = 1;
}

message CreateSignatureRequest {
  string owner_type = 1;
  string name = 2;
  string content = 3;
  bool is_default = 4;
  string body_format = 5;
}

message CreateSignatureResponse {
  int64 id = 1;
}

// UpdateSignatureRequest carries the whole block, not a patch: the editor
// always holds the complete value, and a partial update would need a way to
// say "clear this field" that JSON omission cannot express.
message UpdateSignatureRequest {
  int64 id = 1;
  string owner_type = 2;
  string name = 3;
  string content = 4;
  bool is_default = 5;
  string body_format = 6;
}

message UpdateSignatureResponse {
  bool ok = 1;
}

message DeleteSignatureRequest {
  int64 id = 1;
}

message DeleteSignatureResponse {
  bool ok = 1;
}

message ListSuppressionsRequest {
  string keyword = 1;
}

message ListSuppressionsResponse {
  repeated Suppression suppressions = 1;
}

message AddSuppressionRequest {
  string email = 1;
  string reason = 2;
  string detail = 3;
}

message AddSuppressionResponse {
  bool ok = 1;
}

message RemoveSuppressionRequest {
  string email = 1;
}

message RemoveSuppressionResponse {
  bool ok = 1;
}

message ListAttachmentsRequest {
  int64 campaign_id = 1;
}

message ListAttachmentsResponse {
  repeated EmailAttachment attachments = 1;
  int64 total_bytes = 2;
}

message ListImagesRequest {}

message ListImagesResponse {
  repeated EmailImage images = 1;
}

message WithdrawImageRequest {
  int64 id = 1;
}

message WithdrawImageResponse {
  bool ok = 1;
}

message PresignAttachmentRequest {
  string file_name = 1;
}

message PresignAttachmentResponse {
  // The key the client must hand back to Register after uploading.
  string file_key = 1;
  string upload_url = 2;
  int32 expires_in_seconds = 3;
}

message RegisterAttachmentRequest {
  int64 campaign_id = 1;
  string file_name = 2;
  string file_key = 3;
