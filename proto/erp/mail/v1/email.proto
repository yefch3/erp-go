  // 「不要钱」。
  int64 input_tokens = 5;
  int64 output_tokens = 6;
  string estimated_cost = 7;
  string currency = 8;
}

message ListExcelQuotasResponse {
  repeated TenantExcelQuota quotas = 1;
  string current_month = 2;
