// ImportImageRequest takes a picture that already lives on somebody's web
// server. The bytes are copied into our own storage rather than linked: a
// signature outlives the website it borrowed its logo from.
message ImportImageRequest {
  string url = 1;
}

message ImportImageResponse {
  EmailImage image = 1;
}

