  string token = 1;
}

message FetchImageResponse {
  bytes content = 1;
  string content_type = 2;
}

// Sender is one colleague with correspondence, as the supervisor picker
// lists them.
message Sender {
  int64 employee_id = 1;
  string name = 2;
  int32 message_count = 3;
  int32 failed_count = 4;
  string last_sent_at = 5;
}

message ListSendersRequest {}

message ListSendersResponse {
  repeated Sender senders = 1;
}

// Draft is a compose window saved mid-thought. Everything is optional,
// including the subject: validation belongs at send time, and refusing to
// save an unfinished mail because it is unfinished defeats the point.
message Draft {
  int64 id = 1;
  string subject = 2;
  string body = 3;
  string body_format = 4;
  int64 signature_id = 5;
  string kind = 6;
  repeated Recipient recipients = 7;
  repeated PendingAttachment attachments = 8;
  string updated_at = 9;
  int32 recipient_count = 10;
  // How this compose goes out, who is copied, and what it answers. Saved
  // with the draft so reopening one restores the message rather than its
  // words alone.
  string send_mode = 11;
  repeated Recipient cc = 12;
  int64 reply_to_inbound_id = 13;
  int64 forward_inbound_id = 14;
  repeated Recipient bcc = 15;
  bool forward_as_attachment = 16;
}

message SaveDraftRequest {
  // 0 creates; anything else updates that draft, if the caller owns it.
  int64 id = 1;
  string subject = 2;
  string body = 3;
  string body_format = 4;
  int64 signature_id = 5;
  string kind = 6;
  repeated Recipient recipients = 7;
  repeated PendingAttachment attachments = 8;
  // How this compose goes out, who is copied, and what it answers. Saved
  // with the draft so reopening one restores the message rather than its
  // words alone.
  string send_mode = 9;
  repeated Recipient cc = 10;
  int64 reply_to_inbound_id = 11;
  int64 forward_inbound_id = 12;
  repeated Recipient bcc = 13;
  bool forward_as_attachment = 14;
}

message SaveDraftResponse {
  int64 id = 1;
}

message ListDraftsRequest {}

message ListDraftsResponse {
  repeated Draft drafts = 1;
}

message GetDraftRequest {
  int64 id = 1;
}

message GetDraftResponse {
  Draft draft = 1;
}

message DeleteDraftRequest {
  int64 id = 1;
}

message DeleteDraftResponse {
  bool ok = 1;
}

message SendDraftRequest {
  int64 id = 1;
  // RFC 3339. Empty means send now.
  string scheduled_at = 2;
}

message SendDraftResponse {
  CreateCampaignResponse result = 1;
}

// One send waiting for its moment. A campaign, not a message: a campaign is
// what somebody scheduled, so it is what they cancel.
message ScheduledSend {
  int64 campaign_id = 1;
  string campaign_no = 2;
  string subject = 3;
  // How many recipients are still waiting.
  int32 pending_count = 4;
  // The first few names, as the sent list shows them.
  string to_names = 5;
  string scheduled_at = 6;
  string send_mode = 7;
  string body_format = 8;
}

message ListScheduledRequest {
  erp.common.v1.PageRequest page = 1;  // Where the previous page ended. Keyset, like every other mailbox list.
  string cursor = 2;

}

message ListScheduledResponse {
  repeated ScheduledSend sends = 1;
  erp.common.v1.PageMeta meta = 2;  string next_cursor = 3;

}

message SendScheduledNowRequest {
  int64 campaign_id = 1;
}

message SendScheduledNowResponse {
  int32 released = 1;
}

message CancelScheduledRequest {
  int64 campaign_id = 1;
}

message CancelScheduledResponse {
  int32 cancelled = 1;
  // Where the mail went so the caller can offer to open it.
  int64 draft_id = 2;
}
