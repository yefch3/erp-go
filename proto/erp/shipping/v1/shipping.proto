syntax = "proto3";

package erp.shipping.v1;

import "erp/common/v1/pagination.proto";

option go_package = "github.com/sgao19/erp-go/gen/go/erp/shipping/v1;shippingv1";

// ShippingService owns schedule lifecycle, ordered port routes, progress,
// repeated delay events and ETA-versioned arrival reminders.
service ShippingService {
  rpc GetModuleStatus(GetModuleStatusRequest) returns (GetModuleStatusResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  rpc UpdateScheduleStatus(UpdateScheduleStatusRequest) returns (UpdateScheduleStatusResponse);
  rpc CancelSchedule(CancelScheduleRequest) returns (CancelScheduleResponse);
  rpc GetShippingStatistics(GetShippingStatisticsRequest) returns (GetShippingStatisticsResponse);
  rpc AddRouteNode(AddRouteNodeRequest) returns (AddRouteNodeResponse);
  rpc RemoveRouteNode(RemoveRouteNodeRequest) returns (RemoveRouteNodeResponse);
  rpc ReorderRoute(ReorderRouteRequest) returns (ReorderRouteResponse);
  rpc UpdateProgress(UpdateProgressRequest) returns (UpdateProgressResponse);
  rpc PresignDocumentUpload(PresignDocumentUploadRequest) returns (PresignDocumentUploadResponse);
  rpc RegisterDocument(RegisterDocumentRequest) returns (RegisterDocumentResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc GetDocumentAccess(GetDocumentAccessRequest) returns (GetDocumentAccessResponse);
  rpc InvalidateDocument(InvalidateDocumentRequest) returns (InvalidateDocumentResponse);
  rpc ListArrivalNotifications(ListArrivalNotificationsRequest) returns (ListArrivalNotificationsResponse);
  rpc MarkArrivalReminderRead(MarkArrivalReminderReadRequest) returns (MarkArrivalReminderReadResponse);
  rpc CleanupExpiredArrivalReminders(CleanupExpiredArrivalRemindersRequest) returns (CleanupExpiredArrivalRemindersResponse);
  rpc GetArrivalReminderRules(GetArrivalReminderRulesRequest) returns (GetArrivalReminderRulesResponse);
  rpc UpdateArrivalReminderRules(UpdateArrivalReminderRulesRequest) returns (UpdateArrivalReminderRulesResponse);
}

message GetModuleStatusRequest {}

message GetModuleStatusResponse {
  string module = 1;
  string status = 2;
  int32 schema_version = 3;
}

message Schedule {
  int64 id = 1;
  string schedule_no = 2;
  int64 contract_id = 3;
  string contract_no = 4;
  int64 customer_id = 5;
  string customer_name = 6;
  string carrier_forwarder = 7;
  string vessel_name = 8;
  string voyage_no = 9;
  string port_of_loading = 10;
  string port_of_discharge = 11;
  string etd = 12;
  string atd = 13;
  string eta = 14;
  string ata = 15;
  int64 responsible_employee_id = 16;
  string responsible_name = 17;
  string status = 18;
  string remark = 19;
  int64 created_by = 20;
  string created_by_name = 21;
  string created_at = 22;
  int64 updated_by = 23;
  string updated_by_name = 24;
  string updated_at = 25;
  string original_eta = 26;
  int32 eta_revision = 27;
  int32 route_version = 28;
  int32 delay_days = 29;
  bool has_temporary_call = 30;
  string current_progress = 31;
  // Masterdata supplier id used for the selected carrier/forwarder. The name
  // above is retained as a historical snapshot.
  int64 carrier_id = 32;
  int64 loading_port_id = 33;
  string loading_port_code = 34;
  string loading_port_timezone = 35;
  int64 discharge_port_id = 36;
  string discharge_port_code = 37;
  string discharge_port_timezone = 38;
}

message RouteNode {
  int64 id = 1;
  int32 sequence_no = 2;
  string node_type = 3;
  string port_code = 4;
  string port_name = 5;
  string timezone = 6;
  string original_eta_at = 7;
  string latest_eta_at = 8;
  string actual_arrival_at = 9;
  string original_etd_at = 10;
  string latest_etd_at = 11;
  string actual_departure_at = 12;
  string node_status = 13;
  string remark = 14;
  int64 port_id = 15;
}

message DelayEvent {
  int64 id = 1;
  string impact_type = 2;
  int64 affected_node_id = 3;
  int64 from_node_id = 4;
  int64 to_node_id = 5;
  string reason_code = 6;
  string reason = 7;
  string note = 8;
  string old_eta = 9;
  string new_eta = 10;
  int32 change_days = 11;
  int32 cumulative_delay_days = 12;
  string status = 13;
  int64 operator_id = 14;
  string operator_name = 15;
  string created_at = 16;
}

message ArrivalReminder {
  int64 id = 1;
  int32 eta_revision = 2;
  string target_eta = 3;
  string due_at = 4;
  string status = 5;
  string sent_at = 6;
  int64 schedule_id = 7;
  string title = 8;
  string content = 9;
  string detail_url = 10;
  string read_at = 11;
  int32 attempt_count = 12;
  string last_error = 13;
}

message ScheduleInput {
  int64 contract_id = 1;
  string contract_no = 2;
  int64 customer_id = 3;
  string customer_name = 4;
  string carrier_forwarder = 5;
  string vessel_name = 6;
  string voyage_no = 7;
  string port_of_loading = 8;
  string port_of_discharge = 9;
  string etd = 10;
  string atd = 11;
  string eta = 12;
  string ata = 13;
  int64 responsible_employee_id = 14;
  string responsible_name = 15;
  string remark = 16;
  int64 carrier_id = 17;
  int64 loading_port_id = 18;
  string loading_port_code = 19;
  string loading_port_timezone = 20;
  int64 discharge_port_id = 21;
  string discharge_port_code = 22;
  string discharge_port_timezone = 23;
}

message ScheduleChange {
  int64 id = 1;
  string change_type = 2;
  string field_name = 3;
  string old_value = 4;
  string new_value = 5;
  string reason = 6;
  int64 operator_id = 7;
  string operator_name = 8;
  string created_at = 9;
}

message ListSchedulesRequest {
  string keyword = 1;
  string status = 2;
  string port_of_loading = 3;
  string port_of_discharge = 4;
  string etd_from = 5;
  string etd_to = 6;
  string eta_from = 7;
  string eta_to = 8;
  erp.common.v1.PageRequest page = 9;
}
message ListSchedulesResponse { repeated Schedule schedules = 1; erp.common.v1.PageMeta meta = 2; }
message GetScheduleRequest { int64 id = 1; }
message GetScheduleResponse {
  Schedule schedule = 1;
  repeated ScheduleChange changes = 2;
  repeated RouteNode route_nodes = 3;
  repeated DelayEvent delay_events = 4;
  repeated ArrivalReminder reminders = 5;
}
message CreateScheduleRequest { ScheduleInput schedule = 1; bool confirm_duplicate = 2; }
message CreateScheduleResponse { Schedule schedule = 1; }
message UpdateScheduleRequest { int64 id = 1; ScheduleInput schedule = 2; string date_change_reason = 3; bool confirm_duplicate = 4; }
message UpdateScheduleResponse { Schedule schedule = 1; }
message UpdateScheduleStatusRequest { int64 id = 1; string status = 2; string reason = 3; }
message UpdateScheduleStatusResponse { Schedule schedule = 1; }
message CancelScheduleRequest { int64 id = 1; string reason = 2; }
message CancelScheduleResponse { Schedule schedule = 1; }

message GetShippingStatisticsRequest {}
message GetShippingStatisticsResponse {
  int64 in_transit = 1;
  int64 arriving_within_7_days = 2;
  int64 delayed = 3;
  int64 temporary_call = 4;
}

message AddRouteNodeRequest {
  int64 id = 1;
  string node_type = 2;
  string port_code = 3;
  string port_name = 4;
  string timezone = 5;
  int64 insert_after_node_id = 6;
  string latest_eta_at = 7;
  string latest_etd_at = 8;
  string reason = 9;
  string remark = 10;
  int32 route_version = 11;
  int64 port_id = 12;
}
message AddRouteNodeResponse { repeated RouteNode route_nodes = 1; int32 route_version = 2; }

message RemoveRouteNodeRequest {
  int64 id = 1;
  int64 route_node_id = 2;
  string reason = 3;
  int32 route_version = 4;
}
message RemoveRouteNodeResponse { repeated RouteNode route_nodes = 1; int32 route_version = 2; }

message ReorderRouteRequest {
  int64 id = 1;
  repeated int64 node_ids = 2;
  string reason = 3;
  int32 route_version = 4;
}
message ReorderRouteResponse { repeated RouteNode route_nodes = 1; int32 route_version = 2; }

message UpdateProgressRequest {
  int64 id = 1;
  int64 route_node_id = 2;
  string action = 3;
  string actual_time = 4;
  string latest_eta = 5;
  string reason_code = 6;
  string reason = 7;
  string impact_type = 8;
  int64 affected_node_id = 9;
  int64 from_node_id = 10;
  int64 to_node_id = 11;
  string note = 12;
  int32 route_version = 13;
  // UPDATE_TIMES uses these timestamp fields to revise a port's latest
  // estimates or correct previously recorded actual times. Empty values clear
  // the corresponding field; original ETA/ETD fields are never writable.
  string latest_eta_at = 14;
  string latest_etd_at = 15;
  string actual_arrival_at = 16;
  string actual_departure_at = 17;
}
message UpdateProgressResponse {
  Schedule schedule = 1;
  repeated RouteNode route_nodes = 2;
  repeated DelayEvent delay_events = 3;
}

message ShippingDocument {
  int64 id = 1;
  int64 schedule_id = 2;
  string document_group_key = 3;
  string category = 4;
  int32 version = 5;
  string file_name = 6;
  int64 file_size = 7;
  string content_type = 8;
  string remark = 9;
  string status = 10;
  int64 uploaded_by = 11;
  string uploaded_by_name = 12;
  string uploaded_at = 13;
  int64 voided_by = 14;
  string voided_by_name = 15;
  string voided_at = 16;
  string void_reason = 17;
}

message PresignDocumentUploadRequest {
  int64 schedule_id = 1;
  string file_name = 2;
}
message PresignDocumentUploadResponse {
  string file_key = 1;
  string upload_url = 2;
  int32 expires_in_seconds = 3;
}

message RegisterDocumentRequest {
  int64 schedule_id = 1;
  string file_key = 2;
  string file_name = 3;
  string category = 4;
  string remark = 5;
  int64 replaces_document_id = 6;
}
message RegisterDocumentResponse { ShippingDocument document = 1; }

message ListDocumentsRequest { int64 schedule_id = 1; }
message ListDocumentsResponse { repeated ShippingDocument documents = 1; }

message GetDocumentAccessRequest {
  int64 schedule_id = 1;
  int64 document_id = 2;
  string mode = 3;
}
message GetDocumentAccessResponse {
  string url = 1;
  int32 expires_in_seconds = 2;
}

message InvalidateDocumentRequest {
  int64 schedule_id = 1;
  int64 document_id = 2;
  string reason = 3;
}
message InvalidateDocumentResponse { ShippingDocument document = 1; }

message ListArrivalNotificationsRequest { bool unread_only = 1; }
message ListArrivalNotificationsResponse {
  repeated ArrivalReminder reminders = 1;
  int64 unread_count = 2;
}
message MarkArrivalReminderReadRequest { int64 reminder_id = 1; }
message MarkArrivalReminderReadResponse { ArrivalReminder reminder = 1; }
message CleanupExpiredArrivalRemindersRequest {}
message CleanupExpiredArrivalRemindersResponse { int64 deleted_count = 1; }

message GetArrivalReminderRulesRequest { int64 schedule_id = 1; }
message GetArrivalReminderRulesResponse { repeated int32 lead_days = 1; }
message UpdateArrivalReminderRulesRequest {
  int64 schedule_id = 1;
  repeated int32 lead_days = 2;
}
message UpdateArrivalReminderRulesResponse { repeated int32 lead_days = 1; }
