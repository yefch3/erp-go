syntax = "proto3";

package erp.shipping.v1;

import "erp/common/v1/pagination.proto";

option go_package = "github.com/sgao19/erp-go/gen/go/erp/shipping/v1;shippingv1";

// ShippingService owns schedule lifecycle, ordered port routes, progress,
// repeated delay events and ETA-versioned arrival reminders.
service ShippingService {
  rpc GetModuleStatus(GetModuleStatusRequest) returns (GetModuleStatusResponse);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse);
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse);
  rpc UpdateSchedule(UpdateScheduleRequest) returns (UpdateScheduleResponse);
  rpc UpdateScheduleStatus(UpdateScheduleStatusRequest) returns (UpdateScheduleStatusResponse);
  rpc CancelSchedule(CancelScheduleRequest) returns (CancelScheduleResponse);
  rpc GetShippingStatistics(GetShippingStatisticsRequest) returns (GetShippingStatisticsResponse);
  rpc AddRouteNode(AddRouteNodeRequest) returns (AddRouteNodeResponse);
  rpc RemoveRouteNode(RemoveRouteNodeRequest) returns (RemoveRouteNodeResponse);
  rpc ReorderRoute(ReorderRouteRequest) returns (ReorderRouteResponse);
  rpc UpdateProgress(UpdateProgressRequest) returns (UpdateProgressResponse);
  rpc PresignDocumentUpload(PresignDocumentUploadRequest) returns (PresignDocumentUploadResponse);
  rpc RegisterDocument(RegisterDocumentRequest) returns (RegisterDocumentResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc GetDocumentAccess(GetDocumentAccessRequest) returns (GetDocumentAccessResponse);
  rpc InvalidateDocument(InvalidateDocumentRequest) returns (InvalidateDocumentResponse);
  rpc ListArrivalNotifications(ListArrivalNotificationsRequest) returns (ListArrivalNotificationsResponse);
  rpc MarkArrivalReminderRead(MarkArrivalReminderReadRequest) returns (MarkArrivalReminderReadResponse);
  // 提单签发提醒（E2）：船开了、正本还没上传，催船务这批人。
  rpc ListBlReminders(ListBlRemindersRequest) returns (ListBlRemindersResponse);
  rpc MarkBlRemindersRead(MarkBlRemindersReadRequest) returns (MarkBlRemindersReadResponse);
  rpc CleanupExpiredArrivalReminders(CleanupExpiredArrivalRemindersRequest) returns (CleanupExpiredArrivalRemindersResponse);
  rpc GetArrivalReminderRules(GetArrivalReminderRulesRequest) returns (GetArrivalReminderRulesResponse);
  rpc UpdateArrivalReminderRules(UpdateArrivalReminderRulesRequest) returns (UpdateArrivalReminderRulesResponse);
  // 一页合同各自最新一班船的状态，一次问完（D2 合同执行一览表）。
  rpc ContractShippingSnapshot(ContractShippingSnapshotRequest) returns (ContractShippingSnapshotResponse);
  rpc ListContractShippingHandoffs(ListContractShippingHandoffsRequest) returns (ListContractShippingHandoffsResponse);
  rpc GetContractShippingHandoff(GetContractShippingHandoffRequest) returns (GetContractShippingHandoffResponse);
  rpc ListContractShippingRequoteOptions(ListContractShippingRequoteOptionsRequest) returns (ListContractShippingRequoteOptionsResponse);
  rpc SaveContractShippingRequoteDraft(SaveContractShippingRequoteDraftRequest) returns (SaveContractShippingRequoteDraftResponse);
  rpc DeleteContractShippingRequoteOption(DeleteContractShippingRequoteOptionRequest) returns (DeleteContractShippingRequoteOptionResponse);
  rpc SelectContractShippingRequoteDraft(SelectContractShippingRequoteDraftRequest) returns (SelectContractShippingRequoteDraftResponse);
  rpc SubmitContractShippingRequote(SubmitContractShippingRequoteRequest) returns (SubmitContractShippingRequoteResponse);
  rpc SaveContractShippingContract(SaveContractShippingContractRequest) returns (SaveContractShippingContractResponse);
  rpc PresignContractShippingContractUpload(PresignContractShippingContractUploadRequest) returns (PresignContractShippingContractUploadResponse);
  rpc VerifyContractShippingContract(VerifyContractShippingContractRequest) returns (VerifyContractShippingContractResponse);
  rpc MarkContractShippingPaymentRequested(MarkContractShippingPaymentRequestedRequest) returns (MarkContractShippingPaymentRequestedResponse);
}

message GetModuleStatusRequest {}

message GetModuleStatusResponse {
  string module = 1;
  string status = 2;
  int32 schema_version = 3;
}

message Schedule {
  int64 id = 1;
  string schedule_no = 2;
  int64 contract_id = 3;
  string contract_no = 4;
  int64 customer_id = 5;
  string customer_name = 6;
  string carrier_forwarder = 7;
  string vessel_name = 8;
  string voyage_no = 9;
  string port_of_loading = 10;
  string port_of_discharge = 11;
  string etd = 12;
  string atd = 13;
  string eta = 14;
  string ata = 15;
  int64 responsible_employee_id = 16;
  string responsible_name = 17;
  string status = 18;
  string remark = 19;
  int64 created_by = 20;
  string created_by_name = 21;
  string created_at = 22;
  int64 updated_by = 23;
  string updated_by_name = 24;
  string updated_at = 25;
  string original_eta = 26;
  int32 eta_revision = 27;
  int32 route_version = 28;
  int32 delay_days = 29;
  bool has_temporary_call = 30;
  string current_progress = 31;
  // Masterdata supplier id used for the selected carrier/forwarder. The name
  // above is retained as a historical snapshot.
  int64 carrier_id = 32;
  int64 loading_port_id = 33;
  string loading_port_code = 34;
  string loading_port_timezone = 35;
  int64 discharge_port_id = 36;
  string discharge_port_code = 37;
  string discharge_port_timezone = 38;
}

message RouteNode {
  int64 id = 1;
  int32 sequence_no = 2;
  string node_type = 3;
  string port_code = 4;
  string port_name = 5;
  string timezone = 6;
  string original_eta_at = 7;
  string latest_eta_at = 8;
  string actual_arrival_at = 9;
  string original_etd_at = 10;
  string latest_etd_at = 11;
  string actual_departure_at = 12;
  string node_status = 13;
  string remark = 14;
  int64 port_id = 15;
}

message DelayEvent {
  int64 id = 1;
  string impact_type = 2;
  int64 affected_node_id = 3;
  int64 from_node_id = 4;
  int64 to_node_id = 5;
  string reason_code = 6;
  string reason = 7;
  string note = 8;
  string old_eta = 9;
  string new_eta = 10;
  int32 change_days = 11;
  int32 cumulative_delay_days = 12;
  string status = 13;
  int64 operator_id = 14;
  string operator_name = 15;
  string created_at = 16;
}

message ArrivalReminder {
  int64 id = 1;
  int32 eta_revision = 2;
  string target_eta = 3;
  string due_at = 4;
  string status = 5;
  string sent_at = 6;
  int64 schedule_id = 7;
  string title = 8;
  string content = 9;
  string detail_url = 10;
  string read_at = 11;
  int32 attempt_count = 12;
  string last_error = 13;
}

message ScheduleInput {
  int64 contract_id = 1;
  string contract_no = 2;
  int64 customer_id = 3;
  string customer_name = 4;
  string carrier_forwarder = 5;
  string vessel_name = 6;
  string voyage_no = 7;
  string port_of_loading = 8;
  string port_of_discharge = 9;
  string etd = 10;
  string atd = 11;
  string eta = 12;
  string ata = 13;
  int64 responsible_employee_id = 14;
  string responsible_name = 15;
  string remark = 16;
  int64 carrier_id = 17;
  int64 loading_port_id = 18;
  string loading_port_code = 19;
  string loading_port_timezone = 20;
  int64 discharge_port_id = 21;
  string discharge_port_code = 22;
  string discharge_port_timezone = 23;
  int64 contract_handoff_id = 24;
}

message ContractShippingHandoff {
  int64 id = 1;
  int64 contract_id = 2;
  string contract_no = 3;
  int64 contract_version_id = 4;
  int32 version_no = 5;
  int64 customer_id = 6;
  string customer_name = 7;
  int32 batch_no = 8;
  string shipment_group_key = 9;
  string carrier_forwarder = 10;
  string service_option_name = 11;
  bool customer_managed = 12;
  string currency = 13;
  string freight_amount = 14;
  string charge_basis = 15;
  string port_of_loading = 16;
  string port_of_discharge = 17;
  string estimated_departure = 18;
  string estimated_arrival = 19;
  string valid_until = 20;
  string remark = 21;
  string status = 22;
  int64 schedule_id = 23;
  string created_at = 24;
  int64 final_forwarder_id = 25;
  string final_forwarder_name = 26;
  int64 actual_carrier_id = 27;
  string actual_carrier_name = 28;
  string final_service_option = 29;
  string final_currency = 30;
  string final_freight_amount = 31;
  string final_etd = 32;
  string final_eta = 33;
  string payment_terms = 34;
  string forwarder_contract_no = 35;
  int64 approval_instance_id = 36;
  string return_reason = 37;
  string operator_name = 38;
  string signed_contract_name = 39;
  string signed_contract_url = 40;
  string signed_contract_uploaded_at = 41;
  string contract_verified_at = 42;
  string contract_verified_by_name = 43;
  string payment_requested_at = 44;
  string updated_at = 45;
  string signed_contract_key = 46;
  repeated ContractShippingCargoItem cargo_items = 47;
}
message ContractShippingCargoItem {
  int64 id = 1; int64 contract_item_id = 2; int32 line_no = 3;
  string product_code = 4; string product_name = 5; string specification = 6;
  string quantity = 7; string uom_code = 8; string remark = 9;
}
message ListContractShippingHandoffsRequest { string status = 1; }
message ListContractShippingHandoffsResponse { repeated ContractShippingHandoff handoffs = 1; }
message ScheduleChange {
  int64 id = 1;
  string change_type = 2;
  string field_name = 3;
  string old_value = 4;
  string new_value = 5;
  string reason = 6;
  int64 operator_id = 7;
  string operator_name = 8;
  string created_at = 9;
}

message ListSchedulesRequest {
  string keyword = 1;
  string status = 2;
  string port_of_loading = 3;
  string port_of_discharge = 4;
  string etd_from = 5;
  string etd_to = 6;
  string eta_from = 7;
  string eta_to = 8;
  erp.common.v1.PageRequest page = 9;
}
message ListSchedulesResponse { repeated Schedule schedules = 1; erp.common.v1.PageMeta meta = 2; }
message GetScheduleRequest { int64 id = 1; }
message GetScheduleResponse {
  Schedule schedule = 1;
  repeated ScheduleChange changes = 2;
  repeated RouteNode route_nodes = 3;
  repeated DelayEvent delay_events = 4;
  repeated ArrivalReminder reminders = 5;
}
message CreateScheduleRequest { ScheduleInput schedule = 1; bool confirm_duplicate = 2; }
message CreateScheduleResponse { Schedule schedule = 1; }
message UpdateScheduleRequest { int64 id = 1; ScheduleInput schedule = 2; string date_change_reason = 3; bool confirm_duplicate = 4; }
message UpdateScheduleResponse { Schedule schedule = 1; }
message UpdateScheduleStatusRequest { int64 id = 1; string status = 2; string reason = 3; }
message UpdateScheduleStatusResponse { Schedule schedule = 1; }
message CancelScheduleRequest { int64 id = 1; string reason = 2; }
message CancelScheduleResponse { Schedule schedule = 1; }

message GetShippingStatisticsRequest {}
message GetShippingStatisticsResponse {
  int64 in_transit = 1;
  int64 arriving_within_7_days = 2;
  int64 delayed = 3;
  int64 temporary_call = 4;
}

message AddRouteNodeRequest {
  int64 id = 1;
  string node_type = 2;
  string port_code = 3;
  string port_name = 4;
  string timezone = 5;
  int64 insert_after_node_id = 6;
  string latest_eta_at = 7;
  string latest_etd_at = 8;
  string reason = 9;
  string remark = 10;
  int32 route_version = 11;
  int64 port_id = 12;
}
message AddRouteNodeResponse { repeated RouteNode route_nodes = 1; int32 route_version = 2; }

message RemoveRouteNodeRequest {
  int64 id = 1;
  int64 route_node_id = 2;
  string reason = 3;
  int32 route_version = 4;
}
message RemoveRouteNodeResponse { repeated RouteNode route_nodes = 1; int32 route_version = 2; }

message ReorderRouteRequest {
  int64 id = 1;
  repeated int64 node_ids = 2;
  string reason = 3;
  int32 route_version = 4;
}
message ReorderRouteResponse { repeated RouteNode route_nodes = 1; int32 route_version = 2; }

message UpdateProgressRequest {
  int64 id = 1;
  int64 route_node_id = 2;
  string action = 3;
  string actual_time = 4;
  string latest_eta = 5;
  string reason_code = 6;
  string reason = 7;
  string impact_type = 8;
  int64 affected_node_id = 9;
  int64 from_node_id = 10;
  int64 to_node_id = 11;
  string note = 12;
  int32 route_version = 13;
  // UPDATE_TIMES uses these timestamp fields to revise a port's latest
  // estimates or correct previously recorded actual times. Empty values clear
  // the corresponding field; original ETA/ETD fields are never writable.
  string latest_eta_at = 14;
  string latest_etd_at = 15;
  string actual_arrival_at = 16;
  string actual_departure_at = 17;
}
message UpdateProgressResponse {
  Schedule schedule = 1;
  repeated RouteNode route_nodes = 2;
  repeated DelayEvent delay_events = 3;
}

message ShippingDocument {
  int64 id = 1;
  int64 schedule_id = 2;
  string document_group_key = 3;
  string category = 4;
  int32 version = 5;
  string file_name = 6;
  int64 file_size = 7;
  string content_type = 8;
  string remark = 9;
  string status = 10;
  int64 uploaded_by = 11;
  string uploaded_by_name = 12;
  string uploaded_at = 13;
  int64 voided_by = 14;
  string voided_by_name = 15;
  string voided_at = 16;
  string void_reason = 17;
}

message PresignDocumentUploadRequest {
  int64 schedule_id = 1;
  string file_name = 2;
}
message PresignDocumentUploadResponse {
  string file_key = 1;
  string upload_url = 2;
  int32 expires_in_seconds = 3;
}

message RegisterDocumentRequest {
  int64 schedule_id = 1;
  string file_key = 2;
  string file_name = 3;
  string category = 4;
  string remark = 5;
  int64 replaces_document_id = 6;
}
message RegisterDocumentResponse { ShippingDocument document = 1; }

message ListDocumentsRequest { int64 schedule_id = 1; }
message ListDocumentsResponse { repeated ShippingDocument documents = 1; }

message GetDocumentAccessRequest {
  int64 schedule_id = 1;
  int64 document_id = 2;
  string mode = 3;
}
message GetDocumentAccessResponse {
  string url = 1;
  int32 expires_in_seconds = 2;
}

message InvalidateDocumentRequest {
  int64 schedule_id = 1;
  int64 document_id = 2;
  string reason = 3;
}
message InvalidateDocumentResponse { ShippingDocument document = 1; }

message ListArrivalNotificationsRequest { bool unread_only = 1; }
message ListArrivalNotificationsResponse {
  repeated ArrivalReminder reminders = 1;
  int64 unread_count = 2;
}
message MarkArrivalReminderReadRequest { int64 reminder_id = 1; }
message MarkArrivalReminderReadResponse { ArrivalReminder reminder = 1; }
message CleanupExpiredArrivalRemindersRequest {}
message CleanupExpiredArrivalRemindersResponse { int64 deleted_count = 1; }

message GetArrivalReminderRulesRequest { int64 schedule_id = 1; }
message GetArrivalReminderRulesResponse { repeated int32 lead_days = 1; }
message UpdateArrivalReminderRulesRequest {
  int64 schedule_id = 1;
  repeated int32 lead_days = 2;
}
message UpdateArrivalReminderRulesResponse { repeated int32 lead_days = 1; }

// BlReminder 是提单签发提醒收件箱里的一条。
message BlReminder {
  int64 id = 1;
  int64 schedule_id = 2;
  string schedule_no = 3;
  string vessel_name = 4;
  string voyage_no = 5;
  string contract_no = 6;
  string customer_name = 7;
  // 开船后第几轮（每 3 天一轮）。
  int32 period_no = 8;
  string departed_on = 9;
  string title = 10;
  string content = 11;
  string detail_url = 12;
  string created_at = 13;
  bool unread = 14;
}

message ListBlRemindersRequest {
  bool unread_only = 1;
  int32 limit = 2;
}
message ListBlRemindersResponse {
  repeated BlReminder items = 1;
  int64 unread_total = 2;
}

message MarkBlRemindersReadRequest {
  // 空 = 全部标记已读。
  repeated int64 ids = 1;
}
message MarkBlRemindersReadResponse { int64 marked = 1; }

message ContractShippingSnapshotRequest {
  // 按合同号关联而不是合同 id：shipping_schedules.contract_id 可空，
  // 真正建了索引也真正填得住的是 contract_no。
  repeated string contract_nos = 1;
}

// 一张合同最新一班船的状态。合同可能分几批走，一览表只放最新那一班；
// leg_count 一并给出，好让页面能说「共 3 班」而不是假装只有一班。
message ContractShippingSnapshotItem {
  string contract_no = 1;
  int64 schedule_id = 2;
  string schedule_no = 3;
  string vessel_name = 4;
  string voyage_no = 5;
  string status = 6;
  string etd = 7;
  string atd = 8;
  string eta = 9;
  string ata = 10;
  int32 delay_days = 11;
  int32 leg_count = 12;
}

message ContractShippingSnapshotResponse {
  repeated ContractShippingSnapshotItem items = 1;
}

// D4 messages are appended to preserve generated message indexes.
message GetContractShippingHandoffRequest { int64 id = 1; }
message GetContractShippingHandoffResponse { ContractShippingHandoff handoff = 1; }
message SaveContractShippingRequoteDraftRequest {
  int64 id = 1; int64 final_forwarder_id = 2; string final_forwarder_name = 3;
  int64 actual_carrier_id = 4; string actual_carrier_name = 5; string final_service_option = 6;
  string final_currency = 7; string final_freight_amount = 8; string final_etd = 9;
  string final_eta = 10; string payment_terms = 11; string forwarder_contract_no = 12;
  string remark = 13;
  int64 option_id = 14;
}
message SaveContractShippingRequoteDraftResponse { ContractShippingHandoff handoff = 1; ShippingRequoteOption option = 2; }
message SubmitContractShippingRequoteRequest {
  int64 id = 1; int64 final_forwarder_id = 2; string final_forwarder_name = 3;
  int64 actual_carrier_id = 4; string actual_carrier_name = 5; string final_service_option = 6;
  string final_currency = 7; string final_freight_amount = 8; string final_etd = 9;
  string final_eta = 10; string payment_terms = 11; string forwarder_contract_no = 12;
  string remark = 13;
  int64 option_id = 14;
}
message SubmitContractShippingRequoteResponse { ContractShippingHandoff handoff = 1; }
message ShippingRequoteOption {
  int64 id = 1; int64 handoff_id = 2; int64 forwarder_id = 3; string forwarder_name = 4;
  int64 actual_carrier_id = 5; string actual_carrier_name = 6; string service_option = 7;
  string currency = 8; string freight_amount = 9; string etd = 10; string eta = 11;
  string payment_terms = 12; string remark = 13; int64 created_by = 14;
  string created_by_name = 15; string created_at = 16; string updated_at = 17;
}
message ListContractShippingRequoteOptionsRequest { int64 handoff_id = 1; }
message ListContractShippingRequoteOptionsResponse { repeated ShippingRequoteOption options = 1; }
message DeleteContractShippingRequoteOptionRequest { int64 handoff_id = 1; int64 option_id = 2; }
message DeleteContractShippingRequoteOptionResponse {}
message SelectContractShippingRequoteDraftRequest { int64 handoff_id = 1; int64 option_id = 2; }
message SelectContractShippingRequoteDraftResponse { ContractShippingHandoff handoff = 1; }
message SaveContractShippingContractRequest { int64 id = 1; string file_key = 2; string file_name = 3; string contract_no = 4; }
message PresignContractShippingContractUploadRequest { int64 id = 1; string file_name = 2; }
message PresignContractShippingContractUploadResponse { string file_key = 1; string upload_url = 2; int32 expires_seconds = 3; }
message SaveContractShippingContractResponse { ContractShippingHandoff handoff = 1; }
message VerifyContractShippingContractRequest { int64 id = 1; }
message VerifyContractShippingContractResponse { ContractShippingHandoff handoff = 1; }
message MarkContractShippingPaymentRequestedRequest { int64 id = 1; }
message MarkContractShippingPaymentRequestedResponse { ContractShippingHandoff handoff = 1; }
