version: v2
clean: false
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/sgao19/erp-go/gen/go
plugins:
  - local: bin/protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: bin/protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative

