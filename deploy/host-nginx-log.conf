# 访问日志里记下「这一次花了多久」。
#
# 服务器上的位置：/etc/nginx/conf.d/erp-timing.conf
# 由发行版 nginx.conf 的 http 块里那句 `include /etc/nginx/conf.d/*.conf;`
# 自动带进去，不需要改任何别的文件。
#
# 为什么单开一个文件、而不是并进 host-nginx.conf：log_format **只能写在 http
# 块里**，而那一份是 include 进 443 的 server 块的，写进去 nginx 起不来。
#
# ---------------------------------------------------------------------------
# 为什么要加
#
# 2026-09-21 查「中国大陆访问一直没数据」时，发现日志用的是发行版默认的
# combined 格式——它记状态码和字节数，**不记时间**。于是「慢」这件事在日志里
# 根本不存在：能看到有人中途掐断（499），看不到他等了多久，也分不清那几秒是
# 花在我们这边算数据，还是花在把数据送过太平洋。
#
# 两个字段正好把这件事劈开：
#
#   urt (upstream_response_time)  网关从收到请求到把最后一个字节交给 nginx
#   rt  (request_time)            nginx 从读到请求第一个字节到把响应写完
#
# rt 一直算到**内容真的发给了客户端**，所以 rt − urt 基本就是这条网络路上的
# 时间。美国的客户端这两个数几乎一样；中国的客户端 urt 照旧很小而 rt 被拉得
# 很长——那个差值就是我们一直在猜、却从来没量过的东西。
#
# 只加在末尾，不动前面十二个字段：现成的排查命令都是按位置取列的
# （awk $9 是状态码、$10 是字节数），改动顺序会让它们静悄悄地取错列。
log_format erp_timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

# **access_log 在同一层是叠加的，不是覆盖的。**
#
# 2026-09-21 我按「后面那条顶掉前面那条」写，于是发行版 nginx.conf 里那句
# `access_log /var/log/nginx/access.log;` 和这一句同时生效——每个请求被写进
# 同一个文件**两次**，一行旧格式一行新格式。日志体积翻倍，而且任何按行数
# 统计的东西都多出一倍。我自己先被它骗了一回，把「同一秒两行」读成了「前端
# 请求了两次」，还照这个结论给人报了一条不存在的 bug。
#
# **`access_log off;` 不是解法**，试过：它把这一层的访问日志整个关掉，后面
# 再写一条也不再生效——生产上有几分钟一行都没记（2026-09-22 08:23~08:26）。
#
# 唯一干净的办法是让那一层只剩一条：发行版那句已经在服务器上注释掉了，
# 行尾留着记号：
#
#     # access_log /var/log/nginx/access.log;  # ERP: 见 conf.d/erp-timing.conf（带耗时）
#
# 这是**本项目唯一一处改发行版 nginx.conf 的地方**。重建机器时别忘了，见
# docs/DEPLOY.md「前门 nginx」。路径故意和原来一致：日志轮转、现有的排查
# 命令、还有任何看惯了这个路径的人，都不用跟着改。
access_log /var/log/nginx/access.log erp_timed;
