# The only part of this system that has any business facing the internet.
#
# An open-tracking pixel is fetched by a stranger's mail client, so the URL in
# it has to resolve from outside. The obvious move — point a tunnel at the
# gateway — publishes the whole API: /api/auth/login, every authenticated
# route, and with them whatever the session secret happens to be. That is a
# large door opened for a 42-byte GIF.
#
# So this forwards exactly one path and answers everything else with 404. Not
# 403: a probe should not learn that there is something here to find.

server {
    listen 8081;
    server_name _;

    # Nothing about this service is worth advertising.
    server_tokens off;

    # The pixel, and only the pixel. The message key is a UUID; the regex
    # accepts that shape and nothing else, so this cannot be walked into a
    # path elsewhere in the API.
    location ~ "^/api/public/mail-open/[0-9a-fA-F-]{36}$" {
        # A mail client issues GET (and some issue HEAD first). Anything that
        # could change state is not part of fetching an image.
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The recorded open notes the fetching address, which is a rough
        # signal about proxies (Gmail fetches from Google, not the reader).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # A mail client that waits is a mail client that has already given up.
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        # The gateway answers this route without a session by design; make
        # sure nothing downstream caches a per-message response as shared.
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
