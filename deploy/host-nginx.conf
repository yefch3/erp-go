# ERP 前门中我们自己写的那一半。
#
# 服务器上的位置：/etc/nginx/snippets/erp-app.conf
# 由 /etc/nginx/sites-enabled/erp 的 443 server 块 include 进去。
#
# 为什么只有一半：那个 server 块是 certbot 管的——listen 443 ssl http2、
# 证书路径、80→443 跳转都由它写入，行尾都留着 "# managed by Certbot"。把整份
# 抄进仓库的话，certbot 一改就和这里对不上，而一个看着权威、实际过期的文件
# 比没有文件更坏。拆开之后这份是逐字为真的：certbot 碰不到它。
#
# 重建机器时怎么放回去，见 docs/DEPLOY.md「前门 nginx」一节。

# 附件上传的上限；网关自身另有约束，这里只需不比它小。
client_max_body_size 64m;

# ---------------------------------------------------------------- 压缩
#
# 2026-09-21 之前，这个站**只有 HTML 是压缩的**，JS、CSS、还有全部 API 的
# JSON 都是原样过太平洋的。
#
# 原因在发行版自带的 /etc/nginx/nginx.conf 里：那份文件写着 `gzip on;`，
# 而下面 `gzip_types ...` 那一行是**注释掉的**。少了 gzip_types，nginx 用
# 的是内置默认值——`text/html`，就这一个类型。于是「gzip 开着」和「几乎什
# 么都没压」同时成立，而且从美国看一切正常：那条线快到看不出差别。
#
# 从中国看就不是了。实测当时：
#
#   index-*.js    334 KB  →  压缩后 120 KB（省 65%）
#   index-*.css   357 KB  →  压缩后  47 KB（省 87%）
#   /api/inquiry-workspace 最大回 317 KB 的 JSON，一点没压
#
# 写在这儿而不是去改发行版那份文件：那份文件归 apt 管，nginx 一升级就可能
# 被覆盖，而且它不在版本控制里。写在这个 snippet 里，仓库这份是逐字为真的。
# 同一个指令在 server 块里出现就压过 http 块里的那个,这正是要的。
gzip on;
# 少了这一行等于没开，见上。text/event-stream **故意不在列**——见 /api/events。
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;
# 小响应不值得压：压缩要花 CPU，还要多一个 Content-Encoding 头。默认的 20
# 字节太小了，一个 `{"ok":true}` 压完可能比原来还大。
gzip_min_length 256;
# 5 而不是默认的 1：从 1 调到 5 大约再多省 10~15%，CPU 代价在这台机器上可
# 以忽略（内存剩 13 GB、负载常年很低）。9 再往上只多省 1~2%，不值。
gzip_comp_level 5;
# 告诉中间的缓存「同一个地址有压缩和不压缩两个版本」。现在没有 CDN，所以
# 它今天不起作用；等哪天真在前面放一层，少了它会把压缩过的内容发给不支持
# 压缩的客户端，而那种错的样子是页面变成乱码。
gzip_vary on;

# 反代身份：网关开着 TRUST_PROXY_HEADERS，只认这里写的来源地址。
#
# 必须是覆写而不是追加。追加的话客户端可以自带一个 X-Forwarded-For，网关会把
# 伪造的那个当成真来源——登录限速会认错人，审计记录里的「来源地址」也是假的。
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# 告诉浏览器：这个域名以后永远别用 http 找我。
#
# 没有这一条，80→443 跳转的**第一个来回是明文的**——网络上有人就能看见，甚至
# 把人引到假站点。有了它，浏览器记住之后自己升级成 https，那一步明文请求消失。
#
# 代价要清楚：一年内浏览器会拒绝用 http 访问本域名，而且**证书一旦过期，用户
# 看到的是点不过去的错误页**（平时可以点「继续访问」，有 HSTS 就不行）。所以它
# 成立的前提是自动续期确实在跑——certbot.timer 必须是 active。
#
# 没加 includeSubDomains：目前没有子域名，而当前域名是动态 DNS 的，将来换正式
# 域名时不该给自己留一个管不着的承诺。
add_header Strict-Transport-Security "max-age=31536000" always;

# SSE：缓冲必须关，否则事件在 nginx 手里攒着不走。
location /api/events {
    proxy_pass http://127.0.0.1:8080;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;

    # 压缩在这条路上必须关。
    #
    # 压缩天然要攒一批数据才压得动，那和上面那句 proxy_buffering off 是
    # 正相反的两件事——一个刚把事件放行，另一个又把它扣下来。SSE 的内容
    # 类型是 text/event-stream，本来就不在 gzip_types 里，所以今天关不关
    # 都一样；写出来是为了下一个往那张表里加类型的人：手一抖把这个类型
    # 加进去，推送会变成「几十秒才到一批」，而且不报任何错。
    gzip off;

    # 这里的 1.1 说的是 nginx→网关那一段，和客户端走 HTTP/2 不冲突。
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 下面三行看着是上面那三行的重复，删不得。
    #
    # nginx 的规则：proxy_set_header 只在当前层**一条都没有**时才继承上层的。
    # 这个块因为上面那句 Connection 已经有了一条，于是上层的 Host /
    # X-Forwarded-For / X-Forwarded-Proto 对它**全部失效**。
    #
    # 后果是 SSE 这条路上的 X-Forwarded-For 不再被覆写，客户端自带的那个会原样
    # 送到网关，而网关开着 TRUST_PROXY_HEADERS——审计记录里的来源地址就成了
    # 客户端说了算。2026-08-25 把配置纳入版本控制时发现，一并修掉。
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://127.0.0.1:8080;
}

# 在线 Office（OnlyOffice Document Server，docs 容器）。编辑器的页面、脚本、
# 长连接全从这儿过，所以要 WebSocket 那两行；末尾的斜杠是把 /docs/ 剥掉再转。
# X-Forwarded-Host 带着 /docs：它用这个拼自己的绝对地址，少了会把浏览器指到
# 根路径去。
location /docs/ {
    proxy_pass http://127.0.0.1:8083/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    # 写死 "upgrade" 而不是常见的 $connection_upgrade：那个变量要靠 http 层的一
    # 条 map 才有，而这份文件是 include 进 server 块的，加不了 map；服务器上的
    # nginx.conf 里也没有它（2026-09-13 查过）。普通请求带着这个头无害。
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    # 同 /api/events 那段：这一层写了自己的 proxy_set_header，上层那三行对它
    # 全部失效，得重写。
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host/docs;
}

location / {
    proxy_pass http://127.0.0.1:8082;
}
