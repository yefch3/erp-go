# 本地开发起全套；**生产也在跑这个文件里的 redis 和 kafka**。
#
# 生产的 postgres 是 RDS、附件是 S3，所以那两个只在本地起——生产上起的是
#
#     docker compose -f deploy/docker-compose.infra.yml up -d redis kafka
#
# 「本地专用」这句话原来写在这里，害得 restart 策略一直没人补：本地开发不需要
# 容器自己爬起来，生产需要。2026-08-27 查出来时，十三个业务容器都是
# unless-stopped，redis 和 kafka 是 no——机器一重启，业务容器全起来、这两个
# 不起来，而系统看上去是好的（healthz 只答「网关活着」）。见下面 redis 那段。
#
# Host ports are shifted (+offset) so this stack can run next to anything
# already using 5432/6379/9092; override via env.
name: erp-go-infra

services:
  postgres:
    image: postgres:16-alpine
    # 只在本地起（生产是 RDS）。策略跟另外三个保持一致——「这个有那个没有」
    # 正是这次漏掉 redis 的原因。本地不想让它开机自启就 make down。
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
      POSTGRES_DB: postgres
    # Loopback only. Postgres, Redis, Kafka and MinIO are reached by the
    # services over the compose network; the published port is for psql from
    # this machine. 5432 and 6379 are on the first page of every scanner's
    # list, so a cloud host publishing them on 0.0.0.0 is found the same day.
    ports:
      - "127.0.0.1:${PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    # 生产也跑它，理由同 redis。Kafka 停了业务不会报错，只是领域事件在生产者
    # 那头一直重试、消费者那头什么都收不到——同样是没人看得见的那种坏。
    restart: unless-stopped
    environment:
      # Kafka's own default is -Xms1G -Xmx1G, and -Xms is claimed at startup
      # whether or not there is traffic: 1 GB resident to carry a handful of
      # domain events. A small heap is what Kafka wants anyway - log segments
      # live in the OS page cache, not on the heap, so memory handed to the
      # JVM is memory taken away from the thing that actually serves reads.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  redis:
    image: redis:7-alpine
    # Redis 停摆是**静默**的：限流、登录失败节流、幂等三处在连不上时都选择
    # 放行（宁可不拦，也不要因为 Redis 故障让全公司登不上），只写一条 WARN；
    # healthz 又只回答「网关活着」。于是「Redis 没在跑」这件事，机器层监控
    # 看不见、员工也感觉不到——除了暴力破解防护已经没了。所以它必须自己
    # 爬得起来。
    restart: unless-stopped
    # 内存护栏。库里的键都带 TTL，正常涨不到这里；这条挡的是「出了别的问题
    # 导致无界增长」——真涨满了，默认的 noeviction 会让写入失败，而这台机器上
    # 还住着十三个业务容器，宁可丢最旧的键也不能把主机撑爆。
    #
    # --save 三条是 redis 镜像的默认值，照抄一遍：一旦写了 command，镜像里
    # 那份默认配置就不生效了，不重复写就等于顺手把落盘关掉了。
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 3600 1 --save 300 100 --save 60 10000
    volumes:
      # 具名卷。不写的话用的是镜像自带的匿名卷，docker volume prune 会顺手
      # 清掉——里面的东西都可重建（大不了重新验一次邮箱授权码），但一个叫得
      # 出名字的卷才管得住。
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    # 只在本地起（生产是 S3）。理由同 postgres。
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: erp
      MINIO_ROOT_PASSWORD: erp_dev_password
    ports:
      - "127.0.0.1:${MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
  kafkadata:
  miniodata:
  redisdata:
