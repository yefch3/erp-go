# Production overlay: binaries from GHCR pinned to one git SHA, and every
# value that must differ from the dev defaults injected from the server's
# own .env — DSNs pointing at RDS with per-service passwords that are not
# the repository's, and object storage pointing at S3 instead of the MinIO
# container.
#
#   ERP_SHA=<git-sha> docker compose \
#     -f deploy/docker-compose.services.yml -f deploy/docker-compose.prod.yml \
#     pull && ... up -d
#
# The base file keeps its build: sections and its hardcoded dev values for
# development; this overlay replaces exactly the set a production box may
# not run with.
#
# ${VAR:?} 是给「部署那台机器才知道的值」用的：数据库连接串、对象存储的
# 密钥、镜像 SHA。少一个必须在 compose 阶段就大声失败，而不是等到运行时。
#
# **但它只该用在那一类值上。** 一个 compose 网络里的服务名（kafka:9092）
# 标成必填，换来的是部署停在插值那一步——早于拉镜像、早于迁库，什么都没
# 换，而 healthz 照常回上一个好版本。外面看一切正常，只是从那一刻起再也
# 发不上去。2026-09-01 就是这么连着四次没人发现的。
# scripts/check-compose-env.sh 现在盯着这份清单。
# See docs/DEPLOY-PIPELINE.md and docs/DEPLOY.md 三.
#
# MINIO_USE_SSL is the string "true", not "1" — the services compare
# literally against "true".

services:
  iam:
    image: ghcr.io/yefch3/erp-go/iam:${ERP_SHA:?production runs pinned images — pass ERP_SHA=<git-sha>}
    environment:
      DB_DSN: ${IAM_DB_DSN:?set in deploy/.env}
      # 员工头像进共享的桶，和工厂资质扫描件、合同附件同一个。
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
  masterdata:
    image: ghcr.io/yefch3/erp-go/masterdata:${ERP_SHA}
    environment:
      DB_DSN: ${MASTERDATA_DB_DSN:?set in deploy/.env}
      # Factory certificate scans go to the shared bucket.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_REGION: ${MINIO_REGION:-us-west-2}
  fx:
    image: ghcr.io/yefch3/erp-go/fx:${ERP_SHA}
    environment:
      DB_DSN: ${FX_DB_DSN:?set in deploy/.env}
  product:
    image: ghcr.io/yefch3/erp-go/product:${ERP_SHA}
    environment:
      DB_DSN: ${PRODUCT_DB_DSN:?set in deploy/.env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?set in deploy/.env}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?set in deploy/.env}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in deploy/.env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in deploy/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:?set in deploy/.env}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_REGION: ${MINIO_REGION:-us-west-2}
  approval:
    image: ghcr.io/yefch3/erp-go/approval:${ERP_SHA}
    environment:
      DB_DSN: ${APPROVAL_DB_DSN:?set in deploy/.env}
  export:
    image: ghcr.io/yefch3/erp-go/export:${ERP_SHA}
    environment:
      DB_DSN: ${EXPORT_DB_DSN:?set in deploy/.env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_REGION: ${MINIO_REGION:-us-west-2}
  inventory:
    image: ghcr.io/yefch3/erp-go/inventory:${ERP_SHA}
    environment:
      DB_DSN: ${INVENTORY_DB_DSN:?set in deploy/.env}
  procurement:
    image: ghcr.io/yefch3/erp-go/procurement:${ERP_SHA}
    environment:
      DB_DSN: ${PROCUREMENT_DB_DSN:?set in deploy/.env}
      # Invoice scans go to the same bucket as everything else.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_REGION: ${MINIO_REGION:-us-west-2}
  shipping:
    image: ghcr.io/yefch3/erp-go/shipping:${ERP_SHA}
    environment:
      DB_DSN: ${SHIPPING_DB_DSN:?set in deploy/.env}
      # KAFKA_BROKERS **刻意不在这里覆盖**。
      #
      # 基础的 services.yml 已经给五个用 Kafka 的服务都写死了 kafka:9092——
      # 那是 compose 网络里的服务名，不是一个部署时才知道的值，所以它不属于
      # .env。另外四个（approval / inventory / procurement / export）都是这么
      # 拿的，shipping 也一样。
      #
      # 曾经这里有一行把 KAFKA_BROKERS 标成必填的覆盖。它让 compose 在
      # **插值阶段**就失败——早于拉镜像、早于迁库，所以整条部署停在第一步，
      # 而 healthz 照常回旧版本：线上一切正常，只是从那一刻起再也发不上去。
      # 连着四次部署都是这么失败的，没人发现，因为「没上线」不长在任何页面上。
      CONTRACT_TOPIC: ${CONTRACT_TOPIC:-erp.export.contract.v1}
      CONTRACT_CONSUMER_GROUP: ${SHIPPING_CONTRACT_CONSUMER_GROUP:-shipping.contract.v1}
      # shipping stores files too (拖车单等) — missed on the first pass and
      # found the honest way: the container crash-looping on minio:9000.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_REGION: ${MINIO_REGION:-us-west-2}
  mail:
    image: ghcr.io/yefch3/erp-go/mail:${ERP_SHA}
    environment:
      DB_DSN: ${MAIL_DB_DSN:?set in deploy/.env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_REGION: ${MINIO_REGION:-us-west-2}
  gateway:
    image: ghcr.io/yefch3/erp-go/gateway:${ERP_SHA}
    environment:
      # /api/healthz reports this back, so a deploy can confirm the swap
      # happened instead of inferring it from silence.
      ERP_SHA: ${ERP_SHA}
      # Not in the base file's environment at all — dev never sets them, so
      # this overlay is the only path by which they reach the container.
      # TRUST_PROXY_HEADERS is unconditional here: this overlay IS the
      # behind-a-reverse-proxy deployment.
      TRUST_PROXY_HEADERS: "1"
      # 0 until TLS exists (the IP-only phase serves plain http); flipped to
      # 1 in .env the day the domain and certificate land. DEPLOY.md 三.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    # The base file publishes 8080 on every interface, which is right for a
    # laptop and wrong behind nginx: the proxy is the one public door.
    # !override replaces the list instead of appending to it.
    ports: !override
      - "127.0.0.1:8080:8080"

  # The built SPA behind the host nginx (which owns the public port and, once
  # a domain exists, the certificates; it proxies / here and /api to the
  # gateway). Loopback-only like everything else. 8082 because 8081 already
  # belongs to pixel-proxy in the base file.
  frontend:
    image: ghcr.io/yefch3/erp-go/frontend:${ERP_SHA}
    restart: unless-stopped
    networks: [infra]
    ports:
      - "127.0.0.1:8082:80"
