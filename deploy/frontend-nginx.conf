# Serves the built SPA. History-mode routing means /emails is a real URL the
# browser may ask for directly; every path that is not a file falls back to
# index.html and the router takes it from there.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets can be cached forever — a new build gives them new names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the pointer to the current build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
