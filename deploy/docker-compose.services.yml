# Application services, one container each, joined onto the infra network
# (deploy/docker-compose.infra.yml must be up first, and migrations applied:
# make up && make migrate && make services-up).
#
# In-network DSNs use postgres:5432 (the container port); host ports below
# are for grpcurl/frontend access from the Mac.
name: erp-go-services

services:
  iam:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: iam }
    image: erp-go/iam:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_iam:erp_iam_pw@postgres:5432/erp_iam?sslmode=disable
      GRPC_PORT: "9001"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      # Read by iam (which issues) and the gateway (which renews). Both must
      # see the same value, so it is written from one variable in both places
      # — a token renewed to a different length than login hands out is the
      # kind of drift nobody notices until sessions end at odd times.
      #
      # Because the gateway renews on activity, this is an IDLE timeout.
      JWT_TTL: ${JWT_TTL:-12h}
      # The first tenant, seeded only into an empty database.
      COMPANY_NAME: ${COMPANY_NAME:-AAA Industry Inc}
      # The domains that route to this company. gmail.com is here for
      # development: Gmail's +alias addressing turns one real mailbox into as
      # many distinct employees as a test needs, so the whole invite-activate
      # flow can be exercised before 263 is ever involved. Drop it in
      # production — a public mail domain must never route to a tenant.
      COMPANY_MAIL_DOMAINS: ${COMPANY_MAIL_DOMAINS:-aaaindustryinc.com,gmail.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-fangchen1101@gmail.com}
    # Loopback only, like every service below it.
    #
    # These ports exist for a developer with grpcurl, and for nothing else: the
    # services reach each other over the compose network by name, which does
    # not use published ports at all. Deleting the whole block would work
    # equally well and would cost a little convenience.
    #
    # Bound rather than deleted, and bound rather than firewalled, because of
    # what these services are. None of them checks a JWT — the gateway does
    # that once and passes the identity along as metadata, which is the right
    # split only for as long as nobody else can reach them. Anyone who can
    # open a socket here is an administrator of every tenant, no password
    # required.
    #
    # A plain "9001:9001" binds 0.0.0.0. On a laptop that means the whole
    # office wifi; on a cloud host it means the internet, where scanners find
    # an open 5432 or 9001 within hours. And do not reach for ufw instead:
    # Docker writes its own iptables rules ahead of ufw's, so a published port
    # answers even when the firewall says it should not. The bind address is
    # the control that actually holds.
    ports:
      - "127.0.0.1:9001:9001"
    networks: [infra]
    restart: unless-stopped

  masterdata:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: masterdata }
    image: erp-go/masterdata:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_masterdata:erp_masterdata_pw@postgres:5432/erp_masterdata?sslmode=disable
      GRPC_PORT: "9002"
    ports:
      - "127.0.0.1:9002:9002"
    networks: [infra]
    restart: unless-stopped

  fx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: fx }
    image: erp-go/fx:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_fx:erp_fx_pw@postgres:5432/erp_fx?sslmode=disable
      GRPC_PORT: "9003"
    ports:
      - "127.0.0.1:9003:9003"
    networks: [infra]
    restart: unless-stopped

  product:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: product }
    image: erp-go/product:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_product:erp_product_pw@postgres:5432/erp_product?sslmode=disable
      GRPC_PORT: "9004"
      MASTERDATA_ADDR: masterdata:9002
      MINIO_ENDPOINT: minio:9000
      # Presigned URLs are handed to browsers, which reach MinIO on the host
      # port - and SigV4 signs the host, so it must be signed for this one.
      MINIO_PUBLIC_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: erp
      MINIO_SECRET_KEY: erp_dev_password
      MINIO_BUCKET: erp-files
    ports:
      - "127.0.0.1:9004:9004"
    networks: [infra]
    depends_on: [masterdata]
    restart: unless-stopped

  approval:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: approval }
    image: erp-go/approval:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_approval:erp_approval_pw@postgres:5432/erp_approval?sslmode=disable
      GRPC_PORT: "9005"
      IAM_ADDR: iam:9001
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
    ports:
      - "127.0.0.1:9005:9005"
    networks: [infra]
    depends_on: [iam]
    restart: unless-stopped

  export:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: export }
    image: erp-go/export:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_export:erp_export_pw@postgres:5432/erp_export?sslmode=disable
      GRPC_PORT: "9006"
      MASTERDATA_ADDR: masterdata:9002
      PRODUCT_ADDR: product:9004
      FX_ADDR: fx:9003
      APPROVAL_ADDR: approval:9005
      IAM_ADDR: iam:9001
      KAFKA_BROKERS: kafka:9092
      STOCK_TOPIC: erp.inventory.stock.v1
      STOCK_CONSUMER_GROUP: export.stock.v1
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      # Browsers reach MinIO on the host port, and SigV4 signs the host, so
      # presigned URLs must be signed for this one.
      MINIO_PUBLIC_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: erp
      MINIO_SECRET_KEY: erp_dev_password
      MINIO_BUCKET: erp-files
    ports:
      - "127.0.0.1:9006:9006"
    networks: [infra]
    depends_on: [masterdata, product, fx, approval, iam]
    restart: unless-stopped

  inventory:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: inventory }
    image: erp-go/inventory:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_inventory:erp_inventory_pw@postgres:5432/erp_inventory?sslmode=disable
      GRPC_PORT: "9008"
      MASTERDATA_ADDR: masterdata:9002
      KAFKA_BROKERS: kafka:9092
      CONTRACT_TOPIC: erp.export.contract.v1
      STOCK_TOPIC: erp.inventory.stock.v1
      CONSUMER_GROUP: inventory.contract.v1
      PURCHASE_TOPIC: erp.procurement.purchase.v1
      PURCHASE_CONSUMER_GROUP: inventory.purchase.v1
    ports:
      - "127.0.0.1:9008:9008"
    networks: [infra]
    depends_on: [export, masterdata]
    restart: unless-stopped

  procurement:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: procurement }
    image: erp-go/procurement:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_procurement:erp_procurement_pw@postgres:5432/erp_procurement?sslmode=disable
      GRPC_PORT: "9007"
      MASTERDATA_ADDR: masterdata:9002
      APPROVAL_ADDR: approval:9005
      INVENTORY_ADDR: inventory:9008
      FX_ADDR: fx:9003
      IAM_ADDR: iam:9001
      KAFKA_BROKERS: kafka:9092
      CONTRACT_TOPIC: erp.export.contract.v1
      CONSUMER_GROUP: procurement.contract.v1
      APPROVAL_TOPIC: erp.approval.task.v1
      APPROVAL_CONSUMER_GROUP: procurement.approval.v1
      PURCHASE_TOPIC: erp.procurement.purchase.v1
      REDIS_ADDR: redis:6379      # Three-way-match tolerance; see procurement cmd/main.go. Passed through
      # because an env var the compose file does not carry is silently dead —
      # the MAIL_UNLOCK_TTL lesson.
      MATCH_TOLERANCE_PCT: ${MATCH_TOLERANCE_PCT:-}
      MATCH_TOLERANCE_ABS: ${MATCH_TOLERANCE_ABS:-}
    ports:
      - "127.0.0.1:9007:9007"
    networks: [infra]
    depends_on: [inventory, masterdata, approval, fx, iam]
    restart: unless-stopped

  shipping:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: shipping }
    image: erp-go/shipping:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_shipping:erp_shipping_pw@postgres:5432/erp_shipping?sslmode=disable
      GRPC_PORT: "9009"
      IAM_ADDR: iam:9001
      MASTERDATA_ADDR: masterdata:9002
      # Empty REDIS_ADDR silently disables the arrival-reminder live push
      # (services/shipping/cmd/main.go guards on it), so it must be set here.
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: erp
      MINIO_SECRET_KEY: erp_dev_password
      MINIO_BUCKET: erp-files
    ports:
      - "127.0.0.1:9009:9009"
    networks: [infra]
    depends_on: [iam, masterdata]
    restart: unless-stopped

  mail:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: mail }
    image: erp-go/mail:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      DB_DSN: postgres://erp_mail:erp_mail_pw@postgres:5432/erp_mail?sslmode=disable
      GRPC_PORT: "9010"
      MASTERDATA_ADDR: masterdata:9002
      IAM_ADDR: iam:9001
      # "dev" records what would have been sent instead of sending it. There
      # is no real provider configured yet; see docs/ARCHITECTURE.md 5.12.
      MINIO_ENDPOINT: minio:9000
      # Browsers reach MinIO on the host port, and SigV4 signs the host, so
      # presigned URLs must be signed for this one.
      MINIO_PUBLIC_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: erp
      MINIO_SECRET_KEY: erp_dev_password
      MINIO_BUCKET: erp-files
      MAIL_PROVIDER: ${MAIL_PROVIDER:-dev}
      # Encrypts stored mailbox credentials. Deliberately has no default:
      # a fallback here would produce a system that looks encrypted and is
      # not. Set it in deploy/.env, which is gitignored.
      MAIL_CRED_KEY: ${MAIL_CRED_KEY:-}
      MAIL_BATCH_SIZE: "20"
      MAIL_SEND_DELAY: 100ms
      MAIL_DECISION_WINDOW: 10m
      MAIL_SEND_TIMEOUT: 45s
      # How far back the backfill walks, per folder. The code's default of 500
      # is about three weeks of this mailbox, and a star or a reply on anything
      # older has no row here to attach to — a mail the ERP never fetched
      # cannot appear in it, however the host labels it. Raised deliberately:
      # the backfill costs one batch per sync pass until it gets there, and
      # storage after that.
      MAIL_SYNC_HISTORY: "2000"
      # Must be an address the recipient's mail client can actually reach.
      # Left empty in local development, which disables the pixel rather than
      # emitting one that points at the recipient's own machine.
      MAIL_PUBLIC_BASE_URL: ${MAIL_PUBLIC_BASE_URL:-}
      # User-triggered conversion of selected mail text/attachments to Excel.
      # The key stays server-side; no request can supply or override it.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-2m}
      # For pushing "new mail" hints to open browser tabs over the live feed.
      REDIS_ADDR: redis:6379
      # Google OAuth application credentials, from deploy/.env (gitignored).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:9010:9010"
    networks: [infra]
    depends_on: [masterdata, iam]
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: gateway }
    image: erp-go/gateway:dev
    environment:
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:?set it in deploy/.env — openssl rand -hex 32}
      IAM_ADDR: iam:9001
      MASTERDATA_ADDR: masterdata:9002
      FX_ADDR: fx:9003
      APPROVAL_ADDR: approval:9005
      PRODUCT_ADDR: product:9004
      EXPORT_ADDR: export:9006
      PROCUREMENT_ADDR: procurement:9007
      INVENTORY_ADDR: inventory:9008
      SHIPPING_ADDR: shipping:9009
      MAIL_ADDR: mail:9010
      REDIS_ADDR: redis:6379
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      MAIL_OAUTH_REDIRECT_URL: ${MAIL_OAUTH_REDIRECT_URL:-http://localhost:8080/api/oauth/google/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      # Employee owning the procurement shared mailbox. Zero keeps sending
      # disabled while still allowing RFQ workbook download and quote import.
      PROCUREMENT_MAIL_SENDER_ID: ${PROCUREMENT_MAIL_SENDER_ID:-0}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      # Must match iam's. See the note there.
      JWT_TTL: ${JWT_TTL:-12h}
      # How long one mailbox verification stays good before the person has to
      # log in to their mailbox again. The code has honoured this variable
      # since the unlock store was built; the compose file just never passed
      # it through, so setting it in .env silently did nothing.
      MAIL_UNLOCK_TTL: ${MAIL_UNLOCK_TTL:-12h}
      HTTP_PORT: "8080"
    # The one port that answers from elsewhere, because it is the one the
    # browser talks to. In front of a real deployment this belongs behind a
    # reverse proxy holding 443, with TRUST_PROXY_HEADERS turned on so the
    # per-source login limit meters the caller rather than the proxy.
    ports:
      - "8080:8080"
    networks: [infra]
    depends_on: [iam, masterdata, fx, approval, product, export, shipping, mail]
    restart: unless-stopped

  # The one door that may face outwards, and it is a very narrow one.
  #
  # An open-tracking pixel has to be fetchable by a stranger's mail client, so
  # MAIL_PUBLIC_BASE_URL has to name an address that resolves from the
  # internet. Pointing a tunnel at the gateway would be the quick way and it
  # publishes the entire API to get one 42-byte GIF out. This forwards exactly
  # /api/public/mail-open/<uuid> and 404s the rest; a tunnel points here.
  #
  # Bound to 127.0.0.1 so starting it changes nothing on its own — it is
  # reachable from this machine only until something is deliberately put in
  # front of it.
  pixel-proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./pixel-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8081:8081"
    networks: [infra]
    depends_on: [gateway]
    restart: unless-stopped

networks:
  infra:
    external: true
    name: erp-go-infra_default
