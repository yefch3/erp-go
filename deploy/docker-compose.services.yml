# Application services, one container each, joined onto the infra network
# (deploy/docker-compose.infra.yml must be up first, and migrations applied:
# make up && make migrate && make services-up).
#
# In-network DSNs use postgres:5432 (the container port); host ports below
# are for grpcurl/frontend access from the Mac.
name: erp-go-services

services:
  iam:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: iam }
    image: erp-go/iam:dev
    environment:
      DB_DSN: postgres://erp_iam:erp_iam_pw@postgres:5432/erp_iam?sslmode=disable
      GRPC_PORT: "9001"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    ports:
      - "9001:9001"
    networks: [infra]
    restart: unless-stopped

  masterdata:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: masterdata }
    image: erp-go/masterdata:dev
    environment:
      DB_DSN: postgres://erp_masterdata:erp_masterdata_pw@postgres:5432/erp_masterdata?sslmode=disable
      GRPC_PORT: "9002"
    ports:
      - "9002:9002"
    networks: [infra]
    restart: unless-stopped

  fx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: fx }
    image: erp-go/fx:dev
    environment:
      DB_DSN: postgres://erp_fx:erp_fx_pw@postgres:5432/erp_fx?sslmode=disable
      GRPC_PORT: "9003"
    ports:
      - "9003:9003"
    networks: [infra]
    restart: unless-stopped

  product:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: product }
    image: erp-go/product:dev
    environment:
      DB_DSN: postgres://erp_product:erp_product_pw@postgres:5432/erp_product?sslmode=disable
      GRPC_PORT: "9004"
      MASTERDATA_ADDR: masterdata:9002
      MINIO_ENDPOINT: minio:9000
      # Presigned URLs are handed to browsers, which reach MinIO on the host
      # port - and SigV4 signs the host, so it must be signed for this one.
      MINIO_PUBLIC_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: erp
      MINIO_SECRET_KEY: erp_dev_password
      MINIO_BUCKET: erp-files
    ports:
      - "9004:9004"
    networks: [infra]
    depends_on: [masterdata]
    restart: unless-stopped

  approval:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: approval }
    image: erp-go/approval:dev
    environment:
      DB_DSN: postgres://erp_approval:erp_approval_pw@postgres:5432/erp_approval?sslmode=disable
      GRPC_PORT: "9005"
      IAM_ADDR: iam:9001
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
    ports:
      - "9005:9005"
    networks: [infra]
    depends_on: [iam]
    restart: unless-stopped

  export:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: export }
    image: erp-go/export:dev
    environment:
      DB_DSN: postgres://erp_export:erp_export_pw@postgres:5432/erp_export?sslmode=disable
      GRPC_PORT: "9006"
      MASTERDATA_ADDR: masterdata:9002
      PRODUCT_ADDR: product:9004
      EXPORT_ADDR: export:9006
      FX_ADDR: fx:9003
      APPROVAL_ADDR: approval:9005
      IAM_ADDR: iam:9001
      KAFKA_BROKERS: kafka:9092
      STOCK_TOPIC: erp.inventory.stock.v1
      STOCK_CONSUMER_GROUP: export.stock.v1
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
      # Browsers reach MinIO on the host port, and SigV4 signs the host, so
      # presigned URLs must be signed for this one.
      MINIO_PUBLIC_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: erp
      MINIO_SECRET_KEY: erp_dev_password
      MINIO_BUCKET: erp-files
    ports:
      - "9006:9006"
    networks: [infra]
    depends_on: [masterdata, product, fx, approval, iam]
    restart: unless-stopped

  inventory:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: inventory }
    image: erp-go/inventory:dev
    environment:
      DB_DSN: postgres://erp_inventory:erp_inventory_pw@postgres:5432/erp_inventory?sslmode=disable
      GRPC_PORT: "9008"
      MASTERDATA_ADDR: masterdata:9002
      KAFKA_BROKERS: kafka:9092
      CONTRACT_TOPIC: erp.export.contract.v1
      STOCK_TOPIC: erp.inventory.stock.v1
      CONSUMER_GROUP: inventory.contract.v1
      PURCHASE_TOPIC: erp.procurement.purchase.v1
      PURCHASE_CONSUMER_GROUP: inventory.purchase.v1
    ports:
      - "9008:9008"
    networks: [infra]
    depends_on: [export, masterdata]
    restart: unless-stopped

  procurement:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: procurement }
    image: erp-go/procurement:dev
    environment:
      DB_DSN: postgres://erp_procurement:erp_procurement_pw@postgres:5432/erp_procurement?sslmode=disable
      GRPC_PORT: "9007"
      MASTERDATA_ADDR: masterdata:9002
      APPROVAL_ADDR: approval:9005
      KAFKA_BROKERS: kafka:9092
      STOCK_TOPIC: erp.inventory.stock.v1
      CONSUMER_GROUP: procurement.stock.v1
      APPROVAL_TOPIC: erp.approval.task.v1
      APPROVAL_CONSUMER_GROUP: procurement.approval.v1
      PURCHASE_TOPIC: erp.procurement.purchase.v1
      REDIS_ADDR: redis:6379
    ports:
      - "9007:9007"
    networks: [infra]
    depends_on: [inventory, masterdata, approval]
    restart: unless-stopped

  notification:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: notification }
    image: erp-go/notification:dev
    environment:
      DB_DSN: postgres://erp_notification:erp_notification_pw@postgres:5432/erp_notification?sslmode=disable
      GRPC_PORT: "9010"
      MASTERDATA_ADDR: masterdata:9002
      IAM_ADDR: iam:9001
      # "dev" records what would have been sent instead of sending it. There
      # is no real provider configured yet; see docs/ARCHITECTURE.md 5.12.
      MINIO_ENDPOINT: minio:9000
      # Browsers reach MinIO on the host port, and SigV4 signs the host, so
      # presigned URLs must be signed for this one.
      MINIO_PUBLIC_ENDPOINT: localhost:19000
      MINIO_ACCESS_KEY: erp
      MINIO_SECRET_KEY: erp_dev_password
      MINIO_BUCKET: erp-files
      MAIL_PROVIDER: ${MAIL_PROVIDER:-dev}
      # Encrypts stored mailbox credentials. Deliberately has no default:
      # a fallback here would produce a system that looks encrypted and is
      # not. Set it in deploy/.env, which is gitignored.
      MAIL_CRED_KEY: ${MAIL_CRED_KEY:-}
      MAIL_BATCH_SIZE: "20"
      MAIL_SEND_DELAY: 100ms
      MAIL_DECISION_WINDOW: 10m
      MAIL_SEND_TIMEOUT: 45s
      # Must be an address the recipient's mail client can actually reach.
      # Left empty in local development, which disables the pixel rather than
      # emitting one that points at the recipient's own machine.
      MAIL_PUBLIC_BASE_URL: ${MAIL_PUBLIC_BASE_URL:-}
      # For pushing "new mail" hints to open browser tabs over the live feed.
      REDIS_ADDR: redis:6379
      # Google OAuth application credentials, from deploy/.env (gitignored).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    ports:
      - "9010:9010"
    networks: [infra]
    depends_on: [masterdata, iam]
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { SERVICE: gateway }
    image: erp-go/gateway:dev
    environment:
      IAM_ADDR: iam:9001
      MASTERDATA_ADDR: masterdata:9002
      FX_ADDR: fx:9003
      APPROVAL_ADDR: approval:9005
      PRODUCT_ADDR: product:9004
      EXPORT_ADDR: export:9006
      PROCUREMENT_ADDR: procurement:9007
      INVENTORY_ADDR: inventory:9008
      NOTIFICATION_ADDR: notification:9010
      REDIS_ADDR: redis:6379
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      MAIL_OAUTH_REDIRECT_URL: ${MAIL_OAUTH_REDIRECT_URL:-http://localhost:8080/api/oauth/google/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      HTTP_PORT: "8080"
    ports:
      - "8080:8080"
    networks: [infra]
    depends_on: [iam, masterdata, fx, approval, product, export, notification]
    restart: unless-stopped

networks:
  infra:
    external: true
    name: erp-go-infra_default
